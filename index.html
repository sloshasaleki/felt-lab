/*
VOICE: a focused card-room training studio — calm, exact, a little tactile.
IDEA: the app behaves like a poker room: a felt table you sit at, a dealer's rail of sections, cards as real card stock.
PICTURE: a felt oval with real-looking cards and chips; equity and range pictures drawn like dealer tools.
COLOUR and TYPE: felt green dominates, ivory card stock supports, card-suit red is the sharp accent. Archivo (wide for titles).
LAYOUT: left rail on tablets/desktop, bottom tabs on phones; content in calm columns up to 1240px.
*/
:root{color-scheme:light;--bg:#f7f4ec;--surf:#ffffff;--surf2:#f0ebdf;--surf3:#e7e0d0;--ink:#0f1d17;--ink2:#3d4f46;--muted:#6a7a71;--line:#ddd5c4;--felt:#0d5a3b;--felt2:#0a4730;--feltink:#eaf6ef;--red:#c62f2c;--red2:#fbe5e3;--good:#0b7d3e;--goodbg:#e2f4e8;--bad:#c62f2c;--badbg:#fbe7e5;--warn:#9a6400;--warnbg:#fff2d6;--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s7:#6250d6;--raise:#c62f2c;--call:#2f9e5f;--fold:#d8d1c1;--tb:#7b2fbf;--cardface:#fbf8f1;--cardink:#14201a;--cardred:#c62f2c;--cardblue:#1e5fbf;--cardgreen:#16804a;--r:14px;--r2:10px;--shadow:0 1px 2px rgb(0 0 0/.06),0 6px 18px rgb(0 0 0/.07);--font:'Archivo',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
@media (prefers-color-scheme:dark){:root:where(:not([data-theme=light])){color-scheme:dark;--bg:#07110c;--surf:#0e1c15;--surf2:#13261c;--surf3:#1a3226;--ink:#eaf2ec;--ink2:#bcccc3;--muted:#8ea398;--line:#22392d;--felt:#0e6744;--felt2:#0b5238;--red:#ef5f5a;--red2:#3a1716;--good:#3fcf7d;--goodbg:#0f2f1d;--bad:#ff7a72;--badbg:#341615;--warn:#f0b54a;--warnbg:#33270e;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s7:#9085e9;--raise:#e0504b;--call:#2f9e5f;--fold:#2a3e33;--tb:#9d5ce0}}
:root[data-theme=dark]{color-scheme:dark;--bg:#07110c;--surf:#0e1c15;--surf2:#13261c;--surf3:#1a3226;--ink:#eaf2ec;--ink2:#bcccc3;--muted:#8ea398;--line:#22392d;--felt:#0e6744;--felt2:#0b5238;--red:#ef5f5a;--red2:#3a1716;--good:#3fcf7d;--goodbg:#0f2f1d;--bad:#ff7a72;--badbg:#341615;--warn:#f0b54a;--warnbg:#33270e;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s7:#9085e9;--raise:#e0504b;--call:#2f9e5f;--fold:#2a3e33;--tb:#9d5ce0}
:root[data-theme=light]{color-scheme:light}

*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:72px;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--font);overflow-x:clip;-webkit-tap-highlight-color:transparent}
h1,h2,h3,h4{font-stretch:112%;line-height:1.08;margin:0 0 .4em;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(30px,4.2vw,46px);font-weight:800}h2{font-size:clamp(22px,2.6vw,28px);font-weight:760}h3{font-size:19px;font-weight:720}h4{font-size:16px;font-weight:700}
p{margin:0 0 .9em}a{color:var(--felt)}small,.small{font-size:13.5px}.muted{color:var(--muted)}.ink2{color:var(--ink2)}
.num,td.n,th.n{font-variant-numeric:tabular-nums}
code{font-size:.92em;background:var(--surf2);padding:1px 5px;border-radius:5px;overflow-wrap:anywhere}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--s1);outline-offset:2px}
/* ---------- shell ---------- */
#app{display:grid;grid-template-columns:88px minmax(0,1fr);min-height:100vh;min-height:100dvh}
.rail{position:sticky;top:0;height:100vh;height:100dvh;background:var(--felt2);color:var(--feltink);display:flex;flex-direction:column;align-items:stretch;padding:12px 8px;gap:4px;z-index:20;
 background-image:radial-gradient(circle at 30% 10%,rgb(255 255 255/.08),transparent 60%)}
.rail .logo{display:grid;place-items:center;height:56px;margin-bottom:8px}
.rail a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 4px;border-radius:12px;color:inherit;text-decoration:none;font-size:12px;font-weight:600;opacity:.82;min-height:58px;justify-content:center}
.rail a svg{width:24px;height:24px}
.rail a:hover{opacity:1;background:rgb(255 255 255/.07)}
.rail a.on{opacity:1;background:var(--feltink);color:var(--felt2)}
.rail .sp{flex:1}
main{padding:0 0 90px;min-height:100vh}
.band{padding:clamp(20px,3.2vw,44px) max(4vw,16px)}
.wrap{max-width:1240px;margin:0 auto}
.narrow{max-width:820px;margin:0 auto}
@media(max-width:760px){#app{grid-template-columns:minmax(0,1fr)}.rail{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;flex-direction:row;padding:6px 6px calc(6px + env(safe-area-inset-bottom));gap:2px;overflow-x:auto}
 .rail .logo,.rail .sp{display:none}.rail a{flex:1 0 64px;min-height:52px;font-size:11px;padding:6px 2px}}
.topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.topbar .grow{flex:1}
.crumb{font-size:14px;color:var(--muted);text-decoration:none;display:inline-flex;align-items:center;gap:6px;min-height:44px}
.crumb:hover{color:var(--ink)}
/* ---------- surfaces ---------- */
.card{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
.card.felt{background:var(--felt);color:var(--feltink);border-color:transparent;background-image:radial-gradient(ellipse at 50% 0%,rgb(255 255 255/.12),transparent 70%)}
.card.felt .muted{color:#b9d8c7}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.gauto{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
@media(max-width:900px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:600px){.g2,.g3,.g4{grid-template-columns:minmax(0,1fr)}}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row.tight{gap:6px}.row.between{justify-content:space-between}.col{display:flex;flex-direction:column;gap:10px}
.sep{height:1px;background:var(--line);margin:16px 0}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:13px;font-weight:600;background:var(--surf2);color:var(--ink2);white-space:nowrap}
.pill.g{background:var(--goodbg);color:var(--good)}.pill.r{background:var(--badbg);color:var(--bad)}.pill.w{background:var(--warnbg);color:var(--warn)}.pill.f{background:var(--felt);color:var(--feltink)}
.stat{display:flex;flex-direction:column;gap:2px}.stat b{font-size:28px;font-stretch:110%;font-variant-numeric:tabular-nums;line-height:1.1}.stat span{font-size:13.5px;color:var(--muted)}
.big{font-size:clamp(36px,6vw,60px);font-weight:800;font-stretch:115%;line-height:1;font-variant-numeric:tabular-nums}
/* ---------- buttons & inputs ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--surf);color:var(--ink);font-weight:650;cursor:pointer;text-decoration:none;white-space:nowrap;transition:transform .08s,background .15s}
.btn:hover{background:var(--surf2)}.btn:active{transform:scale(.97)}
.btn.pri{background:var(--felt);border-color:var(--felt);color:var(--feltink)}.btn.pri:hover{background:var(--felt2)}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn.ghost{background:transparent;border-color:transparent}.btn.ghost:hover{background:var(--surf2)}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px;border-radius:10px}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg{display:inline-flex;background:var(--surf2);border-radius:12px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;min-height:38px;padding:0 13px;border-radius:9px;font-weight:600;font-size:14.5px;cursor:pointer;color:var(--ink2)}
.seg button.on{background:var(--surf);color:var(--ink);box-shadow:0 1px 3px rgb(0 0 0/.12)}
input[type=text],input[type=number],input[type=search],select,textarea{min-height:44px;border:1px solid var(--line);border-radius:10px;background:var(--surf);padding:8px 12px;font-size:16px;width:100%}
textarea{min-height:90px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:5px;font-size:14px;font-weight:600;color:var(--ink2)}
input[type=range]{width:100%;accent-color:var(--felt);height:32px}
.check{display:flex;gap:10px;align-items:center;min-height:44px;cursor:pointer;font-weight:550}
.check input{width:22px;height:22px;accent-color:var(--felt)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:15px}.kv dt{color:var(--muted)}.kv dd{margin:0;font-weight:650;font-variant-numeric:tabular-nums}
/* ---------- playing cards ---------- */
.pc{--w:46px;width:var(--w);height:calc(var(--w)*1.4);border-radius:calc(var(--w)*.12);background:var(--cardface);color:var(--cardink);display:inline-flex;flex-direction:column;align-items:center;justify-content:center;
 font-weight:800;box-shadow:0 1px 0 rgb(0 0 0/.25),0 3px 8px rgb(0 0 0/.18);border:1px solid rgb(0 0 0/.08);position:relative;flex:none;line-height:1;user-select:none}
.pc .r{font-size:calc(var(--w)*.5);font-stretch:100%;letter-spacing:-.02em}.pc .s{font-size:calc(var(--w)*.46);margin-top:calc(var(--w)*.02)}
.pc.h,.pc.d{color:var(--cardred)}
.four .pc.d{color:var(--cardblue)}.four .pc.c{color:var(--cardgreen)}
.pc.back{background:repeating-linear-gradient(45deg,#8b1f1d 0 6px,#a42825 6px 12px);border:3px solid #fbf8f1}
.pc.empty{background:transparent;border:2px dashed var(--line);box-shadow:none;color:var(--muted)}
.pc.sm{--w:34px}.pc.lg{--w:62px}.pc.xl{--w:78px}.pc.xs{--w:26px}
.pc.dim{opacity:.35}.pc.hl{outline:3px solid var(--s4);outline-offset:1px}
.cards{display:inline-flex;gap:5px;flex-wrap:wrap;align-items:center}
.cards.tight{gap:3px}
.pc.deal{animation:deal .32s cubic-bezier(.2,.8,.3,1.2) both}
@keyframes deal{from{transform:translateY(-18px) rotate(-6deg) scale(.85);opacity:0}to{transform:none;opacity:1}}
@media(prefers-reduced-motion:reduce){.pc.deal{animation:none}*{transition:none!important}}
/* card picker */
.picker{display:grid;grid-template-columns:repeat(13,minmax(0,1fr));gap:4px}
.picker button{aspect-ratio:.72;border-radius:7px;border:1px solid var(--line);background:var(--cardface);color:var(--cardink);font-weight:800;font-size:clamp(11px,1.6vw,15px);cursor:pointer;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05}
.picker button.h,.picker button.d{color:var(--cardred)}.four .picker button.d{color:var(--cardblue)}.four .picker button.c{color:var(--cardgreen)}
.picker button.used{opacity:.18;pointer-events:none}.picker button.sel{outline:3px solid var(--s1);outline-offset:1px}
.slots{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.slot{cursor:pointer;border-radius:8px;padding:2px}.slot.active{outline:3px solid var(--s1)}
/* ---------- range grid ---------- */
.rgrid{display:grid;grid-template-columns:repeat(13,minmax(0,1fr));gap:2px;user-select:none;touch-action:none;width:100%;max-width:560px}
.rgrid div{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:clamp(8.5px,1.3vw,12.5px);font-weight:700;border-radius:4px;background:var(--surf2);color:var(--ink2);position:relative;overflow:hidden;cursor:pointer;letter-spacing:-.02em}
.rgrid div i{position:absolute;left:0;bottom:0;top:0;background:var(--felt);z-index:0}
.rgrid div span{position:relative;z-index:1}
.rgrid div.on{color:#fff}.rgrid div.on.part{color:var(--ink)}
.rgrid.static div{cursor:default}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13.5px;color:var(--ink2)}.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
/* ---------- poker table ---------- */
.playgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;align-items:start}
@media(min-width:1100px){.playgrid{grid-template-columns:minmax(0,1fr) 300px}.playgrid .side .hud{grid-template-columns:1fr 1fr}}
.tablewrap{position:relative;width:100%;max-width:min(980px,calc((100dvh - 300px)*1.75));min-width:min(100%,520px);margin:34px auto 50px;aspect-ratio:1.75/1}
@media(max-width:700px){.tablewrap{aspect-ratio:1/1.15}}
.felt-oval{position:absolute;inset:9% 6%;border-radius:999px;background:radial-gradient(ellipse at 50% 35%,#16805a 0%,#0d5a3b 55%,#08402a 100%);box-shadow:inset 0 0 0 10px #3a2614,inset 0 0 0 13px #5b3a1f,inset 0 0 40px rgb(0 0 0/.55),0 18px 40px rgb(0 0 0/.3)}
@media(max-width:700px){.felt-oval{inset:7% 9%;border-radius:46%/36%}}
.felt-oval .mark{position:absolute;left:50%;top:62%;transform:translate(-50%,-50%);font-weight:800;font-stretch:125%;letter-spacing:.2em;color:rgb(255 255 255/.08);font-size:clamp(14px,2.4vw,26px);white-space:nowrap}
.center{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:8px;z-index:2}
.potlbl{background:rgb(0 0 0/.35);color:#fff;padding:4px 12px;border-radius:999px;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.seat{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:3px;z-index:3;width:min(132px,24%)}
.seat .cards{flex-wrap:nowrap}.many .seat{width:min(112px,19%)}.many .seat .box{min-width:0;padding:4px 6px}.many .seat .nm{font-size:12.5px}
.seat .box{background:var(--surf);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:5px 9px;min-width:96px;text-align:center;box-shadow:var(--shadow);width:100%}
.seat .nm{font-weight:700;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seat .stk{font-size:13px;font-variant-numeric:tabular-nums;color:var(--ink2)}
.seat .tag{font-size:11px;font-weight:700;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seat.act .box{outline:3px solid var(--s4);}
.seat.fold{opacity:.45}.seat.me .box{border-color:var(--felt);border-width:2px}
.seat .btnd{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:50%;background:#fff;color:#111;font-size:11px;font-weight:800;display:grid;place-items:center;box-shadow:0 1px 3px rgb(0 0 0/.4);z-index:4}
.betchip{position:absolute;transform:translate(-50%,-50%);z-index:2;white-space:nowrap;background:#fff;color:#111;border-radius:999px;font-size:12.5px;font-weight:800;padding:2px 9px 2px 22px;box-shadow:0 1px 3px rgb(0 0 0/.35);font-variant-numeric:tabular-nums}
.betchip::before{content:'';position:absolute;left:4px;top:50%;width:14px;height:14px;margin-top:-7px;border-radius:50%;background:var(--red);box-shadow:inset 0 0 0 2px #fff,inset 0 0 0 4px var(--red)}
.seat .lastact{font-size:11.5px;font-weight:800;padding:1px 8px;border-radius:6px;background:var(--ink);color:var(--bg);white-space:nowrap}
.seat .box .lastact{position:absolute;top:-9px;left:-6px;z-index:4}
.actionbar{display:flex;flex-direction:column;gap:10px;max-width:980px;margin:12px auto 0}
.actionbar .main{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.actionbar .main .btn{min-height:58px;font-size:17px}
.btn.fold{background:var(--surf);}.btn.call{background:var(--call);border-color:var(--call);color:#fff}.btn.raise{background:var(--raise);border-color:var(--raise);color:#fff}
.sizes{display:flex;gap:6px;flex-wrap:wrap}.sizes .btn{flex:1 0 64px}
.hud{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px}
.hud .h{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.hud .h b{display:block;font-size:20px;font-variant-numeric:tabular-nums;font-stretch:108%}.hud .h span{font-size:12.5px;color:var(--muted)}
/* ---------- bars & meters ---------- */
.meter{height:12px;border-radius:999px;background:var(--surf3);overflow:hidden;position:relative}
.meter>i{display:block;height:100%;border-radius:999px;background:var(--felt)}
.eqbar{display:flex;height:30px;border-radius:10px;overflow:hidden;gap:2px;font-size:13px;font-weight:700;color:#fff}
.eqbar>div{display:flex;align-items:center;justify-content:center;white-space:nowrap;overflow:hidden;min-width:0}
.hbar{display:grid;grid-template-columns:minmax(80px,auto) minmax(0,1fr) auto;gap:8px 10px;align-items:center;font-size:14px}
.hbar .b{height:14px;border-radius:0 4px 4px 0;background:var(--s1)}
.ring{--p:0;width:86px;height:86px;border-radius:50%;background:conic-gradient(var(--felt) calc(var(--p)*1%),var(--surf3) 0);display:grid;place-items:center;flex:none}
.ring b{width:68px;height:68px;border-radius:50%;background:var(--surf);display:grid;place-items:center;font-size:19px;font-variant-numeric:tabular-nums}
/* ---------- lessons ---------- */
.lesson{font-size:17px}.lesson p,.lesson li{max-width:68ch}
.lesson h3{margin-top:1.4em}
.callout{border-radius:12px;padding:14px 16px;background:var(--surf2);margin:14px 0;border:1px solid var(--line)}
.callout.key{background:var(--goodbg);border-color:transparent}.callout.warn{background:var(--warnbg);border-color:transparent}.callout.book{background:var(--felt);color:var(--feltink);border-color:transparent}
.callout.book a{color:#fff}
.callout h4{margin:0 0 4px}
.formula{font-size:18px;font-weight:700;text-align:center;padding:12px;border-radius:12px;background:var(--surf2);margin:12px 0;font-variant-numeric:tabular-nums}
.widget{margin:18px 0;background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.widget>h4{margin-bottom:10px}
ul.clean{list-style:none;padding:0;margin:0}
.lesson ul,.lesson ol{padding-left:1.3em}.lesson li{margin:.25em 0}
table.t{border-collapse:collapse;width:100%;font-size:15px}
table.t th,table.t td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.t th{font-size:13px;color:var(--muted);font-weight:650}
table.t td.n,table.t th.n{text-align:right}
.scroll{overflow-x:auto}
/* quiz */
.q{margin:12px 0 18px}.q .opts{display:grid;gap:8px;margin-top:10px}
.opt{display:flex;align-items:flex-start;gap:10px;text-align:left;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surf);cursor:pointer;min-height:48px;font-size:16px;width:100%;line-height:1.35}
.opt:hover{background:var(--surf2)}
.opt.right{background:var(--goodbg);border-color:var(--good)}.opt.wrong{background:var(--badbg);border-color:var(--bad)}
.opt .k{flex:none;width:26px;height:26px;border-radius:8px;background:var(--surf2);display:grid;place-items:center;font-weight:700;font-size:13px}
.why{margin-top:10px;padding:12px 14px;border-radius:12px;background:var(--surf2);font-size:15.5px}
/* drills */
.drillcard{display:flex;flex-direction:column;gap:8px;text-decoration:none;color:inherit;cursor:pointer;transition:transform .12s}
.drillcard:hover{transform:translateY(-2px)}
.drillcard .ic{width:44px;height:44px;border-radius:12px;background:var(--felt);color:var(--feltink);display:grid;place-items:center}
.drillcard .ic svg{width:24px;height:24px}
.qcard{max-width:780px;margin:0 auto}
.scene{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-end;justify-content:center;padding:18px;border-radius:16px;background:var(--felt);color:var(--feltink);background-image:radial-gradient(ellipse at 50% 0%,rgb(255 255 255/.14),transparent 70%);margin:10px 0 16px}
.scene .lbl{font-size:12.5px;font-weight:700;opacity:.8;margin-bottom:5px;text-align:center}
.scene .info{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;width:100%}
.scene .info span{background:rgb(0 0 0/.25);padding:4px 10px;border-radius:999px;font-weight:650;font-size:14px;font-variant-numeric:tabular-nums}
.answers{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.answers .btn{min-height:54px;font-size:17px}
.feedback{border-radius:14px;padding:14px 16px;margin-top:14px}
.feedback.ok{background:var(--goodbg)}.feedback.no{background:var(--badbg)}
.feedback h3{margin:0 0 6px}
.progressdots{display:flex;gap:4px;flex-wrap:wrap}.progressdots i{width:22px;height:6px;border-radius:3px;background:var(--surf3)}.progressdots i.ok{background:var(--good)}.progressdots i.no{background:var(--bad)}.progressdots i.cur{background:var(--ink2)}
/* charts */
.fig{position:relative;min-height:260px;width:100%}.fig.short{min-height:200px}.fig.tall{min-height:340px}
.fig>svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.fig svg text{font-family:var(--font);fill:var(--muted);font-size:12px}
.fig svg .gl{stroke:var(--line);stroke-width:1}
.fig svg .ax{stroke:var(--ink2);stroke-width:1}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);padding:6px 10px;border-radius:8px;font-size:13px;white-space:nowrap;z-index:5;transform:translate(-50%,calc(-100% - 10px));font-variant-numeric:tabular-nums;box-shadow:var(--shadow)}
/* modal & toast */
.modal-bg{position:fixed;inset:0;background:rgb(0 0 0/.5);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .15s}
.modal{background:var(--surf);border-radius:18px;max-width:720px;width:100%;max-height:calc(100dvh - 32px);overflow:auto;padding:22px;box-shadow:0 20px 60px rgb(0 0 0/.35)}
.modal.wide{max-width:980px}
@keyframes fade{from{opacity:0}}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;font-weight:600;z-index:200;box-shadow:var(--shadow);animation:fade .2s;max-width:90vw}
/* home */
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:24px;align-items:center}
@media(max-width:820px){.hero{grid-template-columns:minmax(0,1fr)}}
.hero-pic{position:relative;aspect-ratio:1.35;border-radius:24px;background:var(--felt);overflow:hidden;background-image:radial-gradient(ellipse at 50% 30%,#1b8a60 0%,#0d5a3b 60%,#073826 100%)}
.hero-pic svg{position:absolute;inset:0;width:100%;height:100%}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.tile{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:3px}
.tile b{font-size:26px;font-stretch:110%;font-variant-numeric:tabular-nums}.tile span{font-size:13.5px;color:var(--muted)}
.list a.item,.list .item{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);text-decoration:none;color:inherit;min-height:56px}
.list .item:last-child{border-bottom:0}
.list .item .grow{flex:1}
.doneic{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--surf2);color:var(--muted);font-size:12px;font-weight:800}
.doneic.done{background:var(--good);color:#fff}
.hist{font-family:ui-monospace,Menlo,monospace;font-size:13px;white-space:pre-wrap;background:var(--surf2);padding:12px;border-radius:10px;max-height:340px;overflow:auto}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;font-weight:650;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap;min-height:44px}
.tabs button.on{color:var(--ink);border-color:var(--felt)}
.spinner{width:18px;height:18px;border:3px solid var(--surf3);border-top-color:var(--felt);border-radius:50%;animation:spin .8s linear infinite;display:inline-block;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
abbr[title]{text-decoration:underline dotted;cursor:help}
.hidden{display:none!important}
.mt{margin-top:16px}.mb{margin-bottom:16px}.mt0{margin-top:0}
.grade{font-weight:800;padding:2px 9px;border-radius:7px;font-size:13px}
.grade.g{background:var(--goodbg);color:var(--good)}.grade.m{background:var(--warnbg);color:var(--warn)}.grade.b{background:var(--badbg);color:var(--bad)}
/* ---------- lesson structure ---------- */
.lx-goals{border-left:4px solid var(--felt);padding:4px 0 4px 16px;margin:18px 0}
.lx-goals h4,.lx-terms h4,.lx-ex h4,.lx-mist h4,.lx-sum h4{margin:0 0 8px}
.lx-goals ul,.lx-mist ul,.lx-sum ul{margin:0;padding-left:1.2em}
.lx-terms{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:18px 0}
.lx-terms dl{display:grid;grid-template-columns:minmax(120px,max-content) minmax(0,1fr);gap:8px 16px;margin:0}
.lx-terms dt{font-weight:750}.lx-terms dd{margin:0;color:var(--ink2)}
@media(max-width:600px){.lx-terms dl{grid-template-columns:minmax(0,1fr)}.lx-terms dd{margin-bottom:6px}}
.lx-formula{margin:14px 0}.lx-formula .formula{margin:0}
.lx-formula dl{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:4px 14px;margin:10px 4px 0;font-size:15px}
.lx-formula dt{font-weight:750;font-variant-numeric:tabular-nums}.lx-formula dd{margin:0;color:var(--ink2)}
.lx-ex{background:var(--surf);border:1px solid var(--line);border-left:4px solid var(--s1);border-radius:14px;padding:16px 18px;margin:18px 0}
.lx-ex .scene{margin:8px 0 12px;padding:12px}
.lx-steps{margin:0;padding-left:1.4em}.lx-steps li{margin:6px 0;padding-left:4px}
.lx-steps li::marker{font-weight:800;color:var(--s1)}
.lx-result{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--goodbg);font-weight:600}
.lx-turn{border:1px dashed var(--s1);border-radius:14px;padding:12px 16px;margin:16px 0;background:var(--surf)}
.lx-turn summary{cursor:pointer;font-weight:600;list-style:none;min-height:28px}
.lx-turn summary::-webkit-details-marker{display:none}
.lx-turn summary::after{content:'Show answer';display:inline-block;margin-left:10px;font-size:13px;font-weight:700;color:var(--s1)}
.lx-turn[open] summary::after{content:'Hide'}
.lx-tag{display:inline-block;background:var(--s1);color:#fff;border-radius:6px;padding:1px 8px;font-size:12.5px;font-weight:800;margin-right:6px;vertical-align:1px}
.lx-ans{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.lx-ans ol{padding-left:1.3em;margin:4px 0}
.lx-mist{background:var(--badbg);border-radius:14px;padding:14px 18px;margin:18px 0}
.lx-sum{background:var(--goodbg);border-radius:14px;padding:14px 18px;margin:22px 0}
.lx-how{font-size:14.5px;color:var(--ink2);background:var(--surf2);border-radius:10px;padding:10px 12px;margin:0 0 12px}
.lx-how ul{margin:4px 0 0;padding-left:1.2em}
.hc{white-space:nowrap;font-weight:700}.su.h,.su.d{color:var(--cardred)}.four .su.d{color:var(--cardblue)}.four .su.c{color:var(--cardgreen)}
.lx-live{font-variant-numeric:tabular-nums}
.lx-live ol{margin:8px 0 0;padding-left:1.4em}.lx-live li{margin:5px 0}
.lx-live b.v{color:var(--s1)}
.splitbar{display:flex;height:36px;border-radius:10px;overflow:hidden;font-size:13px;font-weight:700;margin:10px 0}
.splitbar>div{display:flex;align-items:center;justify-content:center;white-space:nowrap;overflow:hidden;padding:0 6px}
/* tap-to-define terms */
button.term{all:unset;cursor:help;border-bottom:1.5px dotted var(--s1);color:inherit}
button.term:focus-visible{outline:2px solid var(--s1);outline-offset:2px}
.termpop{position:absolute;z-index:150;max-width:min(340px,90vw);background:var(--ink);color:var(--bg);padding:12px 14px;border-radius:12px;box-shadow:0 10px 30px rgb(0 0 0/.3);font-size:14.5px;line-height:1.45}
.termpop b{display:block;margin-bottom:4px;font-size:15px}

  X.L({ id: 'betting-basics', course: 'foundations', title: 'Betting vocabulary, units and streets', mins: 8, sum: 'Blinds, big blinds as a unit, the four streets, and the exact meaning of open, limp, 3-bet and continuation bet.',
    html: `${X.goals(['How a hand is structured: blinds and the four betting rounds ("streets")', 'Why everything is measured in big blinds (bb)', 'The five actions and the names for common raises', 'How to read a hand description like "BTN opens 2.5bb, BB 3-bets to 11bb"'])}
    ${X.terms([['Blinds', 'Two forced bets posted before any cards are dealt, so there is always something to win. The <b>small blind (SB)</b> is half the size of the <b>big blind (BB)</b>.'], ['Big blind (bb)', 'Also used as a <b>unit</b>: "a 10bb bet" means ten times the big blind. Measuring in big blinds lets the same lesson apply at any stakes.'], ['Stack', 'The chips a player has. "100bb deep" means a stack of 100 big blinds — the normal starting stack in cash games.'], ['Street', 'One betting round. There are four: preflop, flop, turn, river.'], ['Pot', 'All the chips in the middle.']])}
    <h3>1. The structure of a hand</h3>
    <ol><li><b>Blinds are posted.</b> With blinds of $1/$2, the small blind puts in $1 and the big blind $2. In big-blind units: SB 0.5bb, BB 1bb.</li><li><b>Preflop:</b> everyone gets two private cards (hole cards). Betting starts with the player left of the big blind.</li><li><b>Flop:</b> three shared cards are dealt face up. Second betting round.</li><li><b>Turn:</b> a fourth shared card. Third betting round.</li><li><b>River:</b> the fifth shared card. Final betting round, then a <b>showdown</b> if two or more players remain.</li></ol>
    <h3>2. The five actions</h3>
    ${X.t(['Action', 'Meaning', 'When allowed'], [['Check', 'Pass without betting', 'Only if nobody has bet this street'], ['Bet', 'Put the first chips in on a street', 'Nobody has bet yet'], ['Call', 'Match the current bet', 'Someone has bet'], ['Raise', 'Increase the current bet', 'Someone has bet'], ['Fold', 'Give up the hand and anything already invested', 'Any time you face a bet']])}
    <h3>3. Names for preflop raises</h3>
    <p>The big blind counts as the first "bet". So:</p>
    <ul><li>The first raise is an <b>open</b> (or "open-raise", or the "2-bet"). Example: everyone folds to the button, who raises to 2.5bb — the button <b>opens</b>.</li><li>Calling the big blind instead of raising is a <b>limp</b>.</li><li>Re-raising an open is a <b>3-bet</b>. Re-raising a 3-bet is a <b>4-bet</b>, and so on.</li><li>On the flop, if the last preflop raiser bets again, that is a <b>continuation bet</b> (c-bet).</li></ul>
    ${X.ex('reading a hand description', ['"Blinds 0.5/1bb, 100bb stacks" — every player starts with 100 big blinds.', '"Folds to the BTN, who opens to 2.5bb" — the button is first to raise and makes it 2.5bb.', '"SB folds, BB 3-bets to 11bb" — the big blind re-raises. The pot is now 0.5 (folded SB) + 2.5 + 11 = 14bb.', '"BTN calls" — the button adds 8.5bb more to match 11. Pot = 0.5 + 11 + 11 = <b>22.5bb</b>.', '"Flop K♠7♦2♣, BB bets 8bb" — the 3-bettor continues, so this is a continuation bet.'], { result: 'Pot on the flop: 22.5bb. Each player has 100 − 11 = 89bb left.' })}

  X.L({ id: 'positions', course: 'foundations', title: 'Positions and why acting last matters', mins: 7, sum: 'Seat names from under the gun to the button, the order of action on each street, and what "in position" means.',
    html: `${X.goals(['The name of every seat at a six-max table', 'Who acts first before and after the flop', 'Why the button can play far more hands than under the gun'])}

    <h3>1. Seat names (six-max)</h3>
    ${X.t(['Seat', 'Short name', 'Acts preflop', 'Baseline opening range'], [['Under the gun', 'UTG', '1st', 'about 17% of hands'], ['Hijack', 'HJ', '2nd', 'about 22%'], ['Cutoff', 'CO', '3rd', 'about 30%'], ['Button', 'BTN', '4th', '45–50%'], ['Small blind', 'SB', '5th', 'about 40% (raise or fold)'], ['Big blind', 'BB', 'last', 'defends widely']])}
    <p>Full ring (nine players) adds three early seats: UTG+1, middle position (MP) and lojack (LJ).</p>
    <h3>2. Order of action</h3><ul><li><b>Preflop:</b> starts left of the big blind (UTG) and ends with the big blind.</li><li><b>Flop, turn, river:</b> starts with the first player still in the hand to the left of the button; <b>the button always acts last</b>.</li><li><b>Heads-up</b> (two players): the button is also the small blind. It acts first preflop but last on every later street.</li></ul>
    <h3>3. Why acting last is worth so much</h3>
    <p>When you act last you have seen everyone else's decision before making yours. You can take a free card when they check, bet when they show weakness, and keep the pot small with medium hands. Every hand is worth more in position. That's why the button opens almost half its hands while under the gun opens under a fifth: under the gun, five players still act behind you and you'll usually be out of position after the flop.</p>
    ${X.ex('who acts first?', ['Six-max. The hijack opens, the button calls, the blinds fold.', 'On the flop, the first player <i>still in the hand</i> to the left of the button acts first. That\'s the hijack.', 'The button acts second — last — so the button is <b>in position</b> and the hijack is <b>out of position</b>.'])}

    quiz: [{ q: 'Board A♠A♦K♣K♥Q♠. You hold J♣J♦; your opponent holds 2♣3♦. Result?', opts: ['You win with your jacks', 'Opponent wins', 'Split pot', 'You win with the better kicker'], a: 2, why: 'Both play A-A-K-K-Q. Two pair only uses one kicker, and the queen on the board beats your jack.' }, { q: 'You bet 10bb. A short stack goes all-in for 14bb total. Can you re-raise?', opts: ['Yes', 'No — 14bb is less than a full raise (to 20bb), so action is not reopened', 'Only on the river', 'Only if others called'], a: 1, why: 'A full raise would be to at least 20bb. The 4bb extra doesn\'t reopen the betting for players who already acted.' }, { q: 'A is all-in for 30bb; B and C put in 100bb each. A has the best hand, B the second best. What does B win?', opts: ['Nothing', 'The 140bb side pot', 'The 90bb main pot', 'Everything'], a: 1, why: 'A wins the 90bb main pot; B beats C for the 140bb side pot.' }] });

  X.L({ id: 'how-to-train', course: 'foundations', title: 'How to train with Felt Lab', mins: 4, sum: 'What each part of the app is for, a weekly routine, and what every number on screen means.',
    html: `${X.goals(['Which part of the app trains which skill', 'A realistic weekly routine', 'What equity, bb/100 and all-in adjusted results mean on screen'])}
    <h3>The four parts</h3>
    ${X.t(['Section', 'What it trains', 'How'], [['Learn', 'Understanding', 'Lessons with definitions, worked examples and figures you can play with'], ['Drills', 'Speed and accuracy', 'Ten-question rounds. Misses return in a review queue after a minute, then 1, 3, 7 and 21 days'], ['Play', 'Decisions under pressure', 'A full table against bots with different styles, with an optional coach and post-hand review'], ['Tools', 'Analysis', 'Equity, ranges, push/fold, ICM, variance and sizing calculators']])}
    ${X.key('A good week', '<ul><li>One Daily mix of drills a day (about 5 minutes).</li><li>Two lessons.</li><li>Two sessions of about 100 hands. Review every hand marked "Mistake".</li><li>Clear your review queue at the end of the week.</li></ul>')}
    <h3>Numbers you will see</h3>
    ${X.terms([['Equity', 'Your share of the pot if all the remaining cards were dealt with no more betting. Covered in full in the Maths course.'], ['Equity vs estimated range', 'Your equity against every hand your opponent could have, given how they have played so far. In Play the ranges are estimated from the bots\' actions — never from their actual cards.'], ['bb/100', 'Big blinds won per 100 hands: the standard win-rate measure. +5 bb/100 is a good win rate.'], ['All-in adjusted (EV) winnings', 'What you would have won if every all-in paid out your equity instead of the single runout that happened. It removes all-in luck from your results.']])}
    <p>Any underlined term in a lesson can be tapped for its definition. Your progress is stored on the device; Settings explains backup and syncing between devices.</p>`,
    quiz: [{ q: 'You get a drill question wrong. When will you see it again first?', opts: ['Never', 'About a minute later, in the review queue', 'Next month', 'Only in the Daily mix'], a: 1, why: 'Missed questions are due again almost immediately, then at growing intervals once you answer them correctly.' }] });
})();

/* ===== Course: Poker maths & statistics (part A: the core) ===== */
(function () {
  const UI = window.UI, X = UI.LX, h = X.h;
  UI.COURSES.push({ id: 'maths', title: 'Poker maths & statistics', blurb: 'Built from the ground up: probability, equity, pot odds, outs, expected value, combinatorics, ranges, variance and bankroll — every term defined and every formula worked through.', lessons: ['probability', 'equity', 'pot-odds', 'outs-odds', 'draws', 'ev', 'implied', 'fold-equity', 'combinatorics', 'preflop-equity', 'ranges-equity', 'equity-dist', 'variance', 'bankroll', 'bayes'] });

  // ---------------- 1. Probability ----------------
  X.L({ id: 'probability', course: 'maths', title: 'Percentages, odds and unseen cards', mins: 9, sum: 'The two ways of writing a chance (percentages and "odds against"), how to convert between them, and how to count the cards you can\'t see.',
    html: `${X.goals(['Write a chance as a percentage, a fraction and as "odds against"', 'Convert between the three in your head', 'Count unseen cards on each street — the starting point of every poker probability'])}
    ${X.terms([['Probability (chance)', 'How often something happens, from 0% (never) to 100% (always). "20%" means 20 times out of every 100.'], ['Odds against', 'How many times something <i>fails</i> for every one time it <i>succeeds</i>. "4 to 1 against" (written 4:1) means 4 fails for each success.'], ['Unseen cards', 'Every card you can\'t see. Your opponents\' cards count as unseen, because you don\'t know what they are.']])}
    <h3>1. Three ways to write the same chance</h3>
    <p>Suppose something happens once in every five tries.</p>
    ${X.t(['Form', 'Written as', 'Read as'], [['Fraction', '1/5', '1 success in 5 tries'], ['Percentage', '20%', '20 successes per 100 tries'], ['Odds against', '4 : 1', '4 failures for every 1 success']])}
    <p>Poker players use both percentages and odds, so you need to move between them.</p>
    ${X.f('Chance = 1 ÷ (odds against + 1)', [['Odds against', 'the first number in "X to 1"']], 'Going the other way: odds against = (100% − chance) ÷ chance.')}
    ${X.ex('converting 4 to 1 against into a percentage', ['4 to 1 against means 4 failures for every 1 success.', 'That is 1 success out of every 4 + 1 = 5 tries.', '1 ÷ 5 = 0.20 = <b>20%</b>.'])}
    ${X.ex('converting 25% into odds against', ['25% means 25 successes in 100 tries.', 'So 100 − 25 = 75 failures.', 'Failures ÷ successes = 75 ÷ 25 = 3.', 'That is <b>3 to 1 against</b>.'])}
    ${X.t(['Chance', 'Odds against'], [['50%', '1 : 1 ("even money")'], ['33%', '2 : 1'], ['25%', '3 : 1'], ['20%', '4 : 1'], ['10%', '9 : 1']], [0, 1])}
    ${X.w('oddsconv', 'Converter: watch the working change', ['Drag either slider. The steps underneath redo the conversion with your numbers.'])}
    <h3>2. Counting unseen cards</h3>
    <p>Almost every poker probability starts with "how many cards could come next?". Count every card you <i>can</i> see and subtract from 52.</p>
    ${X.t(['Moment', 'Cards you see', 'Unseen cards'], [['Preflop', 'Your 2', '50'], ['On the flop', 'Your 2 + 3 on the board = 5', '47'], ['On the turn', 'Your 2 + 4 on the board = 6', '46']], [1, 2])}
    ${X.note('Why opponents\' cards still count as unseen', 'If you are on the flop against one opponent, two of the 47 unseen cards are in their hand. But you don\'t know <i>which</i> two, so each unseen card is equally likely to be the next card dealt. That\'s why you always divide by 47 on the flop and 46 on the turn in real play.')}
    ${X.ex('a single card', ['You hold two hearts and there are two hearts on the flop, so you can see 4 hearts.', 'There are 13 hearts in the deck, so 13 − 4 = 9 hearts are unseen.', 'On the flop, 47 cards are unseen.', 'Chance the turn is a heart = 9 ÷ 47 = <b>19.1%</b>.', 'As odds against: (47 − 9) ÷ 9 = 38 ÷ 9 ≈ <b>4.2 to 1</b>.'])}
    ${X.turn('On the turn you need one of 8 cards. What is your chance on the river, and roughly what are the odds against?', '<ol><li>On the turn, 46 cards are unseen.</li><li>Chance = 8 ÷ 46 = <b>17.4%</b>.</li><li>Odds against = (46 − 8) ÷ 8 = 38 ÷ 8 = <b>4.75 to 1</b>.</li></ol>')}
    ${X.mistakes(['Mixing up "odds against" with a fraction: 4 to 1 is 1 in 5 (20%), not 1 in 4 (25%).', 'Subtracting your opponent\'s cards from the unseen count. You don\'t know them, so they stay in.'])}
    ${X.sum(['Chance = 1 ÷ (odds against + 1). Odds against = fails ÷ successes.', 'Unseen cards: 47 on the flop, 46 on the turn.', 'Chance of hitting with one card = good cards ÷ unseen cards.'])}`,
    quiz: [{ q: 'What percentage is 3 to 1 against?', opts: ['33%', '25%', '30%', '75%'], a: 1, why: '3 failures for every 1 success = 1 success in 4 tries = 1 ÷ 4 = 25%.' }, { q: 'How many cards are unseen when you are on the turn?', opts: ['48', '47', '46', '44'], a: 2, why: 'You see your 2 cards plus 4 board cards = 6. 52 − 6 = 46.' }, { q: 'On the flop, 9 cards help you. Chance the turn is one of them?', opts: ['9%', 'About 19%', 'About 35%', '25%'], a: 1, why: '9 good cards ÷ 47 unseen = 19.1%.' }, { q: 'A 20% chance written as odds against is…', opts: ['5 to 1', '4 to 1', '1 to 4', '2 to 1'], a: 1, why: '20% = 20 successes, 80 failures. 80 ÷ 20 = 4 to 1 against.' }] });

  // ---------------- 2. Equity ----------------
  X.L({ id: 'equity', course: 'maths', title: 'Equity: your share of the pot', mins: 10, sum: 'What equity means, how it is calculated, why it changes every street, and how ties are counted.',
    html: `${X.goals(['What equity means and why it is the central number in poker maths', 'How equity is worked out: dealing out every possible board', 'How ties count, and how equity changes from street to street'])}
    ${X.terms([['Equity', 'Your share of the pot if all the remaining cards were dealt with no more betting. If you have 40% equity in a 100bb pot, the pot is "worth" 40bb to you on average.'], ['Runout', 'The cards still to come (for example the turn and river).'], ['Hot-and-cold equity', 'Equity when the cards are simply dealt out with no betting — what calculators show.']])}
    <h3>1. The idea</h3>
    <p>Imagine both players are all-in and the remaining cards are about to be dealt. You don't know who will win this time, but if you replayed the exact situation thousands of times you would win some share of them. That share is your <b>equity</b>. It's how much of the pot belongs to you on average.</p>
    ${X.f('Equity = (wins + ½ × two-way ties) ÷ number of possible runouts', [['Wins', 'runouts where your hand is best'], ['Ties', 'runouts where you split; with a two-way split you get half the pot']])}
    ${X.ex('A♠K♠ against Q♥Q♦, all-in before the flop', ['There are 1,712,304 different five-card boards that could come (every combination of 5 from the 48 unseen cards).', 'Count the boards where each hand wins: A♠K♠ wins on 46.0% of them (mostly when an A or K pairs it, or it makes a flush or straight); Q♥Q♦ wins on 53.6%; 0.4% are ties.', 'A♠K♠\'s equity = wins + half the ties = 46.0% + 0.2% = <b>46.2%</b>. Q♥Q♦: 53.6% + 0.2% = 53.8%.'], { scene: X.scene([['You', 'AsKs'], ['Opponent', 'QhQd']]), result: 'Neither hand is "ahead" in a way that matters much: the queens are a small favourite, about 54/46.' })}
    <p>You don't have to count 1.7 million boards — that's what the equity calculator does. But you can see the idea by dealing boards one at a time.</p>
    ${X.w('equitydeal', 'Deal it out: estimate equity by dealing boards', ['Tap "Deal 1 board" a few times and watch who wins each board.', 'Then tap "Deal 1,000". The estimate settles close to the exact equity — this is exactly what equity means.'])}
    <h3>2. Equity changes every street</h3>
    <p>Equity is a snapshot. Each new card changes it.</p>
    ${X.ex('the same hand, street by street', ['Preflop: ' + h('AhJh') + ' against ' + h('KsKc') + ' — the jacks-and-ace hand has <b>32.5%</b>.', 'Flop ' + h('Qh7h2s') + ': you now have a flush draw (two more hearts on the board) plus an ace that would pair. Equity rises to <b>45.7%</b>.', 'Turn ' + h('3c') + ': a blank. One card left to hit, so equity falls to <b>27.3%</b>.', 'River ' + h('Ad') + ': you pair your ace and win. Equity is now <b>100%</b> — there are no cards left to change it.'], { scene: X.scene([['You', 'AhJh'], ['Opponent', 'KsKc'], ['Flop', 'Qh7h2s']]) })}
    ${X.note('44 or 46 unseen cards?', 'When you calculate equity with both hands known (as calculators do), there are 44 unseen cards on the turn: 52 minus your 2, their 2 and the 4 board cards. At the table you can\'t see their cards, so you count 46. The answers differ slightly; both are correct for what they measure.')}
    ${X.w('tool:equity', 'Equity calculator', ['Player 1 starts as A♠K♠; set Player 2 to an exact hand with "Hand", or to a range of hands with "Range".', 'Add a board with "Set board", then tap Calculate.', '"Equity" = share of the pot; "Win" = how often you win outright; "Tie" = how often you split.', 'The turn-card chart (when both players have exact hands and there is a flop) shows your equity after every possible turn card.'])}
    ${X.turn('You have 30% equity in a 60bb pot. How much of the pot is "yours" on average?', '<ol><li>Equity × pot = 0.30 × 60.</li><li>= <b>18bb</b>. You won\'t win 18bb in any single hand — you\'ll win 60 or 0 — but over many repeats you average 18bb.</li></ol>')}
    ${X.mistakes(['Thinking "I\'m behind, so I have no equity." A flush draw against top pair often has 35% or more.', 'Forgetting that equity assumes no more betting. Future bets can stop you from seeing the cards you need — later lessons deal with this.'])}
    ${X.sum(['Equity = your share of the pot on average if the cards were dealt out now.', 'It\'s calculated by counting every possible runout, with ties counted as fractions.', 'Equity changes on every street.'])}`,
    quiz: [{ q: 'You have 25% equity in a 40bb pot. Your average share is…', opts: ['25bb', '10bb', '40bb', '15bb'], a: 1, why: '0.25 × 40 = 10bb.' }, { q: 'On a runout, both players make the same straight and split. How does that count toward equity?', opts: ['As a win for both', 'As a loss for both', 'As half a win for each', 'It is ignored'], a: 2, why: 'A two-way tie gives each player half the pot, so it counts as ½.' }, { q: 'A♥J♥ vs K♠K♣ had 45.7% on the Q♥7♥2♠ flop but 27.3% after a blank turn. Why did it drop?', opts: ['The kings improved', 'There is now only one card left to hit', 'The pot got bigger', 'Equity always falls on the turn'], a: 1, why: 'With two cards to come there are two chances to hit; after a blank turn there is one.' }] });

  // ---------------- 3. Pot odds ----------------
  X.L({ id: 'pot-odds', course: 'maths', title: 'Pot odds and the equity you need to call', mins: 12, sum: 'Turn any bet into "the equity I need to call", step by step, then compare it with your equity.',
    html: `${X.goals(['What pot odds are and where every number comes from', 'How to turn pot odds into the equity you need to call', 'How to decide: compare your equity with the equity you need', 'The landmark numbers for common bet sizes'])}
    ${X.terms([['Pot (before the bet)', 'Everything in the middle before your opponent bets. In this lesson called <b>P</b>.'], ['Bet', 'What your opponent puts in. Calling costs you the same amount. Called <b>B</b>.'], ['Final pot', 'What the pot will be if you call: pot + their bet + your call = P + B + B.'], ['Pot odds', 'What you can win compared with what it costs you to call, written as a ratio such as "3 to 1".'], ['Required equity', 'The smallest equity at which calling breaks even. Also called "equity needed" or "break-even equity".'], ['Equity', 'Your share of the pot on average if the cards were dealt out — see the previous lesson.']])}
    <h3>1. The situation</h3>
    <p>Your opponent bets. You can fold (lose nothing more) or call. If you call, you put in B to try to win everything else in the middle. Calling is worth it when the share of the pot you win on average (your equity) is bigger than the share of the final pot you paid for.</p>
    <h3>2. Pot odds</h3>
    <p>When you call, you risk your call (B) to win what is already there: the pot (P) plus your opponent's bet (B).</p>
    ${X.f('Pot odds = (P + B) : B', [['P', 'pot before the bet'], ['B', 'their bet = your call']], 'Divide both sides by B to get "X to 1".')}
    <h3>3. From pot odds to required equity</h3>
    <p>Pot odds are a ratio. To compare them with your equity, convert them into a percentage: your share of the final pot.</p>
    ${X.f('Required equity = your call ÷ final pot = B ÷ (P + B + B)', [['B', 'what you must call'], ['P + B + B', 'the final pot if you call']], 'This is the same as converting the pot odds ratio into a percentage: 1 ÷ (odds + 1).')}
    ${X.ex('the pot is 10bb and your opponent bets 5bb', ['Your call: <b>5bb</b>.', 'Final pot if you call: 10 + 5 + 5 = <b>20bb</b>.', 'Pot odds: you risk 5 to win 10 + 5 = 15 → 15 : 5 = <b>3 to 1</b>.', 'Required equity = 5 ÷ 20 = <b>25%</b>. (Check: 3 to 1 → 1 ÷ (3 + 1) = 25%.)', 'Decision rule: call if your equity is more than 25%; fold if it is less.'], { scene: X.scene([['Board', 'Kd9s4c']], ['Pot 10bb', 'Opponent bets 5bb']) })}
    ${X.w('potodds', 'Pot odds, worked live', ['Move the pot and bet sliders: each step below recalculates with your numbers.', 'The bar shows the final pot. The blue slice is your call — that slice is the equity you need.', 'Move "Your equity" to see when calling turns profitable.'], '10,5,30')}
    <h3>4. Comparing with your equity</h3>
    ${X.ex('should you call?', ['The pot is 30bb and your opponent bets 20bb.', 'Required equity = 20 ÷ (30 + 20 + 20) = 20 ÷ 70 = <b>28.6%</b>.', 'Suppose your equity is 35%.', '35% is more than 28.6%, so calling is profitable.', 'How profitable? Expected value = equity × final pot − call = 0.35 × 70 − 20 = 24.5 − 20 = <b>+4.5bb</b> on average.'], { result: 'Call. On average you gain 4.5bb each time you make this call.' })}
    <p>The last step uses <b>expected value</b> (EV): the average result of a decision. It has its own lesson later; for now, read it as "equity × final pot is your average share, minus what you paid to get it".</p>
    <h3>5. The landmark sizes</h3>
    <p>The same bet <i>relative to the pot</i> always needs the same equity, whatever the stakes. Learn these:</p>
    ${X.t(['Bet size', 'Example (pot 12)', 'Pot odds', 'Required equity'], [['¼ pot', 'bet 3', '5 : 1', '16.7%'], ['⅓ pot', 'bet 4', '4 : 1', '20%'], ['½ pot', 'bet 6', '3 : 1', '25%'], ['⅔ pot', 'bet 8', '2.5 : 1', '28.6%'], ['¾ pot', 'bet 9', '2.33 : 1', '30%'], ['Pot', 'bet 12', '2 : 1', '33.3%'], ['2× pot', 'bet 24', '1.5 : 1', '40%']], [3])}
    ${X.turn('The pot is 12bb and your opponent bets 4bb (a third of the pot). What equity do you need?', '<ol><li>Call 4.</li><li>Final pot = 12 + 4 + 4 = 20.</li><li>Required equity = 4 ÷ 20 = <b>20%</b>. Pot odds: 16 : 4 = 4 to 1.</li></ol>')}
    ${X.warn('This assumes no more betting', 'Pot odds compare what\'s in the pot now with the cost now. On the flop or turn there may be more bets later. If you can win extra money when you hit, calling becomes better (<b>implied odds</b>). If you can be bet off your hand, it becomes worse. Both have lessons later in this course.')}
    ${X.mistakes(['Dividing the call by the pot <i>before</i> your call: 5 ÷ 15 = 33% is wrong. Your call is part of the final pot: 5 ÷ 20 = 25%.', 'Reading "3 to 1" as 33%. It is 1 in 4 = 25%.'])}
    ${X.sum(['Required equity = call ÷ (pot + bet + call).', 'Call when your equity is higher than the required equity.', 'Half-pot needs 25%, pot-size needs 33%, two times pot needs 40%.'])}`,
    quiz: [{ q: 'The pot is 30bb and your opponent bets 20bb. What equity do you need to call?', opts: ['20%', '28.6%', '40%', '33%'], a: 1, why: 'Call 20. Final pot = 30 + 20 + 20 = 70. 20 ÷ 70 = 28.6%.' }, { q: 'Facing a pot-sized bet, what equity do you need?', opts: ['25%', '33%', '50%', '40%'], a: 1, why: 'Pot P, bet P: P ÷ (P + P + P) = 1 ÷ 3 = 33%.' }, { q: 'You are getting pot odds of 4 to 1. What equity do you need?', opts: ['25%', '20%', '40%', '80%'], a: 1, why: 'Risk 1 to win 4: 1 ÷ (4 + 1) = 20%.' }, { q: 'Pot 20bb, opponent bets 10bb, your equity is 35%. Expected value of calling?', opts: ['+4bb', '−1bb', '+10bb', '+3.5bb'], a: 0, why: 'Final pot = 40. EV = 0.35 × 40 − 10 = 14 − 10 = +4bb.' }] });

  // ---------------- 4. Outs and the rule of 2 and 4 ----------------
  X.L({ id: 'outs-odds', course: 'maths', title: 'Outs and the rule of 2 and 4', mins: 13, sum: 'Count the cards that win for you, calculate your exact chance to hit, and use the rule of 2 and 4 to do it in your head.',
    html: `${X.goals(['What an out is, and how to count outs for common draws', 'The exact chance of hitting with one or two cards to come', 'The rule of 2 and 4: what it is, why it works, and when to use each part', 'The correction for big draws'])}
    ${X.terms([['Out', 'An unseen card that would give you the best hand.'], ['Draw', 'A hand that isn\'t best yet but can improve — for example four cards to a flush.'], ['Clean out', 'An out that gives you the best hand without also helping your opponent more.'], ['Tainted out', 'A card that improves you but improves your opponent even more (for example a flush card that also gives them a full house).'], ['Rule of 2 and 4', 'A mental shortcut: multiply your outs by 2 for one card to come, or by 4 for two cards to come, to estimate your chance in percent.']])}
    <h3>1. Counting outs</h3>
    <p>Count every unseen card that would give you the best hand. For common draws the counts are always the same:</p>
    ${X.t(['Draw', 'Example', 'How to count', 'Outs'], [['Flush draw', h('Ah7h') + ' on ' + h('Kh8h2c'), '13 hearts − 4 you can see', '9'], ['Open-ended straight draw', h('9s8d') + ' on ' + h('7c6h2s'), 'Any 10 or any 5: 4 + 4', '8'], ['Gutshot (inside) straight draw', h('9s8d') + ' on ' + h('Jc7h2s'), 'Only a 10: 4', '4'], ['Two overcards', h('AsKd') + ' on ' + h('9c6h2s'), 'Any A or K to make top pair: 3 + 3', '6'], ['Flush draw + gutshot', h('9h8h') + ' on ' + h('Jh7h2s'), '9 hearts + the 3 non-heart 10s', '12'], ['Flush draw + open-ender', h('9h8h') + ' on ' + h('7h6h2s'), '9 hearts + the 6 non-heart 10s and 5s', '15']], [3])}
    ${X.note('Don\'t count a card twice', 'With a flush draw plus a straight draw, the 10♥ is both a heart and a 10. Count it once. That\'s why flush + open-ender is 9 + 6 = 15, not 9 + 8 = 17.')}
    ${X.ex('a tainted out', ['You hold ' + h('8h7h') + ' on ' + h('9h6c2h') + ' — a flush draw plus an open-ended straight draw: 15 outs.', 'Your opponent holds ' + h('9c9d') + ': a set of nines.', 'The 6♥ makes your flush, but it pairs the board and gives your opponent a full house. It\'s tainted.', 'So against this hand you have <b>14</b> clean outs, not 15.'], { scene: X.scene([['You', '8h7h'], ['Flop', '9h6c2h'], ['Opponent', '9c9d']]) })}
    <h3>2. The exact chance: one card to come</h3>
    ${X.f('Chance to hit = outs ÷ unseen cards', [['Unseen cards', '47 on the flop (looking at the turn), 46 on the turn (looking at the river)']])}
    ${X.ex('a flush draw on the turn', ['9 outs.', 'On the turn, 46 cards are unseen.', 'Chance the river is a heart = 9 ÷ 46 = <b>19.6%</b>.'])}
    <h3>3. The exact chance: two cards to come</h3>
    <p>On the flop, if you will definitely see both the turn and the river (usually because you're all-in), you get two chances. The cleanest way to calculate it is to work out the chance of missing <i>both</i> times, then subtract from 100%.</p>
    ${X.f('Chance to hit by the river = 1 − (misses on turn ÷ 47) × (misses on river ÷ 46)', [['misses on turn', '47 − outs'], ['misses on river', '46 − outs (one non-out has been used up)']])}
    ${X.ex('a flush draw on the flop, all-in', ['9 outs; 47 unseen cards; so 47 − 9 = 38 cards miss on the turn.', 'Chance the turn misses = 38 ÷ 47 = 80.9%.', 'If the turn missed, 46 cards remain and 37 of them miss. Chance the river also misses = 37 ÷ 46 = 80.4%.', 'Chance both miss = 0.809 × 0.804 = 65.0%.', 'Chance you hit at least once = 100% − 65.0% = <b>35.0%</b>.'])}
    <h3>4. The rule of 2 and 4</h3>
    <p>That calculation is too slow at the table. The rule of 2 and 4 gets you within a couple of percent instantly:</p>
    ${X.f('One card to come: chance ≈ outs × 2.&nbsp;&nbsp;Two cards to come: chance ≈ outs × 4', [['× 2', 'turn → river, or flop → turn only'], ['× 4', 'flop → river, only when you\'ll see both cards']])}
    <p><b>Why it works:</b> each card is about 1 in 46 to 1 in 47 — just over 2% — so each out is worth about 2% per card. With two cards, each out is worth roughly double, about 4%.</p>
    ${X.ex('rule of 4 vs the exact answer', ['Flush draw, 9 outs, all-in on the flop.', 'Rule of 4: 9 × 4 = <b>36%</b>.', 'Exact (from section 3): <b>35.0%</b>. Close enough to decide.'])}
    <h3>5. The correction for big draws</h3>
    <p>The rule of 4 over-counts big draws, because it double-counts the runouts where an out comes on both the turn and the river (you only need one). Above 8 outs, subtract the number of outs above 8:</p>
    ${X.f('Two cards to come, more than 8 outs: chance ≈ outs × 4 − (outs − 8)')}

    ${X.t(['Outs', 'Turn → river (exact)', 'Rule of 2', 'Flop → river (exact)', 'Rule of 4 (corrected)'], [['4', '8.7%', '8%', '16.5%', '16%'], ['6', '13.0%', '12%', '24.1%', '24%'], ['8', '17.4%', '16%', '31.5%', '32%'], ['9', '19.6%', '18%', '35.0%', '35%'], ['12', '26.1%', '24%', '45.0%', '44%'], ['15', '32.6%', '30%', '54.1%', '53%']], [0, 1, 2, 3, 4])}

    ${X.turn('You have 12 outs on the turn. Estimate your chance to hit the river.', '<ol><li>One card to come, so use the rule of 2: 12 × 2 = <b>24%</b>.</li><li>Exact: 12 ÷ 46 = <b>26.1%</b>.</li></ol>')}
    ${X.mistakes(['Using ×4 when facing a flop bet with more betting to come. You\'re only buying one card.', 'Counting the same card twice in combo draws.', 'Counting outs that also give your opponent a better hand.'])}

  X.L({ id: 'draws', course: 'maths', title: 'Putting it together: calling with a draw', mins: 9, sum: 'A four-step routine that combines outs and pot odds into a call-or-fold decision.',
    html: `${X.goals(['A reusable four-step routine for drawing decisions', 'How to tell when the price is right, close, or wrong', 'A first look at implied odds — winning more after you hit'])}
    ${X.terms([['Outs', 'Unseen cards that give you the best hand (previous lesson).'], ['Required equity', 'Call ÷ final pot (the pot odds lesson).'], ['Implied odds', 'Extra money you expect to win on later streets when you hit. Covered fully in its own lesson.']])}
    <h3>The routine</h3>
    <ol><li><b>Count your clean outs.</b></li><li><b>Convert to a chance to hit</b> with one card to come: outs × 2 (or outs ÷ 46 exactly).</li><li><b>Work out the equity you need</b>: call ÷ (pot + bet + call).</li><li><b>Compare.</b> If your chance is higher, call. If it's lower, fold — unless you expect to win enough extra later (implied odds).</li></ol>

    ${X.ex('the same draw facing a small bet', ['Same hand; this time your opponent bets 5bb into 20bb.', 'Outs 9; chance 19.6%.', 'Needed: 5 ÷ (20 + 5 + 5) = 5 ÷ 30 = 16.7%.', '19.6% is more than 16.7%.'], { result: 'Call — the price alone makes it profitable.' })}
    ${X.w('drawdecision', 'Drawing decision, worked live', ['Set your outs and the bet you face.', 'The steps show your chance, the price, the decision, and — if it\'s a fold on direct odds — how much extra you\'d need to win when you hit.'], '9,20,10')}
    ${X.turn('Turn. You have an open-ended straight draw (8 outs). The pot is 30bb and your opponent bets 10bb. Call or fold on direct odds?', '<ol><li>Outs 8 → chance ≈ 16% (exact 8 ÷ 46 = 17.4%).</li><li>Needed: 10 ÷ (30 + 10 + 10) = 10 ÷ 50 = 20%.</li><li>17.4% < 20% → a fold on direct odds. It\'s close, so a little implied odds could make it a call.</li></ol>')}
    ${X.mistakes(['Using the two-card rule of 4 on the flop when you face a bet and more betting is to come.', 'Calling every draw "because it might hit" — the price must justify it.'])}
    ${X.sum(['Outs → chance; bet → required equity; compare.', 'Small bets let you call draws profitably; big bets usually don\'t, unless you can win more later.'])}`,

  X.L({ id: 'ev', course: 'maths', title: 'Expected value (EV)', mins: 11, sum: 'The language every poker decision is made in: list the outcomes, weight each by its chance, add them up.',
    html: `${X.goals(['What expected value is and why it matters more than any single result', 'The three-step method: list outcomes, multiply, add', 'The ready-made formulas for calls, bluffs and semi-bluffs'])}
    ${X.terms([['Expected value (EV)', 'The average result of a decision if you could repeat it many times. Positive EV (+EV) decisions make money in the long run; negative EV (−EV) decisions lose it.'], ['Outcome', 'One way the decision can turn out, such as "they fold" or "they call and I win".'], ['Net amount', 'What you gain or lose in an outcome compared with not playing — chips won minus chips you put in.']])}
    <h3>1. The method</h3>
    <ol><li><b>List every outcome</b> of the decision.</li><li>For each, write its <b>chance</b> and its <b>net amount</b> (+ for a gain, − for a loss).</li><li><b>Multiply</b> each chance by its amount, then <b>add</b> them all up.</li></ol>
    ${X.f('EV = (chance₁ × amount₁) + (chance₂ × amount₂) + …', [['chance', 'as a decimal (35% = 0.35); all the chances must add up to 1 (100%)'], ['amount', 'net chips won (+) or lost (−) in that outcome']])}
    ${X.ex('calling an all-in', ['The pot is 20bb. Your opponent goes all-in for 10bb more. You have 35% equity.', 'Outcome 1 — you win (35%): you collect the 20bb pot and their 10bb. Net <b>+30bb</b>.', 'Outcome 2 — you lose (65%): you lose your 10bb call. Net <b>−10bb</b>.', 'Multiply: 0.35 × 30 = +10.5. And 0.65 × (−10) = −6.5.', 'Add: 10.5 − 6.5 = <b>+4bb</b>.'], { result: 'Calling is worth +4bb on average. (The pot odds lesson gave the same answer with the shortcut "equity × final pot − call" = 0.35 × 40 − 10 = +4.)' })}
    ${X.ex('a pure bluff', ['The pot is 10bb. You bet 8bb with a hand that can\'t win at showdown.', 'Outcome 1 — they fold (45%): you win the 10bb pot. Net <b>+10</b>.', 'Outcome 2 — they call (55%): you lose your 8bb bet. Net <b>−8</b>.', 'EV = 0.45 × 10 + 0.55 × (−8) = 4.5 − 4.4 = <b>+0.1bb</b>.'], { result: 'Barely profitable. The bluff breaks even when they fold 8 ÷ (10 + 8) = 44.4% of the time.' })}
    ${X.w('evcalc', 'Expected value calculator', ['Pick a situation. Each row is one outcome: edit its amount (net bb) and its chance.', 'The steps multiply each row and add them up. The chances must total 100%.'])}
    <h3>2. Ready-made formulas</h3>
    ${X.t(['Decision', 'EV formula'], [['Call (all-in)', 'equity × (pot + bet + call) − call'], ['Pure bluff', 'fold% × pot − call% × bet'], ['Semi-bluff all-in', 'fold% × pot + call% × (equity × (pot + bet + bet) − bet)']])}
    ${X.ex('a semi-bluff', ['The pot is 10bb. You go all-in for 10bb with a draw. Your opponent folds 40% of the time; when they call you have 30% equity.', 'If they fold (40%): net +10.', 'If they call (60%): the final pot is 10 + 10 + 10 = 30. Your average result = 0.30 × 30 − 10 = 9 − 10 = −1.', 'EV = 0.40 × 10 + 0.60 × (−1) = 4 − 0.6 = <b>+3.4bb</b>.'], { result: 'Even though calling it off would lose a little, the folds make the semi-bluff clearly profitable.' })}
    ${X.key('Judge decisions, not results', 'You will lose plenty of +EV all-ins and win some −EV ones. What matters is the average. The <b>Fundamental Theorem of Poker</b> (David Sklansky) puts it this way: you gain when you play the way you would if you could see your opponent\'s cards, and you lose when you don\'t.')}
    ${X.turn('You bluff 10bb into a 10bb pot. Your opponent folds 55% of the time. What is the EV?', '<ol><li>Fold (55%): +10. Call (45%): −10.</li><li>EV = 0.55 × 10 + 0.45 × (−10) = 5.5 − 4.5 = <b>+1bb</b>.</li></ol>')}
    ${X.mistakes(['Using the gross pot instead of the net amount: when you win, subtract nothing; when you lose, count only what you put in.', 'Forgetting an outcome, so the chances don\'t add up to 100%.'])}
    ${X.sum(['EV = Σ chance × net amount.', 'Call: equity × final pot − call. Bluff: fold% × pot − call% × bet.', 'Make +EV decisions and ignore short-term results.'])}`,

  X.L({ id: 'implied', course: 'maths', title: 'Implied and reverse implied odds', mins: 10, sum: 'When money you expect to win later makes a call right — and when a "good" hand loses you more later.',

    <h3>1. Implied odds</h3>

    ${X.ex('how much extra does the flush draw need?', ['Turn. Pot 20bb, opponent bets 10bb. You have 9 outs: equity 9 ÷ 46 = 0.196.', 'Final pot = 20 + 10 + 10 = 40bb.', 'X = 10 ÷ 0.196 − 40 = 51.1 − 40 = <b>11.1bb</b>.', 'So you need to win about 11bb more, on average, when you hit the flush.'], { result: 'If your opponent has 80bb left and will often call a river bet, the call is fine. If they\'re nearly all-in, or will never pay you when the flush comes, it isn\'t.' })}
    ${X.w('drawdecision', 'Implied odds calculator', ['When the call loses on direct odds, the last step shows how much extra you need to win when you hit.'], '9,20,10')}
    <h3>2. Set-mining</h3>

    ${X.ex('reverse implied odds', ['You call a raise with ' + h('KsJd') + '. Your opponent\'s raising range contains A-K, K-Q and big pairs.', 'The flop is ' + h('Kh7c2d') + ': you have top pair.', 'Against A-K you are badly behind, and against K-Q you\'re only slightly ahead.', 'If you bet and call down, you win a little from worse hands and lose a lot to A-K.'], { result: 'The hand loses money after the flop even though it "hits". That\'s reverse implied odds.' })}

  X.L({ id: 'fold-equity', course: 'maths', title: 'Fold equity and semi-bluffs', mins: 9, sum: 'Why betting a draw can beat both checking and calling: you win now when they fold, and you can still hit when they call.',
    html: `${X.goals(['What fold equity is', 'How often a pure bluff must work to break even', 'Why a semi-bluff needs far fewer folds than a pure bluff'])}
    ${X.terms([['Fold equity', 'The value you gain from the chance that your opponent folds.'], ['Pure bluff', 'A bet with a hand that has (almost) no chance to win at showdown.'], ['Semi-bluff', 'A bet with a hand that is probably behind now but has outs.'], ['Break-even fold rate', 'How often the opponent must fold for a bet to break even.']])}

    ${X.w('evcalc', 'Compare a pure bluff and a semi-bluff', ['Switch between "Pure bluff" and "Semi-bluff all-in" and change the fold chance.', 'Notice how much lower the fold chance can be for the semi-bluff before the EV turns negative.'])}

  X.L({ id: 'variance', course: 'maths', title: 'Variance and sample size', mins: 11, sum: 'How swingy poker results are, what standard deviation and a confidence interval mean, and why 10,000 hands proves very little.',
    html: `${X.goals(['What win rate and standard deviation measure', 'How to work out the uncertainty in your win rate after N hands', 'How many hands it takes to know you\'re a winner'])}

    <h3>1. Signal and noise</h3>
    <p>A good six-max player wins about 3–8 bb/100. But a single block of 100 hands commonly swings by ±95bb. The signal (win rate) is tiny compared with the noise (standard deviation). Noise shrinks as you play more, but slowly — with the square root of the number of hands.</p>
    ${X.f('Standard error after N hands = σ ÷ √(N ÷ 100)', [['σ', 'standard deviation in bb/100'], ['N ÷ 100', 'the number of 100-hand blocks']])}
    ${X.ex('what 10,000 hands tells you', ['σ = 95 bb/100. N = 10,000 hands = 100 blocks of 100.', 'Standard error = 95 ÷ √100 = 95 ÷ 10 = <b>9.5 bb/100</b>.', '95% interval = ± 1.96 × 9.5 = ± 18.6.', 'If your true win rate is 5 bb/100, your measured win rate after 10,000 hands will usually land anywhere from about <b>−14 to +24</b>.'], { result: 'After 10,000 hands, a solid winner can easily look like a loser. About 30% of the time, they\'re actually down.' })}

    ${X.w('tool:variance', 'Variance simulator', ['Set a win rate, standard deviation and number of hands, then tap Simulate.', 'Each thin line is one simulated player with exactly those numbers. The dashed line is the expected result; the shaded band is the 95% range.', 'The tiles: chance of being down, the 95% range of the win rate you\'d measure, hands needed to be 95% sure, and the typical worst downswing. Risk of ruin and bankroll are explained in the next lesson.'])}

  X.L({ id: 'bayes', course: 'maths', title: 'Hand reading as Bayesian updating', mins: 10, sum: 'Start with a range; each action re-weights it. That is all hand reading is — and here is the arithmetic.',
    html: `${X.goals(['How an action changes the likelihood of each part of a range', 'The step-by-step update: multiply, add, divide', 'Why player type decides the update'])}
    ${X.terms([['Prior range', 'The range before an action.'], ['Action frequency', 'How often a player would take this action with each kind of hand.'], ['Updated (posterior) range', 'The range after the action: each part weighted by prior × action frequency.']])}

(function () {
