/* ===== Content: Advanced theory ===== */
(function () {
  const UI = window.UI; const L = (o) => { UI.LESSONS[o.id] = o; };
  const w = (name, title, arg) => `<div class="widget" data-w="${name}"${arg ? ` data-arg="${arg}"` : ''}>${title ? `<h4>${title}</h4>` : ''}</div>`;
  UI.COURSES.push({ id: 'advanced', title: 'Advanced theory', blurb: 'Game theory optimal foundations and how to exploit deviations: defence frequencies, bluff ratios, sizing, range and nut advantage, blockers, push/fold and ICM.', lessons: ['preflop-ranges', 'gto-vs-exploit', 'mdf', 'polar-merged', 'bluff-ratios', 'geometric', 'board-texture', 'blockers', 'realization', 'multiway', 'toy-akq', 'pushfold', 'icm', 'hud-stats'] });

  L({ id: 'preflop-ranges', course: 'advanced', title: 'Building preflop ranges', mins: 8, sum: 'Why ranges widen toward the button, why the small blind 3-bets or folds, and how the big blind defends so wide.',
    html: `<p>Opening ranges widen as fewer players remain behind you and your chance of having position after the flop rises. Six-max, 100bb baselines run from about 17% under the gun to about 50% on the button.</p>
    ${w('tool:charts', 'All baseline charts')}
    <h3>Three structural ideas</h3><ul><li><b>Small blind: 3-bet or fold.</b> Calling invites squeezes from the big blind and guarantees you're out of position. A linear-to-polarised 3-bet range works better.</li><li><b>Big blind: defend wide.</b> You already have 1bb invested and close the action, so the price is excellent — often you need under 30% equity against a button min-raise.</li><li><b>Facing 3-bets:</b> continue less out of position. Easy Game's simplification for small stakes — 4-bet or fold out of position at 100bb heads-up — is a practical version of this.</li></ul>
    <p>These charts are baselines. Against weak players you widen (isolation); against aggressive players behind you, tighten — table dynamics come first.</p>`,
    quiz: [{ q: 'Why does the big blind defend so widely against a button raise?', opts: ['He has position', 'He gets a great price having already posted 1bb and closes the action', 'The button is always bluffing', 'Rake'], a: 1, why: 'Price and closing the action make many hands profitable calls.' }] });

  L({ id: 'gto-vs-exploit', course: 'advanced', title: 'Game theory optimal vs exploitative play', mins: 9, sum: 'Equilibrium as a defence; exploitation as the profit engine. Know both.',
    html: `<p>A <b>game theory optimal (GTO)</b> strategy is one half of a Nash equilibrium: if both players use equilibrium strategies, neither can gain by changing. Its value is defensive — it can't be exploited. It doesn't maximise profit against a specific weak opponent.</p>
    <p>An <b>exploitative</b> strategy deviates to punish an opponent's mistakes: bluff more against over-folders, value bet thinner against over-callers. Every exploit opens you to a counter-exploit, which matters only if the opponent adapts.</p>
    <div class="callout key"><h4>The working model</h4>Start from a sound baseline. Identify the opponent's biggest deviation. Deviate in the direction that exploits it — and only as far as you're confident of the read. Easy Game's player-type plans are exactly this.</div>
    <p>The best way to understand equilibrium is to solve a tiny game where you can see everything.</p>
    ${w('tool:toygames', 'Game theory lab')}`,
    quiz: [{ q: 'Against a calling station, the most profitable adjustment from equilibrium is…', opts: ['Bluff more', 'Value bet thinner and bluff less', 'Play GTO', 'Check more'], a: 1, why: 'He over-calls: get value from worse hands, stop bluffing.' }, { q: 'The main benefit of an equilibrium strategy is…', opts: ['Maximum profit against everyone', 'It cannot be exploited', 'It bluffs a lot', 'It is simple'], a: 1, why: 'It is a defensive baseline.' }] });

  L({ id: 'mdf', course: 'advanced', title: 'Minimum defence frequency and alpha', mins: 8, sum: 'How often you must continue so bluffs don\'t print money — and how often bluffs need to work.',
    html: `<p>If you fold too often to bets, your opponent profits by betting any two cards. <b>Minimum defence frequency (MDF)</b> is the share of your range that must continue against a bet of size b (as a fraction of the pot):</p>
    <div class="formula">MDF = pot ÷ (pot + bet) = 1 ÷ (1 + b)</div>
    <p>The flip side is <b>alpha</b>: how often a pure bluff must work to break even. Alpha = bet ÷ (pot + bet) = 1 − MDF.</p>
    ${w('mdf', 'Defence frequency by bet size')}
    <div class="callout warn"><h4>MDF is a range concept</h4>It's about your whole range, not this hand. It assumes the bettor could be bluffing with nothing; when ranges have equity on earlier streets, or the opponent rarely bluffs (Easy Game: people bluff less than you think), folding more than MDF is correct. Use MDF to find your <i>own</i> over-folding, not to justify hero calls against passive players.</div>`,
    quiz: [{ q: 'MDF against a half-pot bet?', opts: ['50%', '66.7%', '75%', '33%'], a: 1, why: '1 ÷ 1.5 = 66.7%.' }, { q: 'Against a known non-bluffer, MDF suggests…', opts: ['Still defending 67% to a half-pot bet', 'Folding much more is correct — MDF assumes bluffs exist', 'Raising', 'Nothing changes'], a: 1, why: 'Exploit over-value-heavy betting by folding.' }] });

  L({ id: 'polar-merged', course: 'advanced', title: 'Polarised and merged ranges', mins: 8, sum: 'Big bets for nuts-or-air; small bets for wide, medium-strength ranges.',
    html: `<p>A <b>polarised</b> betting range contains strong hands and bluffs, but few medium hands. A <b>merged</b> (linear) range bets its strongest hands down to some threshold, with fewer bluffs.</p>
    <ul><li>Polarised ranges prefer <b>large</b> bets: the value hands want maximum money in; bluffs want maximum fold equity; medium hands that would hate a raise are checked.</li><li>Merged ranges prefer <b>small</b> bets: you want calls from slightly worse hands and want to deny equity cheaply.</li><li>A <b>capped</b> range lacks the strongest hands (often the result of just calling earlier). Facing a capped range, big polarised bets gain power.</li></ul>
    ${w('polar', 'The polarised river game')}
    <p>This is also why Easy Game's heads-up framework polarises in-position c-bets: middle-strength hands that dislike a check-raise check back, while air and strong hands bet.</p>`,
    quiz: [{ q: 'Which bet size suits a polarised river range?', opts: ['Tiny', 'Large', 'Exactly ⅓ pot', 'Check'], a: 1, why: 'Value wants size; bluffs want fold equity.' }] });

  L({ id: 'bluff-ratios', course: 'advanced', title: 'Balanced bluff-to-value ratios', mins: 8, sum: 'On the river, bluffs should equal the caller\'s required equity. Earlier streets carry more bluffs.',
    html: `<p>On the river a balanced polarised range makes a bluff-catcher indifferent between calling and folding. That happens when the share of bluffs in your betting range equals the caller's required equity:</p>
    <div class="formula">Bluff share = bet ÷ (pot + 2 × bet)</div>
    <table class="t"><thead><tr><th>River bet</th><th class="n">Bluffs in range</th><th class="n">Value : bluff</th></tr></thead><tbody><tr><td>⅓ pot</td><td class="n">20%</td><td class="n">4 : 1</td></tr><tr><td>½ pot</td><td class="n">25%</td><td class="n">3 : 1</td></tr><tr><td>¾ pot</td><td class="n">30%</td><td class="n">2.3 : 1</td></tr><tr><td>Pot</td><td class="n">33%</td><td class="n">2 : 1</td></tr><tr><td>2× pot</td><td class="n">40%</td><td class="n">1.5 : 1</td></tr></tbody></table>
    <p>Earlier streets can carry more bluffs because your "bluffs" are usually draws with equity — some become value by the river. A common rule of thumb: roughly 2 bluffs per value combo on the flop, about 1 : 1 on the turn, then the river ratio above.</p>
    ${w('tool:sizing', 'Ratios and frequencies for any size')}`,
    quiz: [{ q: 'A pot-sized river bet with a balanced range contains what share of bluffs?', opts: ['50%', '33%', '25%', '20%'], a: 1, why: '1 ÷ (1 + 2) = 33%.' }] });

  L({ id: 'geometric', course: 'advanced', title: 'Geometric sizing and stack-to-pot ratio', mins: 7, sum: 'Bet the same fraction each street to get stacks in exactly by the river.',
    html: `<p><b>Stack-to-pot ratio (SPR)</b> = effective stack ÷ pot on the flop. Low SPR (under about 3) means one pair is often good enough to get it in; high SPR (over about 8) rewards position and nutted hands.</p>
    <p><b>Geometric sizing</b> bets the same pot fraction on each remaining street so the last bet is exactly all-in. With pot P, stack S and n streets:</p>
    <div class="formula">fraction = ( ((P + 2S) ÷ P)<sup>1/n</sup> − 1 ) ÷ 2</div>
    <p>A 100bb single-raised pot (about 6bb in the pot, 97bb behind) needs bets of about 110% pot on all three streets; a 3-bet pot (about 20bb, 80bb behind) only about 54%. That is why 3-bet pots play with smaller bets. This is the maths behind Easy Game's pot management chapter.</p>
    ${w('tool:sizing', 'Plan the streets')}`,
    quiz: [{ q: 'Pot 20bb, 80bb behind, two streets left. Geometric bet size?', opts: ['About 50% pot', 'About 75% pot', 'About 100% pot', 'About 33% pot'], a: 2, why: '(20 + 160) ÷ 20 = 9; √9 = 3; (3 − 1) ÷ 2 = 1 → a pot-sized bet on each of the two streets. With three streets it would be about 54%.' }] });

  L({ id: 'board-texture', course: 'advanced', title: 'Range advantage, nut advantage and board texture', mins: 9, sum: 'Who does this flop favour, on average and at the top? That decides how often and how big to bet.',
    html: `<p><b>Range advantage</b>: whose range has more equity on this board. <b>Nut advantage</b>: who holds more of the very strongest hands. They often coincide but not always.</p>
    <ul><li>High, dry boards (A-7-2, K-8-3) favour the preflop raiser on both counts: bet often and small.</li><li>Low, connected boards (7-6-5, 8-6-4) favour the big blind caller, who has more suited connectors and small pairs: the raiser checks more.</li><li>Monotone and paired boards compress equities: smaller bets, fewer bluffs.</li></ul>
    ${w('texture', 'Range advantage on six classic flops')}
    <p>Rule of thumb: with a big range advantage, bet a large share of your range small. With a nut advantage but no range advantage, bet a polarised range big.</p>`,
    quiz: [{ q: 'Button opens, big blind calls. Which flop most favours the big blind?', opts: ['A♣K♦3♥', '7♥6♠5♦', 'K♠K♦2♣', 'A♠7♣2♦'], a: 1, why: 'Low connected boards hit the big blind\'s wide, connected calling range.' }] });

  L({ id: 'blockers', course: 'advanced', title: 'Blockers and card removal', mins: 7, sum: 'The cards you hold change what your opponent can hold.',
    html: `<p>Holding a card removes combos from your opponent's range. On a three-heart river, the A♥ means your opponent can't have the nut flush; on A-K-x, holding an ace cuts A-K combos by a quarter.</p>
    ${w('blockers', 'How your cards remove flush combos')}
    <ul><li><b>Good bluffs block value</b> and don't block the hands you want to fold. Bluffing with the A♥ on a three-heart board removes the nuts from his range.</li><li><b>Good bluff-catchers block bluffs less</b>: if all his missed draws are spades and you hold two spades, you block his bluffs — making your call worse.</li><li>Blockers are a tie-breaker between similar hands, not a reason to make a play by themselves.</li></ul>
    ${w('combos', 'Combo counter')}`,
    quiz: [{ q: 'River four-to-a-flush board in hearts. Your best bluff candidate is…', opts: ['A hand with the A♥', 'A hand with two low hearts', 'A pair', 'Any hand'], a: 0, why: 'It blocks the nut flush and makes your story credible.' }] });

  L({ id: 'realization', course: 'advanced', title: 'Equity realisation and position', mins: 6, sum: 'Raw equity overstates out-of-position hands and understates in-position ones.',
    html: `<p>Equity assumes the hand goes to showdown. In practice you sometimes fold your equity to bets, or win more than your share by betting. <b>Equity realisation (EQR)</b> is the share of your raw equity you actually capture.</p>
    <table class="t"><thead><tr><th>Factor</th><th>Effect on realisation</th></tr></thead><tbody><tr><td>Position</td><td>In position realises more (often above 100% for good hands)</td></tr><tr><td>Playability</td><td>Suited and connected hands realise more than disconnected offsuit hands</td></tr><tr><td>Stack depth</td><td>Deeper stacks amplify position and skill</td></tr><tr><td>Range strength</td><td>Capped, weak ranges get bet off their equity</td></tr></tbody></table>
    <p>This is the formal version of Easy Game's Chapter 2: choose hands that keep postflop equity, and of Chapter 6: position and skill change what your cards are worth. When the price says "call" out of position with an offsuit hand, it often isn't.</p>`,
    quiz: [{ q: 'Which hand realises its equity best from the big blind against a button raise?', opts: ['K♣6♦', '8♠7♠', 'Q♦3♣', 'J♥4♣'], a: 1, why: 'Suited and connected hands keep equity on more flops and turns.' }] });

  L({ id: 'multiway', course: 'advanced', title: 'Multiway pots', mins: 6, sum: 'More players: tighter value thresholds, fewer bluffs, more nut-potential hands.',
    html: `<p>Each added opponent shrinks your equity and your fold equity together. Hands that make strong hands (sets, flushes, straights) hold up; big pairs and top-pair hands lose value fast.</p>
    ${w('multiway', 'Equity against more opponents')}
    <ul><li>Bluff less — every extra player is another chance someone has it.</li><li>Value bet slightly stronger hands — the best hand among three is stronger than among two.</li><li>With a fish in the pot, lead for value rather than check to the raiser (Easy Game, Chapter 7).</li></ul>`,
    quiz: [{ q: 'Moving from heads-up to three-way, your bluffing frequency should…', opts: ['Rise', 'Fall', 'Stay the same', 'Double'], a: 1, why: 'Each player must fold; fold equity multiplies away.' }] });

  L({ id: 'toy-akq', course: 'advanced', title: 'Toy games: the AKQ game', mins: 9, sum: 'Solve a three-card poker game by hand and see why bluffing and calling frequencies are linked.',
    html: `<p>Three cards, two players, one bet. Player 2 always bets the Ace (pure value) and never bets the King (it can't get called by worse or fold better — Easy Game's reasons for betting in miniature). The Queen is a bluff candidate.</p>
    <ul><li>Player 2 bluffs the Queen so that a King is indifferent to calling: bluffs : value = 1 : (pot + 1).</li><li>Player 1 calls the King so that a Queen is indifferent to bluffing: K calls (pot − 1) ÷ (pot + 1).</li></ul>
    <p>With a pot of 2 and a bet of 1, both frequencies are ⅓. Move the sliders and watch: if Player 1 calls too much, Player 2 should never bluff; if Player 1 folds too much, bluff every Queen.</p>
    ${w('akq', 'AKQ game solver and simulator')}`,
    quiz: [{ q: 'In the AKQ game, Player 2 never bets the King because…', opts: ['It loses to the Ace only', 'Only the Ace calls and only the Queen folds — neither value nor bluff', 'It is too strong', 'Rules forbid it'], a: 1, why: 'A pure bluff-catcher: betting it can\'t gain.' }] });

  L({ id: 'pushfold', course: 'advanced', title: 'Push/fold equilibrium', mins: 7, sum: 'Below about 15 big blinds, the small blind\'s best strategy is all-in or fold.',
    html: `<p>At short stacks there's little room to play after the flop, so the small blind's options compress into <b>shove or fold</b>. Solving heads-up push/fold exactly gives the Nash equilibrium: the shoving range that makes the big blind's best calling range as unprofitable as possible, and vice versa.</p>
    <p>At 10bb the equilibrium shoves about 58% of hands and calls with about 37%. At 5bb, roughly 72% and 62%. Hands with high-card power and blockers to calling hands (any ace, most kings) are shoves deeper than you might think.</p>
    ${w('tool:pushfold', 'Solve any stack depth')}
    <p>Equilibrium is the baseline. Against a big blind who calls too little, shove wider; against one who calls too much, shove tighter.</p>`,
    quiz: [{ q: 'At 10bb heads-up, roughly what share of hands does the equilibrium small blind shove?', opts: ['15%', '35%', '58%', '90%'], a: 2, why: 'About 58% at 10bb.' }] });

  L({ id: 'icm', course: 'advanced', title: 'The Independent Chip Model', mins: 8, sum: 'In tournaments chips aren\'t money. ICM converts stacks to prize equity.',
    html: `<p>In a cash game a chip won is worth the same as a chip lost. In a tournament it isn't: doubling your stack doesn't double your prize equity, and busting costs your whole share. The <b>Independent Chip Model (ICM)</b> estimates each player's prize equity: the chance of finishing first is your share of the chips, and later places are computed by removing each possible winner and repeating.</p>
    ${w('tool:icm', 'ICM and bubble factors')}
    <p>The <b>bubble factor</b> measures how much more a lost chip hurts than a won chip helps. A bubble factor of 1.5 means you need about 60% equity to call an all-in that would be a 50% call in a cash game. Short stacks pressure medium stacks; big stacks can attack everyone.</p>`,
    quiz: [{ q: 'A bubble factor above 1 means…', opts: ['Call wider', 'You need more equity than chip-EV suggests to call', 'Chips are worth more when won', 'Nothing'], a: 1, why: 'Losing hurts more than winning helps.' }] });

  L({ id: 'hud-stats', course: 'advanced', title: 'Reading the numbers: player statistics', mins: 7, sum: 'VPIP, PFR, 3-bet, aggression and showdown stats — what they say and what they don\'t.',
    html: `<p>Tracking software summarises play in a handful of statistics. Felt Lab computes them for your own play on the Stats page.</p>
    <table class="t"><thead><tr><th>Statistic</th><th>Meaning</th><th class="n">Typical six-max regular</th></tr></thead><tbody>
    <tr><td>Voluntarily put money in pot (VPIP)</td><td>Share of hands you call or raise preflop</td><td class="n">22–28%</td></tr>
    <tr><td>Preflop raise (PFR)</td><td>Share of hands you raise preflop</td><td class="n">18–23%</td></tr>
    <tr><td>3-bet</td><td>Re-raise when facing a single raise</td><td class="n">7–11%</td></tr>
    <tr><td>Continuation bet (c-bet)</td><td>Bet the flop as preflop raiser when you can</td><td class="n">50–65%</td></tr>
    <tr><td>Aggression factor (AF)</td><td>(Bets + raises) ÷ calls after the flop</td><td class="n">2–4</td></tr>
    <tr><td>Went to showdown (WTSD)</td><td>Share of flops seen that reach showdown</td><td class="n">25–30%</td></tr>
    <tr><td>Won money at showdown (W$SD)</td><td>Share of showdowns won</td><td class="n">50–55%</td></tr></tbody></table>
    <p>A big gap between VPIP and PFR (for example 40 / 8) marks a passive caller; high VPIP with high aggression marks a loose-aggressive player. Easy Game's warning stands: stats need big samples, and the most reliable reads are the obvious ones — limps, min-raises, stack sizes, 3-bet patterns.</p>`,
    quiz: [{ q: 'VPIP 45%, PFR 6%. This player is most likely…', opts: ['A tight regular', 'A loose-passive caller', 'A maniac', 'A nit'], a: 1, why: 'Plays many hands but rarely raises.' }] });
})();

(function () {

  // ---------- helpers ----------
  const lessonDone = id => !!(UI.S().lessons[id] && UI.S().lessons[id].done);
  const courseProgress = c => { const n = c.lessons.length, d = c.lessons.filter(lessonDone).length; return [d, n]; };
  const allLessons = () => UI.COURSES.flatMap(c => c.lessons);

    ['Backdoor draw', 'A draw that needs both the turn and river, such as three to a flush on the flop.'], ['bb/100', 'Big blinds won per 100 hands; the standard win-rate unit.'], ['Blocker', 'A card in your hand that makes certain opponent hands impossible or less likely.'], ['Bubble factor', 'Under ICM, how much more a lost chip costs than a won chip gains.'], ['Button (BTN)', 'The dealer seat; acts last after the flop.'],

    ['Donk bet', 'Leading into the previous street\'s aggressor.'], ['Dry board', 'An uncoordinated board with few draws (K♣7♦2♠).'], ['Dynamic value', 'How the number of streets of value you want changes as the hand develops (Easy Game, Ch. 9).'], ['Equity', 'Your share of the pot if all remaining cards were dealt with no more betting.'], ['Equity realisation (EQR)', 'The share of raw equity a hand actually captures once betting is considered.'],
    ['Expected value (EV)', 'The long-run average result of a decision: Σ probability × amount.'], ['Flat', 'To call a bet or raise rather than re-raise.'], ['Float', 'To call a bet planning to take the pot away later.'], ['Fold equity', 'The value gained from the chance your opponent folds.'], ['G-bucks', 'Judging a decision by equity against your opponent\'s range rather than their actual hand (Phil Galfond, via Easy Game Ch. 12).'],
    ['Game theory optimal (GTO)', 'An equilibrium strategy that cannot be exploited.'], ['Geometric sizing', 'Betting the same pot fraction each street so the last bet is exactly all-in.'], ['Gutshot', 'An inside straight draw with 4 outs.'], ['Heads-up display (HUD)', 'An on-table panel of statistics or, in Felt Lab, live odds and equity.'], ['Hijack (HJ)', 'Two seats right of the button in six-max.'],
    ['Implied odds', 'Money you expect to win on later streets when you hit.'], ['In position (IP)', 'Acting after your opponent on the flop, turn and river.'], ['Independent Chip Model (ICM)', 'A model converting tournament chip stacks into prize-pool equity.'], ['Isolation', 'Raising to play a pot against a specific (usually weaker) player.'], ['Merged range', 'A range betting its strongest hands down to a threshold, with few bluffs.'],
    ['Minimum defence frequency (MDF)', 'The share of your range that must continue against a bet so bluffs don\'t automatically profit: pot ÷ (pot + bet).'], ['Monotone', 'A flop with three cards of one suit.'], ['Nash equilibrium', 'A strategy pair where neither player gains by changing alone.'], ['Nut advantage', 'Holding more of the very strongest possible hands on a board.'], ['Nuts', 'The best possible hand given the board.'],
    ['Open-ended straight draw (OESD)', 'Four consecutive cards needing one of two ranks: 8 outs.'], ['Out of position (OOP)', 'Acting first after the flop.'], ['Outs', 'Unseen cards that give you the best hand.'], ['Overpair', 'A pocket pair higher than every board card.'], ['Polarised range', 'A betting range of strong hands and bluffs with few medium hands.'],
    ['Pot equity', 'Your chance to win the pot if it goes to showdown.'], ['Pot odds', 'The ratio of the pot to the cost of a call.'], ['Pot management', 'Easy Game\'s term for making the pot as large or as small as your hand wants.'], ['Preflop raise (PFR)', 'Share of hands raised preflop.'], ['Range', 'All the hands a player could hold in a spot, weighted by likelihood.'],
    ['Range advantage', 'Having more overall equity than your opponent\'s range on a board.'], ['Reverse implied odds', 'Money you lose later when you make a second-best hand.'], ['Risk of ruin', 'The chance of losing your entire bankroll.'], ['Semi-bluff', 'A bet with a hand that is probably behind but has outs.'], ['Set', 'Three of a kind using a pocket pair.'],
    ['Showdown theory', 'Easy Game Ch. 10: check behind when worse hands won\'t call and you\'re unlikely to be outdrawn; bet when worse hands call or you\'re likely to be outdrawn.'], ['Showdown value', 'The chance a hand wins if checked down.'], ['Sklansky bucks', 'Judging a decision by equity against the hand the opponent actually held.'], ['Squeeze', 'A 3-bet after an open and one or more calls.'], ['Stack-to-pot ratio (SPR)', 'Effective stack divided by the pot on the flop.'],
    ['Standard deviation (σ)', 'A measure of how widely results swing, in bb/100.'], ['Static value', 'How many streets of value you want right now (Easy Game, Ch. 9).'], ['Thin value', 'A value bet where many calling hands beat you; usually made small.'], ['Under the gun (UTG)', 'The first seat to act preflop.'], ['Voluntarily put money in pot (VPIP)', 'Share of hands where you call or raise preflop (blinds don\'t count).'],
    ['Went to showdown (WTSD)', 'Share of flops seen that reach showdown.'], ['Wet board', 'A coordinated board with many draws (J♥T♥8♣).'], ['Won money at showdown (W$SD)', 'Share of showdowns won.']
  ];
  UI.route('glossary', main => {
    main.innerHTML = `<div class="band"><div class="narrow"><a class="crumb" href="#more">${UI.icon('back', 18)} More</a><h1>Glossary</h1><input type="search" placeholder="Search terms" data-q><div class="card mt list" data-l></div></div></div>`;
    const draw = q => { q = (q || '').toLowerCase(); $('[data-l]', main).innerHTML = GLOSS.filter(([t, d]) => !q || t.toLowerCase().includes(q) || d.toLowerCase().includes(q)).map(([t, d]) => `<div class="item" style="display:block"><b>${esc(t)}</b><div class="ink2">${esc(d)}</div></div>`).join('') || '<p class="muted">No match.</p>'; };
    $('[data-q]', main).oninput = e => draw(e.target.value); draw('');
  });

  // ---------- Sync / backup ----------
  const Sync = UI.Sync = { db: null, uid: null, status: 'off', last: null, downloads: null };
  function compact(s) {
    const c = JSON.parse(JSON.stringify(s));
    c.play.hands = c.play.hands.slice(-1500); c.log = c.log.slice(-1200);
    Object.values(c.drills).forEach(d => d.hist = d.hist.slice(-80));
    let str = JSON.stringify(c);
    while (str.length > 240000 && c.play.hands.length > 100) { c.play.hands = c.play.hands.slice(-Math.floor(c.play.hands.length / 2)); c.log = c.log.slice(-Math.floor(c.log.length / 2)); str = JSON.stringify(c); }
    return c;
  }
  UI.mergeStates = function (a, b) {
    const out = JSON.parse(JSON.stringify(a.updated >= b.updated ? a : b)); const other = a.updated >= b.updated ? b : a;
    // lessons
    Object.entries(other.lessons || {}).forEach(([k, v]) => { const o = out.lessons[k]; if (!o) out.lessons[k] = v; else { if (v.done && (!o.done || v.done < o.done)) o.done = v.done; if (v.best !== undefined) o.best = Math.max(o.best || 0, v.best); } });
    // drills
    Object.entries(other.drills || {}).forEach(([k, v]) => { const o = out.drills[k]; if (!o) { out.drills[k] = v; return; } const seen = new Set(o.hist.map(h => h[0])); const extra = v.hist.filter(h => !seen.has(h[0])); o.n += extra.length; o.c += extra.filter(h => h[1]).length; o.hist = o.hist.concat(extra).sort((x, y) => x[0] - y[0]).slice(-400); });
    // srs
    const key = x => x.d + ':' + x.seed; const sm = new Map(); (other.srs || []).concat(out.srs || []).forEach(x => sm.set(key(x), x)); out.srs = [...sm.values()];
    // hands, sessions, log
    const uniq = (arr, k) => { const m = new Map(); arr.forEach(x => m.set(k(x), x)); return [...m.values()].sort((x, y) => x.t - y.t); };
    out.play.hands = uniq((other.play.hands || []).concat(out.play.hands || []), x => x.t + ':' + x.hole).slice(-5000);
    out.play.sessions = uniq((other.play.sessions || []).concat(out.play.sessions || []), x => x.t);
    out.log = uniq((other.log || []).concat(out.log || []), x => x.t + ':' + x.k).slice(-4000);
    out.updated = Date.now();
    return out;
  };
  async function initCloud() {
    if (!window.claude || typeof window.claude.use !== 'function') return;
    try {
      const timeout = new Promise(r => setTimeout(() => r(null), 10000));
      const [db, user, dl] = await Promise.all([Promise.race([window.claude.use('db'), timeout]), Promise.race([window.claude.use('user'), timeout]), Promise.race([window.claude.use('downloads'), timeout])]);
      Sync.downloads = dl || null;
      if (!db || !user) { Sync.status = 'unavailable'; return; }
      const uid = await user.id(); if (!uid) { Sync.status = 'signedout'; return; }
      Sync.db = db; Sync.uid = uid; Sync.status = 'on';
      const ref = db.doc('data/users/' + uid + '/progress');
      const snap = await ref.get();
      if (snap.exists) {
        const remote = snap.data().state; const local = UI.S();
        if (remote && remote.updated > local.updated) { UI.replaceState(UI.mergeStates(local, remote)); UI.toast('Progress synced from your account'); UI.render(); }
      }
      Sync.last = Date.now();
      let pushing = false, again = false;
      const push = UI.debounce(async () => { if (pushing) { again = true; return; } pushing = true; try { await ref.set({ state: compact(UI.S()), at: Date.now() }); Sync.last = Date.now(); Sync.status = 'on'; } catch (e) { Sync.status = 'error'; Sync.err = e && e.code; } pushing = false; if (again) { again = false; push(); } }, 8000);
      UI.onSave(() => push());
      push();
    } catch (e) { Sync.status = 'error'; }
  }
  UI.exportJSON = () => JSON.stringify(Object.assign({ app: 'feltlab', exported: Date.now() }, UI.S()));
  async function saveFile(name, text) {
    if (Sync.downloads) { try { await Sync.downloads.save({ filename: name, data: text }); return true; } catch (e) { } }
    try { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: 'application/json' })); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000); return true; } catch (e) { return false; }
  }
  const IS_HOSTED = !!(window.claude && typeof window.claude.use === 'function');

  UI.route('settings', main => {
    const S = UI.S(); const st = S.settings;
    const syncTxt = { on: `On — your progress is saved to your Claude account${Sync.last ? ' (last sync ' + new Date(Sync.last).toLocaleTimeString() + ')' : ''}.`, off: IS_HOSTED ? 'Connecting…' : PWA.ok ? 'This is the installed app. Progress is stored on this device — use backup below to move it to another device or to the Claude link.' : 'This is the offline copy. Progress is stored on this device only — use backup below to move it.', unavailable: 'Not available in this view.', signedout: 'Sign in to Claude to sync.', error: 'Sync hit an error — your progress is still saved on this device.' }[Sync.status];
    main.innerHTML = `<div class="band"><div class="narrow"><a class="crumb" href="#more">${UI.icon('back', 18)} More</a><h1>Settings &amp; sync</h1>
      <div class="card"><h3>Appearance</h3><label class="f">Theme<div class="seg" data-th>${['system', 'light', 'dark'].map(t => `<button data-v="${t}" class="${st.theme === t ? 'on' : ''}">${t[0].toUpperCase() + t.slice(1)}</button>`).join('')}</div></label><label class="check"><input type="checkbox" data-four ${st.four ? 'checked' : ''}> Four-colour deck (blue diamonds, green clubs)</label><div class="row">${UI.cardsHTML(PK.parseCards('AsKhQdJc'), 'sm')}</div></div>
      <div class="card mt"><h3>${UI.icon('cloud', 20)} Online sync</h3><p>${esc(syncTxt)}</p>${Sync.status === 'on' ? `<button class="btn sm" data-sync>Sync now</button>` : ''}
        <p class="small muted">${PWA.ok ? 'Each copy of Felt Lab (this app, the downloaded file, the Claude link) keeps its own progress. Export from one and Import into another — they merge, nothing is lost.' : IS_HOSTED ? 'When you open Felt Lab from its link while online, progress saves to a private record in your Claude account and merges automatically. The downloaded offline file keeps its own progress on the device; bring it back here with Export / Import.' : 'Open the Felt Lab link when you are online to sync. Export your progress here, then Import it there — the two are merged, nothing is lost.'}</p></div>
      <div class="card mt"><h3>Backup &amp; move progress</h3><div class="row"><button class="btn" data-exp>${UI.icon('download', 18)} Export progress</button><button class="btn" data-copy>Copy as text</button><label class="btn">${UI.icon('upload', 18)} Import file<input type="file" accept=".json,application/json,text/plain" data-imp hidden></label><button class="btn" data-paste>Paste text</button></div><p class="small muted">Imports are merged with what is already here.</p></div>
      ${PWA.ok ? `<div class="card mt"><h3>${UI.icon('download', 20)} Install as an app</h3><p data-pwa>${PWA.installed ? 'Installed. Felt Lab opens from its home-screen icon and works offline.' : PWA.prompt ? 'Add Felt Lab to your home screen. It opens full-screen and works offline.' : 'In Chrome, tap ⋮ then <b>Install app</b> (or <b>Add to Home screen</b>).'}</p>${PWA.prompt && !PWA.installed ? '<button class="btn pri" data-inst>Install Felt Lab</button>' : ''}<p class="small muted">${PWA.cached ? 'Offline copy stored on this device.' : 'Preparing offline copy…'} ${PWA.persisted ? 'Storage is protected from automatic clean-up.' : ''}</p></div>` : ''}
      ${IS_HOSTED ? `<div class="card mt"><h3>${UI.icon('download', 20)} Offline copy</h3><p>Download Felt Lab as a single file. Open it in Chrome on your tablet in flight mode — everything works without a connection.</p><button class="btn pri" data-off>Download offline file</button><p class="small muted" data-offn></p></div>` : `<div class="card mt"><h3>Sharing</h3><p>This whole app is one file. Send it to anyone (messaging app, email, USB) — they open it in a browser. Their progress stays on their device.</p></div>`}
      <div class="card mt"><h3>Sharing with others</h3><ul><li><b>The link</b>: share the Felt Lab page from its menu in Claude. Each person keeps their own private progress.</li><li><b>The file</b>: send the offline file to any device — phone, tablet, laptop.</li></ul></div>
      <div class="card mt"><h3>Reset</h3><p class="small muted">Clears all progress on this device${IS_HOSTED ? ' (your cloud copy is overwritten at the next sync)' : ''}.</p><button class="btn red" data-reset>Reset everything</button></div>
      <p class="small muted mt">Felt Lab · equity engine verified against exhaustive 5-card enumeration · ${PK.DATA.N.toLocaleString()} boards per preflop matchup. Easy Game content summarised in our own words with chapter references; the book is © 2009 Andrew Seidman (heads-up chapter © Matt Colletta).</p></div></div>`;
    $$('[data-th] button', main).forEach(b => b.onclick = () => { st.theme = b.dataset.v; UI.save(); UI.applySettings(); UI.render(); });
    $('[data-four]', main).onchange = e => { st.four = e.target.checked; UI.save(); UI.applySettings(); };
    const sy = $('[data-sync]', main); if (sy) sy.onclick = async () => { try { await Sync.db.doc('data/users/' + Sync.uid + '/progress').set({ state: compact(UI.S()), at: Date.now() }); Sync.last = Date.now(); UI.toast('Synced'); UI.render(); } catch (e) { UI.toast('Sync failed'); } };
    $('[data-exp]', main).onclick = async () => { const ok = await saveFile(`felt-lab-progress-${new Date().toISOString().slice(0, 10)}.json`, UI.exportJSON()); if (!ok) UI.toast('Download blocked — use Copy as text'); };
    $('[data-copy]', main).onclick = async () => { try { await navigator.clipboard.writeText(UI.exportJSON()); UI.toast('Copied to clipboard'); } catch (e) { UI.modal(`<h3>Copy this text</h3><textarea style="min-height:200px">${esc(UI.exportJSON())}</textarea><div class="row" style="justify-content:flex-end"><button class="btn pri" data-close>Done</button></div>`); } };
    const doImport = txt => { try { const obj = JSON.parse(txt); if (!obj || !obj.drills || !obj.play) throw 0; UI.replaceState(UI.mergeStates(UI.S(), obj)); UI.save(); UI.toast('Progress imported and merged'); UI.render(); } catch (e) { UI.toast('That doesn\'t look like a Felt Lab export'); } };
    $('[data-imp]', main).onchange = e => { const f = e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => doImport(r.result); r.readAsText(f); };
    $('[data-paste]', main).onclick = () => { const m = UI.modal(`<h3>Paste exported text</h3><textarea data-t style="min-height:200px"></textarea><div class="row" style="justify-content:flex-end"><button class="btn" data-close>Cancel</button><button class="btn pri" data-ok>Import</button></div>`); $('[data-ok]', m.el).onclick = () => { doImport($('[data-t]', m.el).value); m.close(); }; };
    const off = $('[data-off]', main); if (off) off.onclick = async () => {
      const n = $('[data-offn]', main); n.innerHTML = UI.spinner;
      try { let html = null; for (const u of ['felt-lab-offline.html', 'index.html']) { try { const r = await fetch(u); if (r.ok) { html = await r.text(); if (html.includes('PK_RAW')) break; } } catch (e) { } } if (!html) html = '<!DOCTYPE html>' + document.documentElement.outerHTML;
        const ok = await saveFile('felt-lab.html', html); n.textContent = ok ? 'Saved. On Android it lands in Downloads — open it with Chrome.' : 'Your browser blocked the download.'; } catch (e) { n.textContent = 'Download failed.'; }
    };
    const ib = $('[data-inst]', main); if (ib) ib.onclick = async () => { try { PWA.prompt.prompt(); const r = await PWA.prompt.userChoice; if (r && r.outcome === 'accepted') { PWA.installed = true; PWA.prompt = null; UI.toast('Installed'); } } catch (e) { } UI.render(); };
    $('[data-reset]', main).onclick = async () => { if (await UI.confirm('Erase all lessons, drills, hands and settings on this device?', 'Erase')) { UI.resetState(); UI.render(); } };
  });

  // ---------- installable app (served over https, top-level only) ----------
  const PWA = UI.PWA = { ok: false, prompt: null, installed: false, cached: false, persisted: false };
  try {
    const top = window.top === window;
    if (top && (location.protocol === 'https:' || location.hostname === 'localhost') && 'serviceWorker' in navigator && !IS_HOSTED) {
      PWA.ok = true;
      PWA.installed = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
      window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); PWA.prompt = e; });
      window.addEventListener('appinstalled', () => { PWA.installed = true; PWA.prompt = null; });
      navigator.serviceWorker.register('sw.js').then(reg => {
        navigator.serviceWorker.ready.then(() => { PWA.cached = true; });
        reg.addEventListener('updatefound', () => { const nw = reg.installing; if (!nw) return; nw.addEventListener('statechange', () => { if (nw.state === 'installed' && navigator.serviceWorker.controller) { const t = UI.h('<div class="toast" style="display:flex;gap:12px;align-items:center">A new version of Felt Lab is ready <button class="btn sm pri">Reload</button></div>'); t.querySelector('button').onclick = () => location.reload(); document.body.appendChild(t); setTimeout(() => t.remove(), 15000); } }); });
      }).catch(() => { });
      if (navigator.storage && navigator.storage.persist) navigator.storage.persisted().then(p => p || navigator.storage.persist()).then(p => { PWA.persisted = !!p; }).catch(() => { });
    }
  } catch (e) { }

  // ---------- boot ----------
  UI._hostTheme = document.documentElement.getAttribute('data-theme') || null;
  UI.applySettings();
  try { const mo = new MutationObserver(() => { const t = document.documentElement.getAttribute('data-theme'); if (UI.S().settings.theme === 'system' && t) UI._hostTheme = t; }); mo.observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] }); } catch (e) { }
  UI.render();
  setTimeout(initCloud, 0);
})();
</script>
</body></html>
