  X.L({ id: 'eg-intro', course: 'easygame', title: 'A game of information', mins: 7, sum: 'Poker rewards the player who notices and uses more information. The book\'s plan: a solid foundation first, advanced ideas second.',
    html: `${X.book('Introduction and "A Game of Information"')}
    ${X.goals(['The idea that runs through the whole book: profit comes from making fewer, smaller mistakes', 'What "information" means at a poker table', 'The vocabulary the book uses from here on'])}
    ${X.terms([['Fundamental Theorem of Poker', 'You gain when you play as you would if you could see your opponent\'s cards; your opponent gains when you don\'t. Equivalently: the player making fewer and smaller mistakes wins.'], ['"A-B-C" poker', 'A solid, straightforward strategy: good starting hands, betting for clear reasons, folding when beaten. Enough to beat weak players.'], ['Read', 'A conclusion about an opponent\'s tendencies, drawn from what you\'ve seen.']])}
    <h3>1. Why information wins</h3>
    <p>No-Limit Hold'em magnifies mistakes: one wrong call can cost a whole stack. The player who sees more of what is going on makes fewer of those mistakes.</p>
    ${X.t(['Level', 'What the player pays attention to'], [['Beginner', 'Their own two cards and the board'], ['Improving', '+ what their opponent\'s actions suggest about their hand'], ['Strong', '+ the opponent\'s whole range, player type, stack size, position, recent history and their own image']])}
    ${X.ex('the same river, three levels of thinking', ['You hold ' + h('AdQd') + ' on ' + h('Qs8c4h2d7s') + '. Your opponent bets the pot on the river.', '<b>Beginner:</b> "I have top pair with a good kicker. Call."', '<b>Improving:</b> "A pot-sized river bet usually means two pair or better. I might be behind."', '<b>Strong:</b> "This player has limped and min-raised all night — classic passive tells (Chapter 5). Passive players almost never bluff a pot-sized river. Against their range, top pair is behind far more often than the price allows. Fold."'], { result: 'Same cards, same board — the extra information changes the decision.' })}
    <h3>2. The book's plan</h3>
    <p>Part one builds an "A-B-C" foundation good enough to beat weak and average players. Only then does it add advanced ideas. Seidman warns against copying high-stakes moves without the foundation underneath.</p>
    <h3>3. Vocabulary used from here on</h3>
    ${X.t(['Term', 'Meaning'], [['Continuation bet (c-bet)', 'The preflop raiser bets the flop'], ['3-bet', 'A re-raise of the first raise'], ['In / out of position (IP / OOP)', 'Acting after / before your opponent after the flop'], ['Check-fold / check-call / check-raise', 'Check, then fold / call / raise when they bet'], ['Flat', 'Call a raise rather than re-raise'], ['Float', 'Call with a weak hand, planning to win later by betting'], ['Wet / dry board', 'Many / few possible draws'], ['Implied / reverse implied odds', 'Money won / lost on later streets (Maths course)']])}
    ${X.sum(['Profit comes from making fewer and smaller mistakes.', 'The more information you notice and use, the fewer mistakes you make.', 'Build the foundation before the fancy plays.'])}`,
    quiz: [{ q: 'Who wins in the long run, according to the Fundamental Theorem as the book frames it?', opts: ['The player who wins the most pots', 'The player who makes fewer and smaller mistakes', 'The most aggressive player', 'The luckiest player'], a: 1, why: 'Profit comes from making fewer and smaller mistakes than your opponents.' }, { q: 'In the river example, what made "fold" correct with top pair?', opts: ['The board was wet', 'The opponent\'s passive tells meant a big river bet was rarely a bluff', 'Top pair is always weak', 'The pot was small'], a: 1, why: 'Player-type information changed what the bet meant.' }] });

  X.L({ id: 'eg-reasons', course: 'easygame', title: 'The three reasons for betting', mins: 12, sum: 'Bet for value, as a bluff, or to collect dead money. "Protection" and "information" are side effects, not reasons.',
    html: `${X.book('Chapter One: The Reasons for Betting')}
    ${X.goals(['The three reasons to bet, defined precisely', 'A four-step routine to name the reason before every bet', 'Why "protection" and "information" are not reasons on their own'])}
    ${X.terms([['Value bet', 'A bet you make because <b>worse hands will call</b>. Being ahead isn\'t enough — worse hands must actually call.'], ['Bluff', 'A bet you make because <b>better hands will fold</b>. "I can\'t win otherwise" isn\'t enough — better hands must actually fold.'], ['Dead money', 'Money already in the pot that your opponent will give up if they fold. Betting to collect it is reason #3.'], ['Equity denial', 'Making a hand with some chance to win (say 25%) fold, so it can\'t outdraw you.']])}
    <h3>1. The three reasons</h3>
    <ol><li><b>Value</b> — worse hands call (or raise).</li><li><b>Bluff</b> — better hands fold.</li><li><b>Capitalising on dead money</b> — your opponent folds a hand that had some equity, and you collect a pot that was worth having. It works because folding gives up their share of the pot, and because the pot may be big enough that occasional folds pay for the bet.</li></ol>
    <p>People call too much far more often than they fold too much, so value betting is the biggest earner, especially at small stakes. Reason #3 rarely stands alone: it usually supports a value bet or bluff that would otherwise be slightly too thin. The bigger the pot, the thinner your value bets and bluffs can be.</p>
    <h3>2. The routine: name the reason before you bet</h3>
    <ol><li>List the <b>worse hands that would call</b>. If there are plenty → value.</li><li>List the <b>better hands that would fold</b>. If there are plenty → bluff.</li><li>If neither: would they <b>fold hands that have equity</b> against you, in a pot worth winning? → dead money.</li><li>If none of the three applies → <b>check</b>.</li></ol>
    ${X.ex('value', ['You raise ' + h('AsKc') + ' and a loose player calls. Flop ' + h('Kd8c3h') + '.', 'Worse hands that call: any king with a worse kicker, any 8, pocket pairs like 9-9 and 7-7. Plenty.', 'Better hands that fold: almost none — sets and two pair won\'t fold.'], { result: 'Bet for value.' })}
    ${X.ex('dead money', ['You open ' + h('KhJh') + ' on the button; a loose-passive big blind, who never folds a pair, calls. Flop ' + h('Qc6d3s') + '; they check.', 'Worse hands that call: hands without a pair fold to a bet, and every pair is ahead of your king-high. So no value.', 'Better hands that fold: every Q, 6 and 3 calls — this player never folds a pair. So no bluff.', 'But hands like A-T, 9-8 or 5-4 have real equity against your king-high, and they will fold. The pot (5.5bb) is worth taking.'], { result: 'Bet to collect the dead money — reason #3.' })}
    ${X.turn('You hold ' + h('QsQd') + ' on ' + h('Qh9h8c') + ' (top set). Is "protection against draws" the reason to bet?', '<ol><li>Worse hands that call: draws (any heart, J-T, T-7), two pair, 9-x, 8-x, Q-x. Plenty.</li><li>So the reason is <b>value</b>. Charging the draws is a pleasant side effect of a value bet, not the reason.</li></ol>')}
    <h3>3. Why "protection" and "information" aren't reasons</h3>
    <ul><li><b>Protection:</b> if a hand is worth protecting, it is usually worth value betting — and if worse hands won\'t call, the hands you\'d be "protecting" against are often favourites over you anyway.</li><li><b>Information:</b> betting "to see where I am" folds out the worse hands and gets called only by better ones. You play perfectly for your opponent.</li></ul>
    ${X.mistakes(['Betting "because I think I\'m ahead" without checking that worse hands call.', 'Bluffing "because I can\'t win otherwise" without checking that better hands fold.'])}
    ${X.sum(['Three reasons: value, bluff, dead money.', 'Routine: worse calls? better folds? equity folds in a pot worth taking? If none — check.', 'Protection and information are side effects at best.'])}`,
    quiz: [{ q: 'K♥J♥ on Q♣6♦3♠ against a loose-passive player who never folds a pair. The main reason to c-bet is…', opts: ['Value', 'Bluff', 'Collecting dead money', 'Information'], a: 2, why: 'No worse hands call and no pairs fold — you bet to fold out hands with equity and take the pot (section 2).' }, { q: 'Which is a genuine reason to bet?', opts: ['To find out where you stand', 'To protect a weak pair', 'To get called by worse hands', 'Because you might be best'], a: 2, why: 'Only value, bluff and dead money qualify.' }, { q: 'Betting K♠K♦ on A♠2♣2♦ "for information" mostly…', opts: ['Gets called by worse and folds better', 'Gets called by better and folds worse', 'Is a good value bet', 'Is a bluff'], a: 1, why: 'Worse hands fold and aces call — you\'ve isolated yourself against the hands that beat you.' }] });

  X.L({ id: 'eg-preflop', course: 'easygame', title: 'Preflop ranges and postflop equity', mins: 10, sum: 'Preflop isn\'t a vacuum: choose hands that keep equity after the flop — suited, high and connected.',
    html: `${X.book('Chapter Two: Preflop Hand Ranges and Postflop Equities')}
    ${X.goals(['Why opening a hand is a decision about the flop, not just about stealing blinds', 'The three qualities that keep equity after the flop', 'Why A-5 suited is often a better open than A-8 suited'])}
    ${X.terms([['Postflop equity', 'Your share of the pot once the flop is out.'], ['Playability', 'How easily a hand continues profitably after the flop: does it make strong hands and good draws?'], ['Backdoor draw', 'A draw needing both turn and river, such as three to a flush on the flop.']])}
    <h3>1. The trap: preflop "in a vacuum"</h3>
    <p>If the blinds folded often enough, raising every button hand would show a profit from the dead money alone. But they don't always fold. When they call, hands like 7-2 or K-2 offsuit reach the flop with little equity: checking gives up, and betting is just throwing chips in. The losses after the flop outweigh the steals.</p>
    <h3>2. Three qualities that keep equity</h3>
    <ol><li><b>Suited cards.</b> Not mainly for the flushes you make (rare), but for the equity they keep: flush draws and backdoor draws let you keep betting.</li><li><b>High cards.</b> When they pair, they usually make the best pair; when they miss, they still have overcard outs.</li><li><b>Connected cards.</b> They make straights that are hard for opponents to see coming.</li></ol>
    ${X.ex('suited vs offsuit on the same flop', ['You hold ' + h('As6s') + '. Flop ' + h('Qs9s2d') + '. You have the nut flush draw plus an ace overcard: about 12 outs.', 'Change one card: ' + h('As6c') + ' on the same flop. Only the three remaining aces help, and a pair of aces may not even be good.', 'Suppose the turn is the ' + h('4s') + ': the suited hand has made the nut flush; the offsuit hand still has only three outs.'], { scene: X.scene([['Suited', 'As6s'], ['Flop', 'Qs9s2d'], ['Offsuit', 'As6c']]), result: 'Being suited turns a give-up hand into one that can keep firing.' })}
    ${X.w('suited', 'Suited vs offsuit across 250 flops', ['It deals 250 random flops and works out each hand\'s equity against a big-blind defending range.', 'Each bar shows the share of flops where the hand has that much equity. Compare the "30%+" and "50%+" tiles.'])}
    ${X.ex('why A-5 suited can beat A-8 suited as an open', ['Both make top pair with an ace; the 8 kicker is a little better than the 5.', 'But A-5 also makes a straight (A-2-3-4-5, "the wheel") and has wheel draws on low boards. A-8 makes far fewer straights.', 'A slightly better kicker is worth less than a whole extra way to make a strong hand.'])}
    ${X.w('tool:charts', 'The baseline charts follow these principles', ['Look at the button: suited hands go much lower than offsuit ones.'])}
    ${X.sum(['An open is a commitment to playing a flop.', 'Prefer suited, high and connected cards.', 'Adding a way to make strong hands beats a slightly better kicker.'])}`,
    quiz: [{ q: 'Main reason suited hands are worth more after the flop?', opts: ['They make flushes often', 'They keep equity (draws and backdoors) on many flops and turns', 'Opponents fear them', 'They block aces'], a: 1, why: 'Flushes are rare; equity from draws is constant.' }, { q: 'Why is A-5 suited often a better open than A-8 suited?', opts: ['Better kicker', 'Its straight potential outweighs the small kicker difference', 'It\'s more disguised preflop', 'It isn\'t'], a: 1, why: 'A wheel straight is a whole extra way to make a strong hand.' }] });

  X.L({ id: 'eg-turn', course: 'easygame', title: 'Aggression and the turn', mins: 11, sum: 'Pot equity + fold equity = aggression. When to fire a second barrel, and when a check-raise works better.',
    html: `${X.book('Chapter Three: Aggression and the Turn')}
    ${X.goals(['The book\'s equation for when to keep betting', 'When a turn check-raise beats a second barrel', 'What drives fold equity, most important first'])}
    ${X.terms([['Pot equity', 'Your chance to win if the hand goes to showdown.'], ['Fold equity', 'The value from the chance your opponent folds.'], ['Barrel', 'A bet on a later street after betting the earlier one. A "second barrel" is the turn bet after a flop c-bet.'], ['Capped range', 'A range missing its strongest hands, because they would have raised earlier.']])}
    <h3>1. The equation</h3>
    ${X.f('Pot equity + fold equity = aggression', null, 'If the two together are enough, bet. A big draw needs little fold equity; a pure bluff needs a lot.')}
    ${X.ex('when a turn barrel works', ['You c-bet ' + h('AhKd') + ' on ' + h('9s7c3h') + ' and get called. Turn ' + h('Qd') + '.', 'Pot equity: any ace or king gives you top pair — 6 outs, about 12% on the river.', 'Fold equity: the queen is an overcard to their likely pairs (8-x, 7-x, small pairs), which now look worse.', 'Both are decent → fire the second barrel.'], { result: 'Turns that scare your opponent\'s pairs, while you keep outs, are the best turns to keep betting.' })}
    <h3>2. When a check-raise beats a second barrel</h3>
    <p>On some boards you do better by checking the turn and raising if they bet. Three conditions together:</p>
    <ol><li><b>Their range is unlikely to be strong.</b> On a wet flop, strong hands usually raise straight away, so a flat call is mostly draws, pairs and floats.</li><li><b>They will bet when you check.</b> Draws and floats bet to win the pot; weak pairs check behind.</li><li><b>You have real equity yourself</b>, in case they do hold something good.</li></ol>
    ${X.ex('a turn check-raise', ['You hold ' + h('Ac5c') + ' and c-bet ' + h('8c7c4h') + '. Your opponent calls.', 'Turn ' + h('2d') + '. Their call on a wet board rarely means a set (sets would often raise) — their range is capped.', 'If you check, their draws and floats will bet.', 'You have the nut flush draw plus two straight draws: a 6 makes 4-5-6-7-8 and a 3 makes A-2-3-4-5. That is 9 clubs + 3 non-club sixes + 3 non-club threes = 15 outs — lots of equity if called.'], { result: 'Check, then raise their bet.' })}
    <p>On <b>dry</b> boards the opposite holds: a flat call more often hides a slow-played monster, so betting and folding to a raise is better.</p>
    <h3>3. What drives fold equity (most important first)</h3>
    <ol><li><b>Player type</b> — by far the biggest factor. Bad players, passive or aggressive, don\'t fold.</li><li><b>Board texture</b> — overcards increase fold equity; low and coordinated cards reduce it.</li><li><b>Number of players</b> — more opponents, less fold equity.</li><li><b>Your image</b> — if you look loose, you get fewer folds.</li></ol>
    ${X.turn('You c-bet a dry K♣7♦2♠ flop with Q♥J♥ and a calling station calls. Turn 3♣. Should you barrel?', '<ol><li>Pot equity: about 6 outs (Q or J) — weak.</li><li>Fold equity: against a calling station, almost none (factor #1).</li><li>Neither is enough → <b>check</b> and give up unless you improve.</li></ol>')}
    ${X.sum(['Keep betting when pot equity + fold equity add up.', 'Check-raise the turn when their range is capped, they bet when checked to, and you have equity.', 'Player type drives fold equity more than anything else.'])}`,
    quiz: [{ q: 'The most important factor in fold equity is…', opts: ['Bet size', 'Player type', 'Your image', 'Stack depth'], a: 1, why: 'Bad players simply don\'t fold much.' }, { q: 'You c-bet A♣5♣ on 8♣7♣4♥ and get called; the turn is a blank. Why consider a check-raise?', opts: ['Their range is capped and their draws and floats will bet when you check', 'You want to slowplay', 'Sets are likely', 'You have no equity'], a: 0, why: 'All three conditions from section 2 hold.' }] });

  X.L({ id: 'eg-sizing', course: 'easygame', title: 'Bet sizing and thin value', mins: 10, sum: 'For value, bet bigger. When your value is thin, bet smaller.',
    html: `${X.book('Chapter Four: Bet Sizing and Thin Value')}
    ${X.goals(['Why most opponents call bigger bets almost as often as smaller ones', 'What thin value is', 'Why thin value bets should be small'])}
    ${X.terms([['Thin value', 'A value bet where many of the hands that call beat you and only some worse hands call. It just about profits.'], ['Sizing', 'How big you bet, usually as a share of the pot.']])}
    <h3>1. Bet bigger for value</h3>
    <p>The old idea: smaller bets get called more, so keep them small. The book's observation: most players decide whether to call based mainly on their cards and the board; the bet size matters much less. If someone calls 35 into 50, they will usually call 45 too. The extra 10 you collect on every call outweighs the few extra folds.</p>
    ${X.ex('why bigger wins more', ['You value bet the river. Option A: 35bb and they call 70% of the time. Option B: 45bb and they call 65% of the time.', 'A: 0.70 × 35 = <b>24.5bb</b> collected on average. B: 0.65 × 45 = <b>29.3bb</b>.'], { result: 'The bigger bet makes more, as long as calls don\'t drop off sharply.' })}
    <h3>2. Thin value: bet smaller</h3>
    <p>When your hand is only just good enough to bet — many calling hands beat you and only the weakest worse hands call — a big bet folds exactly the worse hands you wanted and gets called by the better ones. So the thinner the value, the smaller the bet; sometimes as little as a fifth of the pot.</p>
    ${X.w('thinvalue', 'Find the best river size for three hands', ['Choose your hand. The curve shows how much each bet size gains compared with checking.', 'Notice the best size shrinks as your hand gets weaker — and for the weakest hand, checking may be best.'])}
    ${X.note('Against good players', 'A good opponent may spot a small thin bet and raise it as a bluff. Whether to call that raise depends on how aggressive they are.')}
    ${X.turn('You have the nuts on the river against a calling station. Small or big bet?', '<b>Big.</b> Your value isn\'t thin at all, and stations call almost regardless of size. Every extra chip you bet is collected.')}
    ${X.sum(['Strong value: bet bigger — calls depend mostly on cards and board.', 'Thin value: bet smaller to keep worse hands calling.'])}`,
    quiz: [{ q: 'With a strong value hand against a typical opponent, size should usually be…', opts: ['Small to get called', 'Larger — calls depend mostly on cards and board', 'Always exactly pot', 'Minimal'], a: 1, why: 'The extra value from bigger calls outweighs the few extra folds.' }, { q: 'The thinner your value bet, the…', opts: ['Bigger it should be', 'Smaller it should be', 'Less often you check', 'More you bluff'], a: 1, why: 'You need the weakest worse hands to keep calling.' }] });

  X.L({ id: 'eg-players', course: 'easygame', title: 'Player identification and hand reading', mins: 11, sum: 'Is this player aggressive or passive? Spot it without any statistics, then use a plan for each type.',
    html: `${X.book('Chapter Five: Player Identification and Basic Handreading')}
    ${X.goals(['The single question that starts all hand reading', 'Five tells visible without tracking software', 'The plan against each of the three player types'])}
    ${X.terms([['Passive player', 'Mostly checks and calls; bets and raises mainly with strong hands.'], ['Aggressive player', 'Bets and raises often, including with weak hands and draws.'], ['Passive-bad / aggressive-bad / aggressive-good', 'The three types the book uses. ("Good" passive players are rare enough to ignore.)']])}
    <h3>1. The first question: aggressive or passive?</h3>
    <p>Against a passive player hand reading is easy: a raise means a very strong hand. Against an aggressive player it\'s hard: a raise could be anything. So identifying the type comes first.</p>
    <h3>2. Five visible tells</h3>
    ${X.t(['Tell', 'Suggests'], [['Sits with much less than a full stack (not a professional short-stacker)', 'Passive'], ['Limps (calls the big blind) instead of raising first in', 'Passive — and usually across their whole game'], ['Min-raises', 'Passive, finally holding a good hand'], ['Full stack on many tables at once', 'Aggressive regular'], ['3-bets often and consistently', 'Aggressive; rare, oddly sized 3-bets suggest passive']])}
    ${X.w('playertypes', 'The three types and the plan against each')}
    ${X.ex('using the type', ['A player with a 40bb stack limps under the gun. You raise with ' + h('AhKh') + ' and they call.', 'Flop ' + h('Kd9c4s') + '. You bet; they call. Turn ' + h('2h') + '. You bet; they <b>raise</b>.', 'Tells: short stack + limp = passive.', 'A passive player raising the turn almost always has two pair or a set here.'], { result: 'Fold top pair, top kicker. "Bad" is not a read; "passive" is.' })}
    ${X.key('Practise it', 'In Play, switch off "Show opponents\' player types", play about 50 hands, then tap <b>Identify players</b> and check your reads.')}
    ${X.sum(['Start every read with "aggressive or passive?".', 'Limps, min-raises and short stacks mean passive; many tables and frequent 3-bets mean aggressive.', 'Passive-bad: value bet, fold to raises. Aggressive-bad: value bet, call down lighter. Aggressive-good: play solid.'])}`,
    quiz: [{ q: 'A player limps, min-raises and sits with a short stack at one table. Most likely…', opts: ['Aggressive-good', 'Passive-bad', 'Aggressive-bad', 'Professional short stack'], a: 1, why: 'Classic passive indicators (section 2).' }, { q: 'Plan against an aggressive-bad player:', opts: ['Bluff often', 'Value bet and make bigger calls', 'Avoid him', 'Fold to every raise'], a: 1, why: 'He calls a lot (so don\'t bluff) and his bets often mean nothing (so call down lighter).' }, { q: 'Plan against a passive-bad player:', opts: ['Value bet; fold to his raises', 'Bluff him', 'Call his raises light', 'Slowplay'], a: 0, why: 'He calls too much and raises only with very strong hands.' }] });

  X.L({ id: 'eg-isolation', course: 'easygame', title: 'Isolation theory', mins: 9, sum: 'Raise to play pots against the player you want. Skill edge matters most, then position, then cards.',
    html: `${X.book('Chapter Six: Isolation Theory')}
    ${X.goals(['What an isolation raise is', 'The three advantages behind it, ranked', 'Why you raise the button to play pots, not just to steal'])}
    ${X.terms([['Isolation raise', 'A raise, usually over a limper, to play the pot one-on-one against that player.'], ['Card advantage', 'Your starting hand is better than theirs on average.'], ['Positional advantage', 'You act after them on every street after the flop.'], ['Skill advantage', 'You make fewer mistakes and can push them into more.']])}
    <h3>1. The three advantages, most important first</h3>
    <ol><li><b>Skill.</b> By far the biggest. Deep stacks multiply it: more money behind means more room for their mistakes.</li><li><b>Position.</b> Acting last makes value betting, bluffing, pot control and reading all easier.</li><li><b>Cards.</b> A weak player plays hands like J-6, so your J-T, Q-J and A-J dominate them. Raise too wide and you lose this edge.</li></ol>
    ${X.ex('choosing an isolation range', ['A passive-bad player limps from the cutoff. You are on the button.', 'Skill: large edge. Position: you\'ll act last. Both favour a wide raise.', 'Cards: widen with hands that keep postflop equity — high cards and suited hands (Q-7 suited before 7-5 offsuit).'], { result: 'Raise a wide range — perhaps 35–40% of hands — and size up a little (about 1bb extra per limper).' })}
    ${X.w('isolation', 'Isolation range by skill edge and position', ['Move the skill slider and change position; the grid shows a range that widens with your edge and narrows out of position.'])}
    ${X.key('You raise the button to play pots', 'Steals are a bonus. The real profit comes from playing flops in position against the blinds.')}
    ${X.turn('A good regular limps (a trap?) and you\'re in the small blind with K-9 offsuit. Isolate?', 'Probably not: no skill edge (good player), no position (you\'re out of position), and only a modest card edge. All three advantages point the wrong way — fold or check if you\'re the big blind.')}
    ${X.sum(['Isolation = raising to play heads-up against a weaker player.', 'Skill > position > cards.', 'Widen with hands that keep equity after the flop.'])}`,
    quiz: [{ q: 'Rank the isolation advantages from most to least important.', opts: ['Cards, position, skill', 'Skill, position, cards', 'Position, cards, skill', 'Skill, cards, position'], a: 1, why: 'Skill edge is by far the most important, then position, then cards.' }, { q: 'When could raising a weak hand like K-4 suited under the gun be right?', opts: ['Never', 'When very weak players are in the blinds to play against', 'When the table is all regulars', 'When you\'re short-stacked'], a: 1, why: 'A big skill edge over the players you\'ll face can outweigh a weak hand and poor position.' }] });

  X.L({ id: 'eg-dynamics', course: 'easygame', title: 'Table dynamics', mins: 8, sum: 'Who sits where, with what stack, changes the right play — before and after the flop.',
    html: `${X.book('Chapter Seven: Table Dynamics')}
    ${X.goals(['The three ingredients of table dynamics', 'Why you sometimes call rather than 3-bet to keep a weak player in', 'How short stacks change which hands make money'])}
    ${X.terms([['Table dynamics', 'How the mix of player types, stack sizes and seats changes your best play.'], ['Short stack', 'A stack well under 100bb.']])}
    <h3>1. The three ingredients</h3>
    <ul><li><b>Player types</b> — an aggressive player on your left means tighten up; a weak player on your right means loosen up.</li><li><b>Stack sizes</b> — short stacks behind you who shove over raises mean tighten up.</li><li><b>Positions</b> — who acts after whom.</li></ul>
    <h3>2. Stack sizes change hand values</h3>
    ${X.t(['Hands that lose value when stacks are short', 'Hands that gain value'], [['Small pairs and suited connectors (they rely on implied odds)', 'Big offsuit cards like K-J and A-T (fewer chips at risk from reverse implied odds)']])}
    <h3>3. Keep the mistake-maker in the pot</h3>
    ${X.ex('call instead of 3-bet', ['A weak player limps. A good regular raises. You are in the big blind with ' + h('QsJs') + '.', 'If you 3-bet, the weak player folds and you\'re left in a big pot, out of position, against the one player who plays well.', 'If you call, the weak player usually calls too — and he makes the most mistakes.'], { result: 'Call. Don\'t isolate yourself against the best player.' })}
    ${X.ex('lead into the field', ['A weak player and a regular are in the pot with you. You flop top pair.', 'If you check to the preflop raiser, the regular bets a strong range and the weak player folds weak hands.', 'If you lead (bet first), the weak player calls with worse hands.', 'If the regular raises your lead in a multiway pot, he\'s rarely bluffing — fold.'], { result: 'Leading can extract more from the weak player.' })}
    ${X.sum(['Read the table: types, stacks, seats.', 'Short stacks reduce implied-odds hands and help big offsuit cards.', 'Make decisions that keep the weakest player in the pot.'])}`,
    quiz: [{ q: 'A fish limps, a regular raises, you have Q♠J♠ in the big blind. Easy Game prefers…', opts: ['3-bet to isolate', 'Call to keep the fish in', 'Fold', 'Shove'], a: 1, why: 'Don\'t isolate yourself against the player making the fewest mistakes.' }, { q: 'Many short stacks at the table make which hands go down in value?', opts: ['K-J and A-T', 'Small pairs and suited connectors', 'Aces', 'None'], a: 1, why: 'They rely on implied odds, which short stacks remove.' }] });

  X.L({ id: 'eg-raisesize', course: 'easygame', title: 'Creative preflop raise sizes', mins: 7, sum: 'Size your opens by who is behind you, not by your cards.',
    html: `${X.book('Chapter Eight: Creative Preflop Raise Sizes')}
    ${X.goals(['Why one fixed open size leaves money on the table', 'When to raise smaller and when bigger', 'Why this doesn\'t give away your hand'])}
    ${X.terms([['Open size', 'How big your first raise is, in big blinds (2.5bb) or as a multiple ("3x" = 3bb).'], ['Professional short stack', 'A skilled player sitting with a short stack on purpose, who re-shoves often.']])}
    <h3>1. Three kinds of size</h3>
    ${X.t(['Size', 'Use against', 'Why'], [['Smaller (2–2.5x)', 'Players who play back: aggressive 3-bettors, professional short stacks', 'Less dead money means their re-raises win less'], ['Standard (2.5–3x)', 'Mixed or tight-passive blinds', 'A sound default'], ['Bigger (3.5–5x or more)', 'Very weak players who call too much preflop and play fit-or-fold afterwards', 'They call anyway, so they pay more with worse hands']])}
    <h3>2. What decides it</h3>
    <ol><li><b>Skill edge</b> — bigger when you\'re much better.</li><li><b>Position</b> — smaller in position: keep more money behind to use your advantage later.</li><li><b>Stack size</b> — shorter stacks, smaller raises.</li></ol>
    ${X.ex('choosing a size', ['You open the button. The small blind is a calling-station fish; the big blind is a tight-passive regular.', 'No one behind plays back aggressively; the fish will call almost any size.'], { result: 'Raise bigger, around 3.5–4x, to make the fish pay more with his weak hands.' })}
    ${X.w('raisesize', 'Choose a size for the players behind you', ['Pick who is in each blind. The suggestion and the reason update.'])}
    ${X.key('It doesn\'t leak information', 'You choose the size from public information — who sits in which seat with what stack — never from your cards.')}
    ${X.sum(['Smaller against players who fight back; bigger against players who call too much.', 'The size depends on the table, not your hand.'])}`,
    quiz: [{ q: 'Why doesn\'t varying your open size by table make-up leak information?', opts: ['Opponents don\'t notice', 'It depends only on public information', 'Sizes are random', 'It does leak'], a: 1, why: 'Your cards never enter the decision.' }, { q: 'Good regulars who 3-bet light sit in the blinds. Your button open should be…', opts: ['Bigger', 'Smaller', 'Always pot', 'Always 3x'], a: 1, why: 'Players who play back profit from dead money; shrink it.' }] });

  X.L({ id: 'eg-value-streets', course: 'easygame', title: 'Value streets and pot management', mins: 10, sum: 'Decide how many streets of value you want, plan sizes so the stacks go in by the river — and re-plan when the hand changes.',
    html: `${X.book('Chapter Nine: Value Streets and Pot Management')}
    ${X.goals(['Static and dynamic value', 'Pot management: making the pot as big or small as your hand wants', 'How to plan bet sizes so the river shove is not an overbet'])}
    ${X.terms([['Street of value', 'One bet that gets called by worse.'], ['Static value', 'How many streets of value you want right now: 0, 1, 2, 3, or "3+" (stacks).'], ['Dynamic value', 'How that number changes as new cards and actions arrive.'], ['Pot management', 'The book\'s term: steering the pot to the size your hand wants — bigger or smaller.'], ['Overbet', 'A bet larger than the pot.']])}
    <h3>1. Static and dynamic value</h3>
    ${X.ex('dynamic value', ['You 5-bet ' + h('AcAs') + ' preflop and get called. You want stacks (3+).', 'Flop ' + h('KhQhJh') + '. Any heart, any A-T, and many two-pairs and sets now beat you or have huge equity.'], { result: 'Your desired value drops to zero streets — check, and often fold to big action.' })}
    <h3>2. Planning the stacks in</h3>
    <p>When you do want stacks, plan your sizes so that the river bet is about the size of the pot or smaller. Too-small early bets leave a big stack that only an overbet can get in — and fewer worse hands call an overbet.</p>
    ${X.ex('setting up the river', ['Blinds $5/$10, $1,000 stacks. You raise ' + h('QdQh') + ' to $40 and the button calls: pot $95.', 'Flop ' + h('Qc8s7s') + '. You bet $80, called. Pot $255, $880 behind.', 'Turn: if you bet $120, the river pot is $495 with $760 behind — a shove would be an overbet of about 1.5× pot.', 'If you bet $230 instead: pot $715, $650 behind — a river shove is less than the pot.'], { result: 'Bet $230 on the turn to set up a clean river shove.' })}
    ${X.w('potmgmt', 'Set up the river', ['Slide the turn bet. The tiles show the river pot, the stack behind, and the river shove as a share of the pot.'])}
    ${X.w('tool:sizing', 'Sizing planner', ['"Get the stacks in by the river": enter the pot and stack; it gives the same-size bet for each street (geometric sizing).', 'Below that, try your own percentages and see what is left behind.', 'The chart on the right belongs to the Advanced course — skip it for now.'])}
    ${X.sum(['Static value: how many streets now. Dynamic value: re-check every street.', 'Plan sizes so the river shove is pot-sized or less.'])}`,
    quiz: [{ q: 'Pot $255 on the turn, $880 behind. Which bet leaves a sub-pot river shove?', opts: ['$120', '$170', '$230', '$80'], a: 2, why: 'After $230 is called: pot $715, $650 behind (worked above).' }, { q: 'You 5-bet aces and the flop is K♥Q♥J♥. Your desired value becomes…', opts: ['3+ streets', 'Zero streets', 'One street', 'Unchanged'], a: 1, why: 'Dynamic value: re-evaluate every street.' }] });
})();
