/*
VOICE: a focused card-room training studio — calm, exact, a little tactile.
IDEA: the app behaves like a poker room: a felt table you sit at, a dealer's rail of sections, cards as real card stock.
PICTURE: a felt oval with real-looking cards and chips; equity and range pictures drawn like dealer tools.
COLOUR and TYPE: felt green dominates, ivory card stock supports, card-suit red is the sharp accent. Archivo (wide for titles).
LAYOUT: left rail on tablets/desktop, bottom tabs on phones; content in calm columns up to 1240px.
*/
:root{color-scheme:light;--bg:#f7f4ec;--surf:#ffffff;--surf2:#f0ebdf;--surf3:#e7e0d0;--ink:#0f1d17;--ink2:#3d4f46;--muted:#6a7a71;--line:#ddd5c4;--felt:#0d5a3b;--felt2:#0a4730;--feltink:#eaf6ef;--red:#c62f2c;--red2:#fbe5e3;--good:#0b7d3e;--goodbg:#e2f4e8;--bad:#c62f2c;--badbg:#fbe7e5;--warn:#9a6400;--warnbg:#fff2d6;--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s7:#6250d6;--raise:#c62f2c;--call:#2f9e5f;--fold:#d8d1c1;--tb:#7b2fbf;--cardface:#fbf8f1;--cardink:#14201a;--cardred:#c62f2c;--cardblue:#1e5fbf;--cardgreen:#16804a;--r:14px;--r2:10px;--shadow:0 1px 2px rgb(0 0 0/.06),0 6px 18px rgb(0 0 0/.07);--font:'Archivo',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
@media (prefers-color-scheme:dark){:root:where(:not([data-theme=light])){color-scheme:dark;--bg:#07110c;--surf:#0e1c15;--surf2:#13261c;--surf3:#1a3226;--ink:#eaf2ec;--ink2:#bcccc3;--muted:#8ea398;--line:#22392d;--felt:#0e6744;--felt2:#0b5238;--red:#ef5f5a;--red2:#3a1716;--good:#3fcf7d;--goodbg:#0f2f1d;--bad:#ff7a72;--badbg:#341615;--warn:#f0b54a;--warnbg:#33270e;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s7:#9085e9;--raise:#e0504b;--call:#2f9e5f;--fold:#2a3e33;--tb:#9d5ce0}}
:root[data-theme=dark]{color-scheme:dark;--bg:#07110c;--surf:#0e1c15;--surf2:#13261c;--surf3:#1a3226;--ink:#eaf2ec;--ink2:#bcccc3;--muted:#8ea398;--line:#22392d;--felt:#0e6744;--felt2:#0b5238;--red:#ef5f5a;--red2:#3a1716;--good:#3fcf7d;--goodbg:#0f2f1d;--bad:#ff7a72;--badbg:#341615;--warn:#f0b54a;--warnbg:#33270e;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s7:#9085e9;--raise:#e0504b;--call:#2f9e5f;--fold:#2a3e33;--tb:#9d5ce0}
:root[data-theme=light]{color-scheme:light}

*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:72px;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--font);overflow-x:clip;-webkit-tap-highlight-color:transparent}
h1,h2,h3,h4{font-stretch:112%;line-height:1.08;margin:0 0 .4em;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(30px,4.2vw,46px);font-weight:800}h2{font-size:clamp(22px,2.6vw,28px);font-weight:760}h3{font-size:19px;font-weight:720}h4{font-size:16px;font-weight:700}
p{margin:0 0 .9em}a{color:var(--felt)}small,.small{font-size:13.5px}.muted{color:var(--muted)}.ink2{color:var(--ink2)}
.num,td.n,th.n{font-variant-numeric:tabular-nums}
code{font-size:.92em;background:var(--surf2);padding:1px 5px;border-radius:5px;overflow-wrap:anywhere}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--s1);outline-offset:2px}
/* ---------- shell ---------- */
#app{display:grid;grid-template-columns:88px minmax(0,1fr);min-height:100vh;min-height:100dvh}
.rail{position:sticky;top:0;height:100vh;height:100dvh;background:var(--felt2);color:var(--feltink);display:flex;flex-direction:column;align-items:stretch;padding:12px 8px;gap:4px;z-index:20;
 background-image:radial-gradient(circle at 30% 10%,rgb(255 255 255/.08),transparent 60%)}
.rail .logo{display:grid;place-items:center;height:56px;margin-bottom:8px}
.rail a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 4px;border-radius:12px;color:inherit;text-decoration:none;font-size:12px;font-weight:600;opacity:.82;min-height:58px;justify-content:center}
.rail a svg{width:24px;height:24px}
.rail a:hover{opacity:1;background:rgb(255 255 255/.07)}
.rail a.on{opacity:1;background:var(--feltink);color:var(--felt2)}
.rail .sp{flex:1}
main{padding:0 0 90px;min-height:100vh}
.band{padding:clamp(20px,3.2vw,44px) max(4vw,16px)}
.wrap{max-width:1240px;margin:0 auto}
.narrow{max-width:820px;margin:0 auto}
@media(max-width:760px){#app{grid-template-columns:minmax(0,1fr)}.rail{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;flex-direction:row;padding:6px 6px calc(6px + env(safe-area-inset-bottom));gap:2px;overflow-x:auto}
 .rail .logo,.rail .sp{display:none}.rail a{flex:1 0 64px;min-height:52px;font-size:11px;padding:6px 2px}}
.topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.topbar .grow{flex:1}
.crumb{font-size:14px;color:var(--muted);text-decoration:none;display:inline-flex;align-items:center;gap:6px;min-height:44px}
.crumb:hover{color:var(--ink)}
/* ---------- surfaces ---------- */
.card{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
.card.felt{background:var(--felt);color:var(--feltink);border-color:transparent;background-image:radial-gradient(ellipse at 50% 0%,rgb(255 255 255/.12),transparent 70%)}
.card.felt .muted{color:#b9d8c7}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.gauto{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
@media(max-width:900px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:600px){.g2,.g3,.g4{grid-template-columns:minmax(0,1fr)}}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row.tight{gap:6px}.row.between{justify-content:space-between}.col{display:flex;flex-direction:column;gap:10px}
.sep{height:1px;background:var(--line);margin:16px 0}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:13px;font-weight:600;background:var(--surf2);color:var(--ink2);white-space:nowrap}
.pill.g{background:var(--goodbg);color:var(--good)}.pill.r{background:var(--badbg);color:var(--bad)}.pill.w{background:var(--warnbg);color:var(--warn)}.pill.f{background:var(--felt);color:var(--feltink)}
.stat{display:flex;flex-direction:column;gap:2px}.stat b{font-size:28px;font-stretch:110%;font-variant-numeric:tabular-nums;line-height:1.1}.stat span{font-size:13.5px;color:var(--muted)}
.big{font-size:clamp(36px,6vw,60px);font-weight:800;font-stretch:115%;line-height:1;font-variant-numeric:tabular-nums}
/* ---------- buttons & inputs ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--surf);color:var(--ink);font-weight:650;cursor:pointer;text-decoration:none;white-space:nowrap;transition:transform .08s,background .15s}
.btn:hover{background:var(--surf2)}.btn:active{transform:scale(.97)}
.btn.pri{background:var(--felt);border-color:var(--felt);color:var(--feltink)}.btn.pri:hover{background:var(--felt2)}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn.ghost{background:transparent;border-color:transparent}.btn.ghost:hover{background:var(--surf2)}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px;border-radius:10px}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg{display:inline-flex;background:var(--surf2);border-radius:12px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;min-height:38px;padding:0 13px;border-radius:9px;font-weight:600;font-size:14.5px;cursor:pointer;color:var(--ink2)}
.seg button.on{background:var(--surf);color:var(--ink);box-shadow:0 1px 3px rgb(0 0 0/.12)}
input[type=text],input[type=number],input[type=search],select,textarea{min-height:44px;border:1px solid var(--line);border-radius:10px;background:var(--surf);padding:8px 12px;font-size:16px;width:100%}
textarea{min-height:90px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:5px;font-size:14px;font-weight:600;color:var(--ink2)}
input[type=range]{width:100%;accent-color:var(--felt);height:32px}
.check{display:flex;gap:10px;align-items:center;min-height:44px;cursor:pointer;font-weight:550}
.check input{width:22px;height:22px;accent-color:var(--felt)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:15px}.kv dt{color:var(--muted)}.kv dd{margin:0;font-weight:650;font-variant-numeric:tabular-nums}
/* ---------- playing cards ---------- */
.pc{--w:46px;width:var(--w);height:calc(var(--w)*1.4);border-radius:calc(var(--w)*.12);background:var(--cardface);color:var(--cardink);display:inline-flex;flex-direction:column;align-items:center;justify-content:center;
 font-weight:800;box-shadow:0 1px 0 rgb(0 0 0/.25),0 3px 8px rgb(0 0 0/.18);border:1px solid rgb(0 0 0/.08);position:relative;flex:none;line-height:1;user-select:none}
.pc .r{font-size:calc(var(--w)*.5);font-stretch:100%;letter-spacing:-.02em}.pc .s{font-size:calc(var(--w)*.46);margin-top:calc(var(--w)*.02)}
.pc.h,.pc.d{color:var(--cardred)}
.four .pc.d{color:var(--cardblue)}.four .pc.c{color:var(--cardgreen)}
.pc.back{background:repeating-linear-gradient(45deg,#8b1f1d 0 6px,#a42825 6px 12px);border:3px solid #fbf8f1}
.pc.empty{background:transparent;border:2px dashed var(--line);box-shadow:none;color:var(--muted)}
.pc.sm{--w:34px}.pc.lg{--w:62px}.pc.xl{--w:78px}.pc.xs{--w:26px}
.pc.dim{opacity:.35}.pc.hl{outline:3px solid var(--s4);outline-offset:1px}
.cards{display:inline-flex;gap:5px;flex-wrap:wrap;align-items:center}
.cards.tight{gap:3px}
.pc.deal{animation:deal .32s cubic-bezier(.2,.8,.3,1.2) both}
@keyframes deal{from{transform:translateY(-18px) rotate(-6deg) scale(.85);opacity:0}to{transform:none;opacity:1}}
@media(prefers-reduced-motion:reduce){.pc.deal{animation:none}*{transition:none!important}}
/* card picker */
.picker{display:grid;grid-template-columns:repeat(13,minmax(0,1fr));gap:4px}
.picker button{aspect-ratio:.72;border-radius:7px;border:1px solid var(--line);background:var(--cardface);color:var(--cardink);font-weight:800;font-size:clamp(11px,1.6vw,15px);cursor:pointer;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05}
.picker button.h,.picker button.d{color:var(--cardred)}.four .picker button.d{color:var(--cardblue)}.four .picker button.c{color:var(--cardgreen)}
.picker button.used{opacity:.18;pointer-events:none}.picker button.sel{outline:3px solid var(--s1);outline-offset:1px}
.slots{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.slot{cursor:pointer;border-radius:8px;padding:2px}.slot.active{outline:3px solid var(--s1)}
/* ---------- range grid ---------- */
.rgrid{display:grid;grid-template-columns:repeat(13,minmax(0,1fr));gap:2px;user-select:none;touch-action:none;width:100%;max-width:560px}
.rgrid div{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:clamp(8.5px,1.3vw,12.5px);font-weight:700;border-radius:4px;background:var(--surf2);color:var(--ink2);position:relative;overflow:hidden;cursor:pointer;letter-spacing:-.02em}
.rgrid div i{position:absolute;left:0;bottom:0;top:0;background:var(--felt);z-index:0}
.rgrid div span{position:relative;z-index:1}
.rgrid div.on{color:#fff}.rgrid div.on.part{color:var(--ink)}
.rgrid.static div{cursor:default}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13.5px;color:var(--ink2)}.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
/* ---------- poker table ---------- */
.playgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;align-items:start}
@media(min-width:1100px){.playgrid{grid-template-columns:minmax(0,1fr) 300px}.playgrid .side .hud{grid-template-columns:1fr 1fr}}
.tablewrap{position:relative;width:100%;max-width:min(980px,calc((100dvh - 300px)*1.75));min-width:min(100%,520px);margin:34px auto 50px;aspect-ratio:1.75/1}
@media(max-width:700px){.tablewrap{aspect-ratio:1/1.15}}
.felt-oval{position:absolute;inset:9% 6%;border-radius:999px;background:radial-gradient(ellipse at 50% 35%,#16805a 0%,#0d5a3b 55%,#08402a 100%);box-shadow:inset 0 0 0 10px #3a2614,inset 0 0 0 13px #5b3a1f,inset 0 0 40px rgb(0 0 0/.55),0 18px 40px rgb(0 0 0/.3)}
@media(max-width:700px){.felt-oval{inset:7% 9%;border-radius:46%/36%}}
.felt-oval .mark{position:absolute;left:50%;top:62%;transform:translate(-50%,-50%);font-weight:800;font-stretch:125%;letter-spacing:.2em;color:rgb(255 255 255/.08);font-size:clamp(14px,2.4vw,26px);white-space:nowrap}
.center{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:8px;z-index:2}
.potlbl{background:rgb(0 0 0/.35);color:#fff;padding:4px 12px;border-radius:999px;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.seat{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:3px;z-index:3;width:min(132px,24%)}
.seat .cards{flex-wrap:nowrap}.many .seat{width:min(112px,19%)}.many .seat .box{min-width:0;padding:4px 6px}.many .seat .nm{font-size:12.5px}
.seat .box{background:var(--surf);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:5px 9px;min-width:96px;text-align:center;box-shadow:var(--shadow);width:100%}
.seat .nm{font-weight:700;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seat .stk{font-size:13px;font-variant-numeric:tabular-nums;color:var(--ink2)}
.seat .tag{font-size:11px;font-weight:700;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seat.act .box{outline:3px solid var(--s4);}
.seat.fold{opacity:.45}.seat.me .box{border-color:var(--felt);border-width:2px}
.seat .btnd{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:50%;background:#fff;color:#111;font-size:11px;font-weight:800;display:grid;place-items:center;box-shadow:0 1px 3px rgb(0 0 0/.4);z-index:4}
.betchip{position:absolute;transform:translate(-50%,-50%);z-index:2;white-space:nowrap;background:#fff;color:#111;border-radius:999px;font-size:12.5px;font-weight:800;padding:2px 9px 2px 22px;box-shadow:0 1px 3px rgb(0 0 0/.35);font-variant-numeric:tabular-nums}
.betchip::before{content:'';position:absolute;left:4px;top:50%;width:14px;height:14px;margin-top:-7px;border-radius:50%;background:var(--red);box-shadow:inset 0 0 0 2px #fff,inset 0 0 0 4px var(--red)}
.seat .lastact{font-size:11.5px;font-weight:800;padding:1px 8px;border-radius:6px;background:var(--ink);color:var(--bg);white-space:nowrap}
.seat .box .lastact{position:absolute;top:-9px;left:-6px;z-index:4}
.actionbar{display:flex;flex-direction:column;gap:10px;max-width:980px;margin:12px auto 0}
.actionbar .main{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.actionbar .main .btn{min-height:58px;font-size:17px}
.btn.fold{background:var(--surf);}.btn.call{background:var(--call);border-color:var(--call);color:#fff}.btn.raise{background:var(--raise);border-color:var(--raise);color:#fff}
.sizes{display:flex;gap:6px;flex-wrap:wrap}.sizes .btn{flex:1 0 64px}
.hud{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px}
.hud .h{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.hud .h b{display:block;font-size:20px;font-variant-numeric:tabular-nums;font-stretch:108%}.hud .h span{font-size:12.5px;color:var(--muted)}
/* ---------- bars & meters ---------- */
.meter{height:12px;border-radius:999px;background:var(--surf3);overflow:hidden;position:relative}
.meter>i{display:block;height:100%;border-radius:999px;background:var(--felt)}
.eqbar{display:flex;height:30px;border-radius:10px;overflow:hidden;gap:2px;font-size:13px;font-weight:700;color:#fff}
.eqbar>div{display:flex;align-items:center;justify-content:center;white-space:nowrap;overflow:hidden;min-width:0}
.hbar{display:grid;grid-template-columns:minmax(80px,auto) minmax(0,1fr) auto;gap:8px 10px;align-items:center;font-size:14px}
.hbar .b{height:14px;border-radius:0 4px 4px 0;background:var(--s1)}
.ring{--p:0;width:86px;height:86px;border-radius:50%;background:conic-gradient(var(--felt) calc(var(--p)*1%),var(--surf3) 0);display:grid;place-items:center;flex:none}
.ring b{width:68px;height:68px;border-radius:50%;background:var(--surf);display:grid;place-items:center;font-size:19px;font-variant-numeric:tabular-nums}
/* ---------- lessons ---------- */
.lesson{font-size:17px}.lesson p,.lesson li{max-width:68ch}
.lesson h3{margin-top:1.4em}
.callout{border-radius:12px;padding:14px 16px;background:var(--surf2);margin:14px 0;border:1px solid var(--line)}
.callout.key{background:var(--goodbg);border-color:transparent}.callout.warn{background:var(--warnbg);border-color:transparent}.callout.book{background:var(--felt);color:var(--feltink);border-color:transparent}
.callout.book a{color:#fff}
.callout h4{margin:0 0 4px}
.formula{font-size:18px;font-weight:700;text-align:center;padding:12px;border-radius:12px;background:var(--surf2);margin:12px 0;font-variant-numeric:tabular-nums}
.widget{margin:18px 0;background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.widget>h4{margin-bottom:10px}
ul.clean{list-style:none;padding:0;margin:0}
.lesson ul,.lesson ol{padding-left:1.3em}.lesson li{margin:.25em 0}
table.t{border-collapse:collapse;width:100%;font-size:15px}
table.t th,table.t td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.t th{font-size:13px;color:var(--muted);font-weight:650}
table.t td.n,table.t th.n{text-align:right}
.scroll{overflow-x:auto}
/* quiz */
.q{margin:12px 0 18px}.q .opts{display:grid;gap:8px;margin-top:10px}
.opt{display:flex;align-items:flex-start;gap:10px;text-align:left;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surf);cursor:pointer;min-height:48px;font-size:16px;width:100%;line-height:1.35}
.opt:hover{background:var(--surf2)}
.opt.right{background:var(--goodbg);border-color:var(--good)}.opt.wrong{background:var(--badbg);border-color:var(--bad)}
.opt .k{flex:none;width:26px;height:26px;border-radius:8px;background:var(--surf2);display:grid;place-items:center;font-weight:700;font-size:13px}
.why{margin-top:10px;padding:12px 14px;border-radius:12px;background:var(--surf2);font-size:15.5px}
/* drills */
.drillcard{display:flex;flex-direction:column;gap:8px;text-decoration:none;color:inherit;cursor:pointer;transition:transform .12s}
.drillcard:hover{transform:translateY(-2px)}
.drillcard .ic{width:44px;height:44px;border-radius:12px;background:var(--felt);color:var(--feltink);display:grid;place-items:center}
.drillcard .ic svg{width:24px;height:24px}
.qcard{max-width:780px;margin:0 auto}
.scene{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-end;justify-content:center;padding:18px;border-radius:16px;background:var(--felt);color:var(--feltink);background-image:radial-gradient(ellipse at 50% 0%,rgb(255 255 255/.14),transparent 70%);margin:10px 0 16px}
.scene .lbl{font-size:12.5px;font-weight:700;opacity:.8;margin-bottom:5px;text-align:center}
.scene .info{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;width:100%}
.scene .info span{background:rgb(0 0 0/.25);padding:4px 10px;border-radius:999px;font-weight:650;font-size:14px;font-variant-numeric:tabular-nums}
.answers{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.answers .btn{min-height:54px;font-size:17px}
.feedback{border-radius:14px;padding:14px 16px;margin-top:14px}
.feedback.ok{background:var(--goodbg)}.feedback.no{background:var(--badbg)}
.feedback h3{margin:0 0 6px}
.progressdots{display:flex;gap:4px;flex-wrap:wrap}.progressdots i{width:22px;height:6px;border-radius:3px;background:var(--surf3)}.progressdots i.ok{background:var(--good)}.progressdots i.no{background:var(--bad)}.progressdots i.cur{background:var(--ink2)}
/* charts */
.fig{position:relative;min-height:260px;width:100%}.fig.short{min-height:200px}.fig.tall{min-height:340px}
.fig>svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.fig svg text{font-family:var(--font);fill:var(--muted);font-size:12px}
.fig svg .gl{stroke:var(--line);stroke-width:1}
.fig svg .ax{stroke:var(--ink2);stroke-width:1}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);padding:6px 10px;border-radius:8px;font-size:13px;white-space:nowrap;z-index:5;transform:translate(-50%,calc(-100% - 10px));font-variant-numeric:tabular-nums;box-shadow:var(--shadow)}
/* modal & toast */
.modal-bg{position:fixed;inset:0;background:rgb(0 0 0/.5);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .15s}
.modal{background:var(--surf);border-radius:18px;max-width:720px;width:100%;max-height:calc(100dvh - 32px);overflow:auto;padding:22px;box-shadow:0 20px 60px rgb(0 0 0/.35)}
.modal.wide{max-width:980px}
@keyframes fade{from{opacity:0}}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;font-weight:600;z-index:200;box-shadow:var(--shadow);animation:fade .2s;max-width:90vw}
/* home */
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:24px;align-items:center}
@media(max-width:820px){.hero{grid-template-columns:minmax(0,1fr)}}
.hero-pic{position:relative;aspect-ratio:1.35;border-radius:24px;background:var(--felt);overflow:hidden;background-image:radial-gradient(ellipse at 50% 30%,#1b8a60 0%,#0d5a3b 60%,#073826 100%)}
.hero-pic svg{position:absolute;inset:0;width:100%;height:100%}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.tile{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:3px}
.tile b{font-size:26px;font-stretch:110%;font-variant-numeric:tabular-nums}.tile span{font-size:13.5px;color:var(--muted)}
.list a.item,.list .item{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);text-decoration:none;color:inherit;min-height:56px}
.list .item:last-child{border-bottom:0}
.list .item .grow{flex:1}
.doneic{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--surf2);color:var(--muted);font-size:12px;font-weight:800}
.doneic.done{background:var(--good);color:#fff}
.hist{font-family:ui-monospace,Menlo,monospace;font-size:13px;white-space:pre-wrap;background:var(--surf2);padding:12px;border-radius:10px;max-height:340px;overflow:auto}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;font-weight:650;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap;min-height:44px}
.tabs button.on{color:var(--ink);border-color:var(--felt)}
.spinner{width:18px;height:18px;border:3px solid var(--surf3);border-top-color:var(--felt);border-radius:50%;animation:spin .8s linear infinite;display:inline-block;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
abbr[title]{text-decoration:underline dotted;cursor:help}
.hidden{display:none!important}
.mt{margin-top:16px}.mb{margin-bottom:16px}.mt0{margin-top:0}
.grade{font-weight:800;padding:2px 9px;border-radius:7px;font-size:13px}
.grade.g{background:var(--goodbg);color:var(--good)}.grade.m{background:var(--warnbg);color:var(--warn)}.grade.b{background:var(--badbg);color:var(--bad)}

    <p>"In position" (IP) means you act after your opponent on the flop, turn and river; "out of position" (OOP) means you act first.</p>
    ${w('tool:charts', 'Baseline opening charts')}`,
    quiz: [{ q: 'Heads-up, who acts first after the flop?', opts: ['The button (small blind)', 'The big blind', 'Whoever raised preflop', 'It alternates'], a: 1, why: 'The button acts first preflop but last on every later street.' },
      { q: 'Why can the button open far more hands than under the gun?', opts: ['Fewer players left to act and guaranteed position after the flop', 'The blinds are bigger', 'It sees more cards', 'Because of the rake'], a: 0, why: 'Only the blinds remain, and you will act last postflop in every hand.' }] });
  L({ id: 'how-to-train', course: 'foundations', title: 'How to train with Felt Lab', mins: 4, sum: 'A weekly routine that turns study into results, and what every number in the app means.',
    html: `<p>Felt Lab mixes four kinds of practice. Use all four — each covers a gap the others leave.</p>
    <ol><li><b>Learn</b> — short lessons with interactive figures. Move a slider and watch the maths change.</li><li><b>Drills</b> — ten-question rounds. Misses enter a spaced-repetition review queue: you see them again after a minute, then one, three, seven and 21 days.</li><li><b>Play</b> — a full table against bots with different styles. Turn on the heads-up display (HUD) and coach while you learn, then switch them off to test yourself.</li><li><b>Tools</b> — the calculators professionals use: equity, ranges, push/fold, Independent Chip Model (ICM), variance.</li></ol>
    <div class="callout key"><h4>A good week</h4>One Daily mix a day (5 minutes). Two lessons. Two sessions of 100 hands, reviewing every hand marked "Mistake". Clear your review queue on Sundays.</div>
    <h3>Numbers you will see</h3><ul><li><b>Equity</b>: your share of the pot if all cards were dealt out with no more betting.</li><li><b>Equity vs estimated range</b>: equity against every hand your opponent could hold given how they have played, weighted by how likely each is. The ranges are estimates built from the bots' actions, never from their real cards.</li><li><b>bb/100</b>: big blinds won per 100 hands — the standard win-rate unit.</li><li><b>All-in adjusted (EV) winnings</b>: what you would have won if every all-in paid out its equity instead of one actual runout. It strips out luck.</li></ul>
    <p>Your progress is stored on this device. Use Settings to back it up, move it to another device, or sync it when you are online.</p>`,
    quiz: [{ q: 'You get a drill question wrong. When will you see it again first?', opts: ['Never', 'In about a minute, in the review queue', 'Next month', 'Only in the Daily mix'], a: 1, why: 'Misses are due again almost immediately, then at growing intervals once you get them right.' }] });

  // ---------------- Maths ----------------
  UI.COURSES.push({ id: 'maths', title: 'Poker maths & statistics', blurb: 'The numbers behind every decision: odds, outs, expected value, combinatorics, ranges, variance and bankroll.', lessons: ['pot-odds', 'outs-odds', 'ev', 'implied', 'combinatorics', 'preflop-equity', 'ranges-equity', 'equity-dist', 'fold-equity', 'variance', 'bankroll', 'bayes'] });
  L({ id: 'pot-odds', course: 'maths', title: 'Pot odds and required equity', mins: 7, sum: 'Turn any bet into the exact equity you need to call — and memorise the landmark sizes.',
    html: `<p>When you call, you risk the call to win everything already in the pot plus the bet. The call is profitable when your <b>equity</b> (share of the pot you win on average) is greater than your share of the final pot.</p>
    <div class="formula">Required equity = call ÷ (pot + bet + call)</div>
    <p>Example: the pot is 10bb and your opponent bets 5bb. You call 5 to make a 20bb pot, so you need 5 ÷ 20 = <b>25%</b>. In ratio form you are getting 15 : 5, or 3 : 1 pot odds.</p>
    <table class="t"><thead><tr><th>Bet size</th><th class="n">Equity to call</th></tr></thead><tbody><tr><td>¼ pot</td><td class="n">16.7%</td></tr><tr><td>⅓ pot</td><td class="n">20%</td></tr><tr><td>½ pot</td><td class="n">25%</td></tr><tr><td>⅔ pot</td><td class="n">28.6%</td></tr><tr><td>¾ pot</td><td class="n">30%</td></tr><tr><td>Pot</td><td class="n">33.3%</td></tr><tr><td>2× pot</td><td class="n">40%</td></tr></tbody></table>
    ${w('tool:odds', 'Pot odds & expected value calculator')}
    <div class="callout warn"><h4>Direct odds assume no more betting</h4>On the flop or turn, future bets change the maths. If more money goes in when you hit, you have <i>implied odds</i>; if you can be bet off your equity, you realise less than your raw equity. Both come later in this course.</div>`,
    quiz: [{ q: 'Pot 30bb, opponent bets 20bb. What equity do you need to call?', opts: ['20%', '28.6%', '40%', '33%'], a: 1, why: '20 ÷ (30 + 20 + 20) = 20 ÷ 70 = 28.6%.' }, { q: 'Facing a pot-sized bet, you need…', opts: ['25%', '33%', '50%', '40%'], a: 1, why: 'Call 1 to win 3: 1 ÷ 3.' }, { q: 'You are getting 4 : 1. Required equity?', opts: ['25%', '20%', '40%', '80%'], a: 1, why: 'Risk 1 to win 4 → 1 ÷ (4 + 1) = 20%.' }] });
  L({ id: 'outs-odds', course: 'maths', title: 'Outs and the rule of 2 and 4', mins: 7, sum: 'Count clean outs, discount tainted ones, and convert to percentages in your head.',
    html: `<p>An <b>out</b> is an unseen card that gives you the best hand. Count only outs that are likely to win: if a flush card also pairs the board when your opponent may have a set, it is <i>tainted</i>.</p>
    <table class="t"><thead><tr><th>Draw</th><th class="n">Outs</th><th class="n">Flop → river</th><th class="n">Turn → river</th></tr></thead><tbody><tr><td>Gutshot straight</td><td class="n">4</td><td class="n">16.5%</td><td class="n">8.7%</td></tr><tr><td>Two overcards</td><td class="n">6</td><td class="n">24.1%</td><td class="n">13%</td></tr><tr><td>Open-ended straight</td><td class="n">8</td><td class="n">31.5%</td><td class="n">17.4%</td></tr><tr><td>Flush draw</td><td class="n">9</td><td class="n">35%</td><td class="n">19.6%</td></tr><tr><td>Flush + gutshot</td><td class="n">12</td><td class="n">45%</td><td class="n">26.1%</td></tr><tr><td>Flush + open-ender</td><td class="n">15</td><td class="n">54.1%</td><td class="n">32.6%</td></tr></tbody></table>
    <h3>The shortcut</h3><p>With one card to come, multiply outs by <b>2</b>. All-in on the flop with two cards to come, multiply by <b>4</b> — and subtract (outs − 8) when you have more than eight outs, because the rule of 4 overstates big draws.</p>
    ${w('tool:outs', 'Outs calculator: true outs against a known hand')}
    <div class="callout"><h4>Watch out</h4>The rule of 4 applies only when you will see both cards — usually when the money is all-in. Facing a flop bet with more betting to come, use one card at a time (rule of 2).</div>`,
    quiz: [{ q: 'Turn, 9 outs. Roughly what chance to hit on the river?', opts: ['9%', '18–20%', '36%', '45%'], a: 1, why: '9 × 2 = 18; exact 9 ÷ 46 = 19.6%.' }, { q: 'All-in on the flop with 15 outs. Best estimate?', opts: ['60%', '54%', '30%', '45%'], a: 1, why: '15 × 4 = 60, minus (15 − 8) = 53%. Exact 54.1%.' }, { q: 'You hold 8♥7♥ on 9♥6♠2♥ against a set of nines. Why are some outs tainted?', opts: ['Board-pairing cards give them a full house', 'Hearts are always tainted', 'Straights lose to flushes', 'They are not'], a: 0, why: 'Turn cards that pair the board (9, 6, 2) give the set a full house; fewer outs are clean.' }] });
  L({ id: 'ev', course: 'maths', title: 'Expected value (EV)', mins: 8, sum: 'Weigh every outcome by its probability. The language every poker decision is made in.',
    html: `<p><b>Expected value (EV)</b> is the average result of a decision if you could repeat it forever: the sum over outcomes of probability × result.</p>
    <div class="formula">EV = Σ (probability × amount won or lost)</div>
    <p>Calling all-in for 10bb into a 20bb pot with 35% equity: EV = 0.35 × 30 − 0.65 × 10 = +4bb. You lose this hand 65% of the time, and that is fine — over many repeats you gain 4bb each time.</p>
    ${w('evtree', 'An expected value tree for a drawing call')}
    <h3>Three EVs you will use constantly</h3><ul><li><b>Call</b>: equity × final pot − call.</li><li><b>Pure bluff</b>: fold% × pot − (1 − fold%) × bet.</li><li><b>Semi-bluff</b>: fold% × pot + (1 − fold%) × (equity × final pot − bet).</li></ul>
    <div class="callout key"><h4>Decisions, not results</h4>The Fundamental Theorem of Poker says you gain whenever you play differently from how you would if you could see your opponent's cards — and they gain when they do. Judge by EV, never by what happened this time.</div>`,
    quiz: [{ q: 'You bluff 10bb into 10bb. The opponent folds 55%. EV?', opts: ['+1bb', '+5.5bb', '−1bb', '0'], a: 0, why: '0.55 × 10 − 0.45 × 10 = +1bb.' }, { q: 'Call 8bb to win 24bb (pot after the bet) with 30% equity, all-in. EV?', opts: ['+1.6bb', '−0.8bb', '+2.4bb', '−1.6bb'], a: 0, why: '0.30 × 32 − 8 = 9.6 − 8 = +1.6bb.' }] });
  L({ id: 'implied', course: 'maths', title: 'Implied and reverse implied odds', mins: 6, sum: 'When future bets make a call right — and when they make a "good" hand a liability.',
    html: `<p><b>Implied odds</b> count money you expect to win on later streets when you hit. A set-mining call with 2-2 is a classic: you flop a set about 12% of the time (7.5 : 1 against), so you need to win roughly 7.5 times your call when you hit, plus some margin for the times you lose.</p>
    <div class="formula">Extra needed = (call − equity × final pot) ÷ equity</div>
    <p><b>Reverse implied odds</b> are money you lose later when you make a second-best hand. K-Q that flops top pair deep-stacked often pays off A-K and two pair; the same hand 30bb deep has far less to lose because the stack goes in quickly anyway.</p>
    <table class="t"><thead><tr><th>Good implied odds</th><th>Reverse implied odds</th></tr></thead><tbody><tr><td>Small pairs (sets are disguised)</td><td>Dominated offsuit broadways (K-J, Q-J vs better kickers)</td></tr><tr><td>Suited connectors (straights and flushes)</td><td>Non-nut flush draws</td></tr><tr><td>Deep stacks, loose opponents</td><td>Bottom end of straights</td></tr></tbody></table>
    ${w('evtree', 'Slide the "extra won" to see implied odds rescue a call')}`,
    quiz: [{ q: 'Implied odds are best when…', opts: ['Stacks are short and opponents tight', 'Stacks are deep and opponents pay off', 'You are out of position', 'The board is paired'], a: 1, why: 'You need money behind and someone willing to give it to you.' }, { q: 'Which hand has the worst reverse implied odds 200bb deep?', opts: ['5♦5♣', 'K♠J♦', '7♥6♥', 'A♣5♣'], a: 1, why: 'K-J offsuit often makes a dominated top pair that pays off better kickers.' }] });
  L({ id: 'combinatorics', course: 'maths', title: 'Combinatorics: counting hands', mins: 8, sum: 'Pairs have 6 combos, suited hands 4, offsuit 12 — and blockers change everything.',
    html: `<p>There are 1,326 two-card combinations. Grouped into the 169 starting hands of the grid:</p>
    <table class="t"><tbody><tr><td>Pocket pair (e.g. Q-Q)</td><td class="n">6 combos</td><td class="muted">C(4,2)</td></tr><tr><td>Suited hand (e.g. A-K suited)</td><td class="n">4 combos</td><td class="muted">one per suit</td></tr><tr><td>Offsuit hand (e.g. A-K offsuit)</td><td class="n">12 combos</td><td class="muted">4 × 3</td></tr><tr><td>Unpaired, any suits</td><td class="n">16 combos</td><td class="muted">4 × 4</td></tr></tbody></table>
    <h3>Card removal</h3><p>Every card you can see removes combos. If one King is visible, K-K has 3 combos left (C(3,2)); two Kings visible leaves 1. For A-K with one Ace visible: 3 × 4 = 12 combos instead of 16.</p>
    ${w('combos', 'Combo counter')}
    <p>This is why "he could have a set or a draw" is not enough. On K♠9♠4♦, sets (K-K, 9-9, 4-4) total 9 combos; all flush draws in a typical range easily exceed 30. Counting turns gut feel into numbers.</p>`,
    quiz: [{ q: 'Board A♣7♦2♠. How many combos of A-A remain?', opts: ['6', '3', '1', '4'], a: 1, why: 'One ace is visible: C(3,2) = 3.' }, { q: 'You hold K♥Q♥. How many combos of A-K can your opponent have?', opts: ['16', '12', '9', '4'], a: 1, why: 'One King is in your hand: 4 aces × 3 kings = 12.' }, { q: 'Board J♠T♠4♦. How many combos of J-T (two pair) are possible?', opts: ['16', '9', '6', '12'], a: 1, why: 'One J and one T are on board: 3 × 3 = 9.' }] });
  L({ id: 'preflop-equity', course: 'maths', title: 'Preflop equities to know cold', mins: 6, sum: 'Coin-flips, dominations and the matchups that decide all-ins.',
    html: `<p>Most preflop all-ins fall into a handful of matchup types. Know these and you can estimate any confrontation within a few percent.</p>
    <table class="t"><thead><tr><th>Matchup</th><th>Example</th><th class="n">Equity</th></tr></thead><tbody><tr><td>Pair vs two overcards</td><td>Q-Q vs A-K</td><td class="n">54 / 46</td></tr><tr><td>Pair vs two undercards</td><td>Q-Q vs 9-8</td><td class="n">80 / 20</td></tr><tr><td>Overpair vs underpair</td><td>A-A vs K-K</td><td class="n">82 / 18</td></tr><tr><td>Dominated kicker</td><td>A-K vs A-Q</td><td class="n">74 / 26</td></tr><tr><td>Two overs vs two unders</td><td>A-K vs J-T</td><td class="n">62 / 38</td></tr><tr><td>Pair vs one overcard</td><td>J-J vs A-T</td><td class="n">70 / 30</td></tr></tbody></table>
    ${w('tool:matchups', 'Every hand against every hand')}
    <p>Suited hands gain about 2–3% over their offsuit versions; connected hands about 1–2% more against overcards.</p>`,
    quiz: [{ q: 'A♠K♦ vs 2♣2♥ all-in. Who is the favourite?', opts: ['A-K, clearly', 'Twos, slightly (about 53%)', 'Exactly 50/50', 'Twos, heavily'], a: 1, why: 'Any pair is a slight favourite over two overcards.' }, { q: 'K-Q vs A-K is roughly…', opts: ['50/50', '26/74', '40/60', '35/65'], a: 1, why: 'A shared King and a better kicker: dominated, about 26%.' }] });
  L({ id: 'ranges-equity', course: 'maths', title: 'Thinking in ranges', mins: 8, sum: 'Opponents hold a range, not a hand. Equity against that range decides your decision.',
    html: `<p>You rarely know your opponent's exact hand. Instead assign a <b>range</b>: every hand they could hold given their position and actions, each weighted by how likely they are to play it that way. Then compute equity against the whole range.</p>
    <p>Example: a button opens, you defend the big blind with A♥J♣, and the flop is J♠8♥3♣. Against a 50% button range you are well ahead; against a range that bets and then raises your check-raise, your equity drops sharply. The hand didn't change — the range did.</p>
    ${w('tool:range', 'Range analyser: build a range, see how it hits the board')}
    <h3>Reading the grid</h3><p>Pairs are on the diagonal, suited hands above it, offsuit below. A "top 15%" range starts from the strongest hands and widens.</p>`,
    quiz: [{ q: 'Why does equity against a range differ from equity against one hand?', opts: ['It averages over every hand they could hold, weighted by likelihood', 'Ranges are always stronger', 'It doesn\'t', 'It ignores the board'], a: 0, why: 'Your decision must work against everything they could have.' }] });
  L({ id: 'equity-dist', course: 'maths', title: 'Equity distributions', mins: 7, sum: 'Two ranges with the same average equity can play completely differently.',
    html: `<p>A range's average equity hides its shape. Sort every combo by its equity against the opponent's range and plot it: that curve is the <b>equity distribution</b>.</p>
    <ul><li>A <b>polarised</b> range has many very strong and many very weak hands — a steep curve. It wants to bet big.</li><li>A <b>merged</b> or <b>condensed</b> range sits mostly in the middle — a flat curve. It prefers smaller bets and checks.</li></ul>
    ${w('tool:range', 'Plot both ranges\' distributions on a flop')}
    <p>Easy Game makes a related point about preflop hands: equity isn't linear. Aces and Kings sit far above everything; most other playable hands are bunched together.</p>
    ${w('equitygraph', 'Every hand\'s equity against a 3-bet range')}`,
    quiz: [{ q: 'A steep equity distribution with many strong and many weak hands is…', opts: ['Merged', 'Polarised', 'Capped', 'Linear'], a: 1, why: 'Polarised ranges are concentrated at both ends.' }] });
  L({ id: 'fold-equity', course: 'maths', title: 'Fold equity and semi-bluffs', mins: 7, sum: 'Why betting a draw can beat both checking and calling.',
    html: `<p><b>Fold equity</b> is the value you gain when your bet makes a better hand (or one with equity) fold. A <b>semi-bluff</b> combines it with pot equity: if they fold you win now; if they call you can still hit.</p>
    <div class="formula">Semi-bluff EV = fold% × pot + call% × (equity × final pot − bet)</div>
    ${w('tool:odds', 'Bluffing and semi-bluffing EV')}
    <p>Notice that with 35% equity when called, the bet can be profitable even if your opponent never folds — and every fold adds more. That is Easy Game's equation from Chapter 3: <b>pot equity + fold equity = aggression</b>.</p>`,
    quiz: [{ q: 'Pot 10, you shove 10 with 30% equity when called. Break-even fold rate?', opts: ['50%', 'About 9%', '30%', 'Zero'], a: 1, why: 'When called: 0.3 × 30 − 10 = −1. EV = 10f − (1 − f) = 11f − 1, which is positive once f > 1/11 ≈ 9%. A pure bluff would need 50%.' }] });
  L({ id: 'variance', course: 'maths', title: 'Variance and sample size', mins: 8, sum: 'How swingy poker is, what a confidence interval means, and why 10,000 hands proves little.',
    html: `<p>Poker results are noisy. A typical six-max cash player has a <b>standard deviation</b> of 80–110 big blinds per 100 hands. A good win rate is 3–8bb/100. The noise dwarfs the signal over small samples.</p>
    <p>After N hands your observed win rate has a standard error of σ ÷ √(N/100). With σ = 95 and 10,000 hands, that is 9.5bb/100 — so a true 5bb/100 winner can easily show anything from −14 to +24.</p>
    ${w('tool:variance', 'Variance simulator')}
    <div class="callout key"><h4>Use all-in adjusted results</h4>In Play, Felt Lab tracks winnings adjusted for all-in luck. Watching that line instead of raw results removes a large chunk of variance from your self-assessment.</div>`,
    quiz: [{ q: 'σ = 100bb/100. Standard error of your win rate after 40,000 hands?', opts: ['5bb/100', '2.5bb/100', '10bb/100', '1bb/100'], a: 0, why: '100 ÷ √400 = 5.' }, { q: 'Roughly how many hands to be 95% sure a 5bb/100 winner (σ 95) is a winner?', opts: ['10,000', '50,000', 'About 140,000', '1,000,000'], a: 2, why: '(1.96 × 95 ÷ 5)² × 100 ≈ 139,000.' }] });
  L({ id: 'bankroll', course: 'maths', title: 'Bankroll and risk of ruin', mins: 6, sum: 'How many buy-ins you need, and the formula behind the rules of thumb.',
    html: `<p><b>Risk of ruin</b> is the chance you lose your entire bankroll before you can grow it. For a winning player with win rate w and standard deviation σ (both per 100 hands) and bankroll B (in big blinds):</p>
    <div class="formula">Risk of ruin ≈ e<sup>−2wB ÷ σ²</sup></div>
    <p>At 5bb/100 with σ = 95, a 30 buy-in (3,000bb) bankroll gives about 19% risk of ruin; 50 buy-ins about 6%. Smaller edges need far more. That is why professionals keep 50–100 buy-ins for cash games.</p>
    ${w('tool:variance', 'Try your own numbers')}`,
    quiz: [{ q: 'Halving your win rate does what to the bankroll you need for the same risk?', opts: ['Halves it', 'Doubles it', 'No change', 'Quadruples it'], a: 1, why: 'B = −σ² ln(risk) ÷ (2w): inversely proportional to w.' }] });
  L({ id: 'bayes', course: 'maths', title: 'Hand reading as Bayesian updating', mins: 8, sum: 'Start with a range, let each action reweight it. That is all hand reading is.',
    html: `<p>Bayes' theorem in poker language: <i>how likely a hand is after an action</i> = how likely it was before × how likely that hand takes this action, then normalise. You start with a preflop range and update after every bet, call and check.</p>
    <ul><li>A <b>call</b> keeps medium hands and draws, removes most air and some monsters (which would raise).</li><li>A <b>raise</b> keeps strong hands and draws, plus the player's bluffs.</li><li>A <b>check</b> weakens a range — unless the player traps.</li></ul>
    ${w('handreading', 'Watch a range shrink street by street')}
    <p>Player type sets the likelihoods. A passive player's raise keeps almost only monsters; an aggressive player's raise keeps draws and bluffs too. This is why Easy Game says hand reading starts with one question: is this player aggressive or passive?</p>`,
    quiz: [{ q: 'A passive player check-raises the turn. Their range after the raise is…', opts: ['Wide and weak', 'Mostly very strong hands', 'Mostly draws', 'Unchanged'], a: 1, why: 'Passive players raise for value; their likelihood of raising with weak hands is near zero.' }] });
})();

/* ===== Content: Easy Game Vol. I companion (summaries in our own words) ===== */
(function () {
  const UI = window.UI; const L = (o) => { UI.LESSONS[o.id] = o; };
  const w = (name, title, arg) => `<div class="widget" data-w="${name}"${arg ? ` data-arg="${arg}"` : ''}>${title ? `<h4>${title}</h4>` : ''}</div>`;
  const book = (ch) => `<div class="callout book"><h4>From the book</h4>Andrew Seidman, <i>Easy Game</i>, Volume I — ${ch}. This lesson summarises the idea in our own words and adds interactive practice; read the chapter itself for the full argument and hand examples.</div>`;
  UI.COURSES.push({ id: 'easygame', title: 'Easy Game, Volume I — companion', blurb: 'Chapter-by-chapter lessons on Andrew Seidman\'s Easy Game: the reasons for betting, showdown theory, player identification, isolation, dead money and the heads-up framework.', lessons: ['eg-intro', 'eg-reasons', 'eg-preflop', 'eg-turn', 'eg-sizing', 'eg-players', 'eg-isolation', 'eg-dynamics', 'eg-raisesize', 'eg-value-streets', 'eg-showdown', 'eg-monotone', 'eg-gbucks', 'eg-fullring', 'eg-3bet', 'eg-deadmoney', 'eg-distributions', 'eg-hu', 'eg-conclusion'] });

  L({ id: 'eg-intro', course: 'easygame', title: 'A game of information', mins: 4, sum: 'Why the player who gathers and uses more information wins — and why learning beats winning.',
    html: `${book('Introduction and "A Game of Information"')}<p>Easy Game opens with the Fundamental Theorem of Poker: whoever makes the most and biggest mistakes loses. No-Limit Hold'em magnifies this — one big error can cost a stack.</p>
    <p>Beginners see only two things: their cards and the board. Better players see more — likely ranges, the flow of the game, image, player types and tendencies. The more information you notice <i>and use</i>, the better you play.</p>
    <p>The book is built in two steps: an "A-B-C" foundation good enough to beat weak and average players, then advanced concepts. Seidman warns against copying high-stakes moves without that foundation.</p>
    <div class="callout key"><h4>Key takeaways</h4><ul><li>Focus on learning, not on results.</li><li>Each chapter is a building block — Chapter 1 (reasons for betting) is the most important.</li><li>Terminology used throughout: c-bet (continuation bet), 3-bet (third bet), in position (IP), out of position (OOP), check-fold, check-raise, check-call, flat (call rather than raise), float (call to take it away later), wet and dry boards, implied and reverse implied odds.</li></ul></div>`,
    quiz: [{ q: 'According to the Fundamental Theorem as the book frames it, who wins?', opts: ['The player who wins the most pots', 'The player who makes fewer and smaller mistakes', 'The most aggressive player', 'The luckiest player'], a: 1, why: 'Profit comes from making smaller and fewer mistakes than your opponents.' }] });

  L({ id: 'eg-reasons', course: 'easygame', title: 'The three reasons for betting', mins: 9, sum: 'Value, bluff and capitalising on dead money. Protection and information are side effects, not reasons.',
    html: `${book('Chapter One: The Reasons for Betting')}<p>The whole book rests on one question: <b>why are you betting?</b> Seidman allows exactly three answers.</p>
    <ol><li><b>Value</b> — you bet to get called (or raised) by a worse hand. "I probably have the best hand" is not enough; worse hands must actually call.</li><li><b>Bluff</b> — you bet to make a better hand fold. "I can't win any other way" is not enough; better hands must actually fold.</li><li><b>Capitalising on dead money</b> — you bet to make your opponent fold <i>whatever</i> they hold and collect what's already in the pot. It works because folding hands give up their equity share, and because the pot can be big enough that occasional folds pay for the times you're called and lose.</li></ol>
    <p>People call too much far more often than they fold too much, so value betting dominates — especially at small stakes. As stakes and aggression rise, bluffing and dead money matter more.</p>
    <p>Reason #3 is rarely the main reason by itself. It usually supports a value bet or a bluff that would otherwise be slightly too thin: the bigger the pot, the thinner your value bets and bluffs can be. Even preflop raises are value or bluff raises subsidised by dead money — the blinds.</p>
    <h3>Protection and information</h3><p>Betting a set on a wet board does charge draws — but you bet because worse hands call. A weak pair that "needs protection" usually isn't strong enough to be protected from draws that are favourites over it. And betting "to see where you are" tends to fold out worse hands and get called only by better ones: you play perfectly for your opponent.</p>
    <div class="callout key"><h4>Use it at the table</h4>Before every bet, name the reason. If you can't, check. In Play, the coach labels each recommended bet with its reason.</div>
    ${w('tool:odds', 'Price a bluff: how often must they fold?')}`,
    quiz: [{ q: 'K♣Q♦ on A♠7♥5♦ against a loose-passive big blind who never folds a pair. The continuation bet is mainly…', opts: ['Value', 'Bluff', 'Dead money', 'Information'], a: 2, why: 'No worse hand calls and no pair folds — you bet to fold out equity like J-T and win the pot.' }, { q: 'Which is a genuine reason to bet?', opts: ['To find out where you stand', 'To protect a weak pair', 'To get called by worse hands', 'Because you might be best'], a: 2, why: 'Only value, bluff, and dead money qualify.' }, { q: 'Betting K♠K♦ on A♠2♣2♦ "for information" mainly…', opts: ['Gets called by worse and folds better', 'Gets called by better and folds worse', 'Is a good value bet', 'Is a bluff'], a: 1, why: 'You isolate yourself against aces and fold the hands you beat.' }] });

  L({ id: 'eg-preflop', course: 'easygame', title: 'Preflop ranges and postflop equity', mins: 8, sum: 'Preflop isn\'t a vacuum. Choose hands that keep equity after the flop: suited, high and connected.',
    html: `${book('Chapter Two: Preflop Hand Ranges and Postflop Equities')}<p>A common leak: treating preflop on its own. If preflop were a vacuum you could raise every button hand because the blinds' dead money would pay for it. You don't, because hands like 7-2 or K-2 offsuit walk into postflop spots where checking is weak and betting is spew.</p>
    <p>The fix is to choose hands with good postflop equity:</p>
    <ul><li><b>Suited cards</b> — not mainly for the flushes you make, but for the equity they keep. On a two-suited flop, A♠6♠ might have 50% equity where A♠6♣ has 15%; on a later spade turn the suited hand picks up 12 outs against 3.</li><li><b>High cards</b> — they usually make the best pair and keep six overcard outs when they miss.</li><li><b>Connected cards</b> — disguised straights, though straight draws can be tainted and tend to arrive on coordinated turns.</li></ul>
    <p>Combining all three makes hands like A-5 suited stronger opens than A-8 suited: the wheel straight potential matters more than a slightly better kicker.</p>
    ${w('suited', 'Suited vs offsuit: equity across 250 flops')}
    ${w('tool:charts', 'Opening charts built on these principles')}`,
    quiz: [{ q: 'Main reason suited hands are worth more postflop?', opts: ['They make flushes often', 'They keep equity on many flops and turns, letting you stay aggressive', 'Opponents fear them', 'They block aces'], a: 1, why: 'Flushes are rare; equity from draws and backdoors is constant.' }, { q: 'Why is A5s often a better open than A8s?', opts: ['Better kicker', 'Straight potential outweighs the small kicker difference', 'It is more disguised', 'It isn\'t'], a: 1, why: 'Wheel draws add real equity; a 5 vs 8 kicker rarely matters.' }] });

  L({ id: 'eg-turn', course: 'easygame', title: 'Aggression and the turn', mins: 8, sum: 'Pot equity + fold equity = aggression. When to barrel, when to check-raise.',
    html: `${book('Chapter Three: Aggression and the Turn')}<p>Keep firing on the turn only when you have enough <b>pot equity</b> (chance to win if called) plus <b>fold equity</b> (chance they fold). A big draw needs little fold equity; a scary overcard can justify a bluff with almost no outs. Most spots sit in between.</p>
    <div class="formula">Pot equity + fold equity = aggression</div>
    <h3>When a turn check-raise beats a second barrel</h3><ul><li>The opponent is unlikely to be strong — on wet boards, flat-calling ranges rarely contain sets or two pair, which would usually raise.</li><li>The opponent will bet a wide, weak range when you check — draws and floats bet to win the pot; weak pairs check behind.</li><li>You have real equity yourself, in case they have a disguised strong hand.</li></ul><p>On dry boards the opposite holds: a flat call contains more slow-played monsters, so prefer betting and folding to a raise.</p>
    <h3>What drives fold equity</h3><ol><li><b>Player type</b> — by far the biggest factor. Bad players, passive or aggressive, don't fold.</li><li><b>Board texture</b> — overcards increase it; low and coordinating cards reduce it.</li><li><b>Number of players</b> — more opponents, less fold equity.</li><li><b>Image</b> — a loose image means fewer folds; a tight one more.</li></ol>
    ${w('tool:odds', 'Semi-bluff calculator: fold equity plus pot equity')}`,
    quiz: [{ q: 'The most significant factor in fold equity is…', opts: ['Bet size', 'Player type', 'Your image', 'Stack depth'], a: 1, why: 'Bad players simply don\'t fold much.' }, { q: 'You c-bet A♣5♣ on 8♣7♣4♥ and are called; turn 2♦. Why consider a check-raise?', opts: ['The caller\'s range is capped; draws and air will bet when checked to', 'You want to slowplay', 'Sets are likely', 'You have no equity'], a: 0, why: 'A flat on a wet board is rarely a monster, and weak hands bet to win the pot.' }] });

  L({ id: 'eg-sizing', course: 'easygame', title: 'Bet sizing and thin value', mins: 8, sum: 'Bet bigger for value; bet smaller when your value is thin.',
    html: `${book('Chapter Four: Bet Sizing and Thin Value')}<p>The old formula of fixed sizes per street assumed smaller bets get called more often. Seidman's point: most players decide by their cards and the board; bet size is a distant third. If someone calls 35 into 50, they'll usually call 45 too — and the extra money from bigger calls outweighs the few extra folds. <b>When value betting, bet bigger.</b></p>
    <p>Except when value is <b>thin</b>: you're likely ahead, but many hands that call beat you and few worse hands call. Then a big bet folds the worse hands and keeps the better ones. The thinner the bet, the smaller it should be — sometimes a fifth of the pot.</p>
    <div class="callout"><h4>Thin value, defined in our words</h4>A bet aimed at the weakest hands that might call, accepting that some better hands call too, because the value from worse hands outweighs the losses to better ones.</div>
    ${w('thinvalue', 'Find the best river size for three hands')}
    <p>Good opponents may spot a small thin bet and raise as a bluff. Against them, a thin bet can still be right — and calling their raise depends on your read of their aggression.</p>`,
    quiz: [{ q: 'With a strong value hand against a typical opponent, bet size should usually be…', opts: ['Small to get called', 'Larger — calls depend mostly on cards and board', 'Always pot', 'Minimal'], a: 1, why: 'The extra value from bigger calls outweighs the few extra folds.' }, { q: 'The thinner your value bet, the…', opts: ['Bigger it should be', 'Smaller it should be', 'Less often you should check', 'More you should bluff'], a: 1, why: 'You need to keep the weakest worse hands calling.' }] });

  L({ id: 'eg-players', course: 'easygame', title: 'Player identification and hand reading', mins: 8, sum: 'Is he aggressive or passive? Reading players without a heads-up display.',
    html: `${book('Chapter Five: Player Identification and Basic Handreading')}<p>Hand reading begins with one question: <b>is this player aggressive or passive?</b> Against a passive player it's easy — a raise means a very strong hand. Aggressive players are harder.</p>
    <p>You don't need tracking statistics to answer. Look for visible tells:</p>
    <ol><li><b>Stack size</b> — sitting with less than a full buy-in (and not a professional short-stacker) suggests passive.</li><li><b>Limping</b> — calling the big blind instead of raising first in is passive, and usually reflects their whole game.</li><li><b>Min-raising</b> — usually a passive player who finally has something.</li><li><b>Number of tables</b> — full stacks on many tables suggests an aggressive regular.</li><li><b>3-betting</b> — frequent, consistent 3-bets mean aggressive; rare, oddly sized ones mean passive.</li></ol>
    ${w('playertypes', 'The three player types and the plan against each')}
    <div class="callout key"><h4>"Bad" isn't a read</h4>Calling a passive player's all-in with an overpair because "he's bad" is the classic mistake. The useful read is "he's passive" — so you fold.</div>
    <p>Practise this in Play: switch off "show player types", play 50 hands, then use <b>Identify players</b>.</p>`,
    quiz: [{ q: 'A player limps, min-raises and has a short stack at one table. Likely…', opts: ['Aggressive-good', 'Passive-bad', 'Aggressive-bad', 'Pro short stack'], a: 1, why: 'Classic passive indicators.' }, { q: 'Plan against an aggressive-bad player:', opts: ['Bluff often', 'Value bet and make big calls', 'Avoid him', 'Fold to raises'], a: 1, why: 'He calls a lot and his bets often mean nothing.' }, { q: 'Plan against a passive-bad player:', opts: ['Value bet; fold to his raises', 'Bluff him', 'Call his raises light', 'Slowplay'], a: 0, why: 'He calls too much and raises only with monsters.' }] });

  L({ id: 'eg-isolation', course: 'easygame', title: 'Isolation theory', mins: 7, sum: 'Raise to play pots against the players you want. Skill edge first, then position, then cards.',
    html: `${book('Chapter Six: Isolation Theory')}<p><b>Isolation</b> means raising preflop to play a pot with a particular player. It rests on three advantages:</p>
    <ol><li><b>Card advantage</b> — a weak player plays hands like J-6, so your J-T, Q-J and A-J dominate. Raise too wide and you lose this edge.</li><li><b>Positional advantage</b> — in position everything is easier: value, bluffs, pot control and reading.</li><li><b>Skill advantage</b> — your ability to make fewer mistakes and force theirs. By far the most important.</li></ol>
    <p>Deeper stacks amplify skill and position; with more money behind, the better player profits more. Even with aces, you might struggle out of position against the world's best very deep.</p>
    <p>A key reframe: you don't raise the button to steal the blinds — you raise to <b>play pots</b> against them in position. The steals are a bonus. When you widen, add hands that keep postflop equity (suited and high cards) before offsuit connectors.</p>
    ${w('isolation', 'Isolation range by skill edge and position')}`,
    quiz: [{ q: 'Rank the isolation advantages from most to least important.', opts: ['Cards, position, skill', 'Skill, position, cards', 'Position, cards, skill', 'Skill, cards, position'], a: 1, why: 'Skill edge is by far the most important, then position, then cards.' }, { q: 'Raising K4s under the gun can be right when…', opts: ['Never', 'There are big fish in the blinds to play against', 'The table is full of regulars', 'You are short-stacked'], a: 1, why: 'A skill edge against the players you\'ll face can outweigh a weak hand and position.' }] });

  L({ id: 'eg-dynamics', course: 'easygame', title: 'Table dynamics', mins: 7, sum: 'Who sits where, with what stack, changes the right play — preflop and postflop.',
    html: `${book('Chapter Seven: Table Dynamics')}<p>Every table has its own mix of <b>player types</b>, <b>stack sizes</b> and <b>positions</b>. A loose-aggressive player on your left means tighten up; a fish on your right means loosen up; a short-stacker behind you who shoves over raises means tighten. Short stacks reduce the value of set-mining hands and suited connectors (fewer implied odds) and raise the value of hands like K-J and A-T (fewer reverse implied odds).</p>
    <h3>Keep the fish in the pot</h3><p>When a fish limps and a regular raises, 3-betting from the blinds with Q-J suited usually isolates you against the one player who plays well. Calling keeps the mistake-maker involved.</p>
    <p>Postflop, the same idea: with a fish in a multiway pot, leading for value into the field can beat checking to the raiser. The fish calls with worse; the raiser's continuation range is stronger multiway. If the regular raises your lead, he's rarely bluffing — fold.</p>`,
    quiz: [{ q: 'A fish limps, a regular raises, you have Q♠J♠ in the big blind. Easy Game prefers…', opts: ['3-bet to isolate', 'Call to keep the fish in', 'Fold', 'Shove'], a: 1, why: 'Don\'t isolate yourself against the player making the fewest mistakes.' }, { q: 'Many short stacks at the table make which hands go down in value?', opts: ['K-J and A-T', 'Small pairs and suited connectors', 'Aces', 'None'], a: 1, why: 'They rely on implied odds, which short stacks remove.' }] });

  L({ id: 'eg-raisesize', course: 'easygame', title: 'Creative preflop raise sizes', mins: 6, sum: 'Size your opens by who is behind you, not by your cards.',
    html: `${book('Chapter Eight: Creative Preflop Raise Sizes')}<p>Most players open the same size every time. Seidman suggests three sizes:</p>
    <ul><li><b>Pot-sized</b> — a decent default that builds dead money and puts stacks in play.</li><li><b>Smaller</b> — when players behind play back at you (aggressive 3-bettors, professional short stacks). Less dead money makes their strategy worse.</li><li><b>Larger</b> — against very bad players who call too much preflop and play fit-or-fold; some openings can go as large as 8x.</li></ul>
    <p>This doesn't give away your hand, because it's based on public information — who sits in which seat with which stack. The governing factors: <b>skill advantage</b> (bigger when you're better), <b>position</b> (smaller in position, keeping more money behind to use it) and <b>stack size</b> (shorter stacks → smaller raises).</p>
    ${w('raisesize', 'Choose a size for the players behind you')}`,
    quiz: [{ q: 'Why doesn\'t varying open size by table composition leak information?', opts: ['Opponents don\'t notice', 'It depends only on public information', 'Sizes are random', 'It does leak'], a: 1, why: 'Your cards never enter the decision.' }] });

  L({ id: 'eg-value-streets', course: 'easygame', title: 'Value streets and pot management', mins: 8, sum: 'Plan bets so the stacks go in by the river — and re-evaluate when the hand changes.',
    html: `${book('Chapter Nine: Value Streets and Pot Management')}<p>Seidman prefers <b>pot management</b> to "pot control": managing the pot means making it as big <i>or</i> as small as your hand wants.</p>
    <ul><li><b>Static value</b> — how many streets of value you want right now (0, 1, 2, 3, or "3+" meaning stacks).</li><li><b>Dynamic value</b> — how that target changes as the hand develops. Aces on K♥Q♥J♥ after a 5-bet pot suddenly want zero streets. A passive player's turn raise does the same to one pair.</li></ul>
    <p>When you do want stacks, plan your sizes so a river shove is about pot-sized or less. Bets that are too small leave you with a stack that only an overbet can get in — and fewer worse hands call an overbet.</p>
    ${w('potmgmt', 'Set up a river shove')}
    ${w('tool:sizing', 'Geometric sizing planner')}`,
    quiz: [{ q: 'Pot $255 on the turn, $880 behind. Which bet leaves a sub-pot river shove?', opts: ['$120', '$170', '$230', '$80'], a: 2, why: 'After $230 is called: pot $715, $650 behind.' }, { q: 'You 5-bet aces and the flop is K♥Q♥J♥. Desired value becomes…', opts: ['3+ streets', 'Zero streets', 'One street', 'Unchanged'], a: 1, why: 'Dynamic value: re-evaluate every street.' }] });

  L({ id: 'eg-showdown', course: 'easygame', title: 'Showdown theory', mins: 8, sum: 'When to check behind, when to bet — and why protection is a consequence, not a reason.',
    html: `${book('Chapter Ten: Showdown Theory')}<p>If you can't justify a bet as value or a bluff, usually check. The classic: K-K on A-2-2 against someone who never folds an ace and never calls with worse. Betting turns your Kings into 7-3 — they only win when he folds, which he only does when you're ahead. Checking keeps his whole range, most of which you beat, and invites bluffs. Seidman calls the idea <b>range manipulation</b>.</p>
    <div class="grid g2"><div class="callout"><h4>Check behind when</h4><ul><li>You're unlikely to get called by worse (or fold better)</li><li>You're unlikely to be outdrawn</li></ul></div><div class="callout key"><h4>Bet when</h4><ul><li>Worse hands are likely to call</li><li>You're likely to be outdrawn</li></ul></div></div>
    <p>8-8 on 9♣7♣3♠ meets both bet conditions. 9-9 on A♣8♣8♠ is torn — likely outdrawn, but few worse hands call — and the choice matters little. A-K on A-7-6-8 after a called flop bet is an automatic value bet: lots of worse hands call and many cards hurt.</p>
    <div class="callout warn"><h4>Protection</h4>If a hand is worth protecting, it's worth value betting. If you can't value bet it, you don't need to protect it.</div>`,
    quiz: [{ q: 'Raised K-K, A-2-2 flop, opponent never folds an ace or calls with worse. Best?', opts: ['Bet for value', 'Check behind', 'Bet for protection', 'Overbet'], a: 1, why: 'Betting isolates you against aces; checking keeps his weaker range in.' }, { q: 'A♠K♠ on A♣7♣6♦8♠ after the flop was called. Turn checked to you:', opts: ['Check behind to avoid a check-raise', 'Bet for value', 'Check to trap', 'Overbet-bluff'], a: 1, why: 'Many worse hands call and you\'re often outdrawn — value bet and deal with a raise when it comes.' }] });

  L({ id: 'eg-monotone', course: 'easygame', title: 'Monotone boards and equity', mins: 6, sum: 'Raises on three-flush boards mean strength; one-pair hands need folds.',
    html: `${book('Chapter Eleven: Monotone Boards and Equity')}<p>On a monotone flop, many calling hands have a pair plus a draw, so value bets are inherently thinner. And a <b>raise</b> usually means a very strong hand: few preflop calling hands contain exactly one card of the suit that would want to raise, and the preflop raiser often has plenty of equity, so people rarely bluff these boards.</p>
    <p>A frequent error: "he has a draw more often than a flush, so I'll go all-in." When he has the flush you're drawing to about four outs; when he has the draw he's drawing to as many as twelve. You need him to be drawing <i>much</i> more often — slightly ahead in a way-behind/slightly-ahead spot is not enough.</p>
    ${w('gbucks', 'Sets vs draws: how often must he be drawing?')}
    <p>Monotone boards are good places for disciplined folds — and poor places to bluff, because most opponents won't fold as well as you do.</p>`,
    quiz: [{ q: 'A decent player raises your bet on K♥9♥8♥. Usually…', opts: ['A bluff', 'A very strong hand', 'A draw', 'Top pair'], a: 1, why: 'Few hands can raise for value or as a bluff here; raises are strong.' }] });

  L({ id: 'eg-gbucks', course: 'easygame', title: 'A brief understanding of G-bucks', mins: 6, sum: 'Judge decisions by equity against a range, not against the hand that was shown.',
    html: `${book('Chapter Twelve: A Brief Understanding of G-Bucks')}<p>"Sklansky bucks" judge a decision by your equity against the hand your opponent actually had. Phil Galfond's "G-bucks" concept moves to ranges: even if you got it in at 20% against the hand he showed, if you were 60% against his whole range, the decision earned 60% of the pot in the long run. (Seidman notes that the original concept is our <i>range</i> against his hand; for practical play, start with our hand against his range.)</p>
    <p>A range that is 40% sets and 60% draws is often a big favourite over one pair — even though he's "on a draw" most of the time.</p>
    <p>At the table, the maths is either simple (nut flush draw ≈ 45%) or too complex to do precisely; use the basic numbers and a trained feel for the rest. Felt Lab's hand review shows both numbers after every decision: equity against the estimated range (G-bucks view) and against the cards actually held (Sklansky view).</p>
    ${w('gbucks', 'Equity against the range')}`,
    quiz: [{ q: 'In the review, which number should you judge your call by?', opts: ['Equity vs their actual cards', 'Equity vs their estimated range', 'The result', 'Pot size'], a: 1, why: 'The range is what you could know when deciding.' }] });

  L({ id: 'eg-fullring', course: 'easygame', title: 'Full ring vs six-max and positional protection', mins: 6, sum: 'The button is just the button. What really changes is perceived ranges.',
    html: `${book('Chapter Thirteen: Full Ring vs. 6-max and Positional Protection')}<p>If the first three players fold in a nine-handed game, you're playing six-max. The real difference is context: full ring ranges are perceived as tighter. That makes c-bets and second barrels more effective and lets you play somewhat looser than standard tight full-ring advice — against bad players because of your skill edge, and against good players because they give your opens more credit.</p>
    <p>It also changes hand values. Seidman would rather hold K-Q suited than 4-4 under the gun in full ring: opponents aim to beat a strong perceived range with two pair or better, so small sets get coolered, while K-Q suited makes the best flushes and straights and can keep pressure on.</p>
    <p><b>Positional protection</b>: an early-position raise is rarely 3-bet light because it looks strong. Hands that hate light 3-bets (A-T suited, J-9 suited, 7-6 suited) gain value there, and callers behind can play wider because squeezes are less likely.</p>`,
    quiz: [{ q: 'Positional protection means…', opts: ['Acting last postflop', 'A strong-looking early raise is rarely 3-bet light', 'You can\'t be squeezed', 'Blinds always fold'], a: 1, why: 'Perceived strength protects your opens from light aggression.' }] });

  L({ id: 'eg-3bet', course: 'easygame', title: 'An introduction to 3-bet pots', mins: 7, sum: 'At small stakes, 3-bet ranges are tighter than you think. Don\'t flat out of position.',
    html: `${book('Chapter Fourteen: An Introduction to 3-Bet Pots')}<p>Against small-stakes players at 100bb:</p>
    <ol><li><b>3-betting ranges are tighter than you want to believe</b> — even when you've seen many 3-bets.</li><li><b>Your equity with hands like T-T is worse than you think</b> — and you'll have to give up on many ace and king flops.</li><li><b>Don't call 3-bets out of position in a heads-up pot</b> at 100bb. (A cold-caller behind changes the odds: small pairs may then have the price to set-mine.)</li><li>If his range is wide enough that A-K or J-J could call out of position, it's wide enough to 4-bet them for value. If it's too tight to call, fold.</li></ol>
    <p>In position you can call more, with high cards and pairs. How low you go depends on how light he 3-bets — 8-8 plays well against someone who 3-bets 6-7 suited, less well against one who only 3-bets K-J and better. Low cards suffer in 3-bet pots: worse hot-cold equity and fewer implied odds at a lower stack-to-pot ratio.</p>
    <p>Meanwhile, you can 3-bet them for value quite widely when they call with hands like 5-5, 6-7 suited or A-3.</p>
    ${w('tool:charts', 'Facing a 3-bet: baseline charts')}`,
    quiz: [{ q: 'Easy Game\'s small-stakes rule for 3-bets out of position, heads-up, 100bb:', opts: ['Call with pairs', 'Call with suited aces', '4-bet or fold — don\'t flat', 'Always 5-bet shove'], a: 2, why: 'Ranges are tight and calling out of position wastes your equity.' }, { q: 'In position facing a 3-bet, which hands defend best?', opts: ['Low suited connectors', 'High cards and pairs', 'Any suited hand', 'Weak offsuit aces'], a: 1, why: 'They hold equity better in a low stack-to-pot pot.' }] });

  L({ id: 'eg-deadmoney', course: 'easygame', title: 'Dead money vs live money', mins: 6, sum: 'Money in the pot is only "dead" if your opponent might fold it.',
    html: `${book('the addendum "Dead Money versus Live Money"')}<p>A shortcut that misleads: treating every chip in the pot as dead money. If you bet 100 into 150 and get raised to 250, the 500 in the middle is only dead to the extent your opponent will fold. Against a passive player who never raises without the nuts, it is all <b>live</b> — zero dead money, and semi-bluffing back is suicide. Against someone who folds to further action half the time, about half of it is dead.</p>
    <p>Seidman walks through spots: a passive-bad big blind on a random flop leaves the pot mostly dead (he check-folds a lot); the same player calling on an ace-high flop makes it live. A loose-aggressive regular who check-raises a wet flop often holds draws and bluffs — dead enough to re-bluff. A tight-aggressive regular check-raising the same flop — too live.</p>
    ${w('deadmoney', 'How dead is this pot?')}`,
    quiz: [{ q: 'A passive player check-raises your flop c-bet. Dead money in the pot is…', opts: ['All of it', 'About half', 'Almost none', 'Depends on your cards'], a: 2, why: 'Passive raises are strong; he won\'t fold.' }] });

  L({ id: 'eg-distributions', course: 'easygame', title: 'Equity distributions', mins: 6, sum: 'Equity isn\'t linear: A-A and K-K tower over the rest, and T-T ≈ 8-8.',
    html: `${book('the addendum "Equity Distributions"')}<p>Players talk as if hand strength rises in even steps: "A-J is a call but A-T is a fold." In reality winnings by hand are wildly skewed: aces far above everything, kings well above the rest, then queens, jacks, A-K and A-Q — and almost everything else bunched together.</p>
    <p>Two reasons: equity is naturally uneven (even if everyone played every hand, Q-7 wouldn't dominate worse hands the way aces do), and opponents fold the bottom 60–80% of hands, so the gaps between middling hands shrink against the hands that remain.</p>
    <p>The practical lesson: players overestimate medium hands. T-T against a 3-bet "has good equity" — against what? Against a 3-bettor's range it's crushed, and T-T is barely better than 8-8 except against 9-x.</p>
    ${w('equitygraph', 'Equity curve against a 3-bet range')}`,
    quiz: [{ q: 'Against a typical 3-bet range, T-T and 8-8 are…', opts: ['Very different', 'Close in equity, far below Q-Q+', 'Both favourites', '8-8 is better'], a: 1, why: 'They differ mainly against 9-x; both trail the top of the range.' }] });

  L({ id: 'eg-hu', course: 'easygame', title: 'Heads-up play for beginners', mins: 10, sum: 'Matt Colletta\'s framework: open 100%, polarise c-bets in position, a tight defend range out of position.',
    html: `${book('Chapter Fifteen: HU Play for Beginners (by Matt Colletta)')}<p>Colletta argues heads-up offers the most profit: you choose your opponent, you control the match, and it's where the highest stakes play. Start with one table; you'll be in nearly every hand, so think about hand value against ranges rather than in absolute terms.</p>
    <h3>In position (button)</h3><ul><li><b>Open 100%</b> of hands to 3x — it profits against a tight opponent and forces him to play out of position.</li><li><b>Polarise your continuation bets</b>: bet the bottom (air) and the top (top pair or better, plus draws); check the middle (ace-high, second and bottom pairs) for pot control.</li><li>Exceptions: on very dry boards, top pair with a weak kicker can check to disguise and bet later; on draw-heavy boards, widen value bets with strong non-top-pair hands like A-T on J-T-6.</li></ul>
    ${w('polarcbet', 'Polarised c-betting: your range on a random flop')}
    <h3>Out of position (big blind)</h3><p>A starting defend range from the chapter (adjust per opponent): T-9, J-9+, Q-9+, K-9+, K-8 suited, A-8 to A-J, any suited ace, suited connectors 6-5 and up, and pairs 2-2 to 8-8 — with 9-9+, A-Q, A-K and K-Q as the value 3-bets.</p>
    ${w('rangeview', 'Big blind calling range (Easy Game heads-up)', 'T9, JT, J9, Q9+, K9+, K8s, A8-AJ, A2s+, 65s, 76s, 87s, 98s, 22-88')}
    <ul><li><b>Check-call</b> weak and medium top pairs, middle pairs, some bottom pairs against players who rarely barrel, strong ace- and king-high draws, and occasionally sets on very dry boards (like 2-2 on T-5-2, where many turns give him bluffs or top pair).</li><li><b>Check-raise</b> very strong hands you're happy to stack off with, draws with good fold equity, occasionally air against over-c-bettors, and bottom pairs with a good kicker as semi-bluffs — with a plan for each turn.</li><li><b>3-bet</b> out of position to about 10x: value with 9-9+, K-Q, A-Q, A-K; add bluffs like J-7 suited only once comfortable. Plan your sizing so a third barrel still carries fold equity.</li></ul>
    <p>After 3-betting: barrel top pair and overpairs; c-bet air on dry boards and fire overcard turns; usually check-fold A-K on boards like 5-6-7 that hit his calling range.</p>
    ${w('tool:pushfold', 'Short-stacked heads-up: push/fold equilibrium')}`,
    quiz: [{ q: 'Heads-up framework: J-T on K-T-5 after you open the button and get called.', opts: ['Bet: you have a pair', 'Check: it\'s the middle of your range', 'Shove', 'Bet small for information'], a: 1, why: 'Polarise: bet air and top pair+, check middle pairs.' }, { q: 'A-Q on 7-8-T, heads-up in position. Framework says…', opts: ['Bet as a bluff', 'Check: ace-high has showdown value and hates a check-raise', 'Bet for value', 'Overbet'], a: 1, why: 'Ace-high sits in the middle of the range.' }, { q: 'Which is NOT in the starting value 3-bet range out of position?', opts: ['A-K', 'K-Q', 'Q-J', '9-9'], a: 2, why: 'Q-J is a flat: his calling range dominates it.' }] });

  L({ id: 'eg-conclusion', course: 'easygame', title: 'The basics: conclusion', mins: 3, sum: 'Get value and don\'t pay off. People bluff you less often than you think.',
    html: `${book('The Basics: Conclusion')}<p>The first part of the book adds up to a solid "A-B-C" game: choose hands that play well postflop, know why you bet, size for value, read players by type, and manage the pot. It's enough to beat bad players and hold your own against average ones.</p>
    <div class="callout key"><h4>The two keys</h4><ol><li>Get value.</li><li>Don't pay off — especially passive players who raise.</li></ol>People are bluffing you less than you think. Make the disciplined folds and the big value bets.</div>
    <p>Next steps in Felt Lab: the <a href="#course-advanced">Advanced theory</a> course covers the game-theory ideas behind balance, bluff ratios and exploitation — the territory of Easy Game's advanced volume.</p>
    <p>Practise everything from this course with the <a href="#drill-easygame">Easy Game concepts drill</a>.</p>`,
    quiz: [{ q: 'The conclusion\'s anecdote to remember:', opts: ['Everyone bluffs too much', 'People bluff you less often than you think', 'Always call the river', 'Position is everything'], a: 1, why: 'So fold to passive aggression and value bet relentlessly.' }] });
})();
