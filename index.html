/* ===== Course: Easy Game, Volume I — companion (part B) ===== */
(function () {
  const UI = window.UI, X = UI.LX, h = X.h;

  X.L({ id: 'eg-showdown', course: 'easygame', title: 'Showdown theory', mins: 11, sum: 'When to check behind and when to bet: two simple tests that decide most medium-strength hands.',
    html: `${X.book('Chapter Ten: Showdown Theory')}
    ${X.goals(['The two tests for betting a medium-strength hand', 'Range manipulation: why checking can keep your opponent\'s weaker hands in', 'Why "protection" follows from value, not the other way round'])}
    ${X.terms([['Showdown value', 'The chance your hand wins if it is checked down.'], ['Check behind', 'Checking as the last player to act, ending the betting round.'], ['Range manipulation', 'Choosing an action that keeps your opponent\'s range wide and weak (by checking) rather than narrowing it to hands that beat you (by betting).'], ['Outdrawn', 'Losing to a hand that was behind but improved on a later card.']])}
    <h3>1. The two tests</h3>
    <div class="grid g2"><div class="callout key"><h4>Bet when…</h4><ul><li>worse hands are <b>likely to call</b>, or</li><li>you are <b>likely to be outdrawn</b> if you check</li></ul></div><div class="callout"><h4>Check behind when…</h4><ul><li>worse hands are <b>unlikely to call</b> (and better ones won\'t fold), and</li><li>you are <b>unlikely to be outdrawn</b></li></ul></div></div>
    ${X.ex('a clear check', ['You raised ' + h('KsKd') + '; the flop is ' + h('Ah2c2d') + '. Your opponent never folds an ace and never calls with worse.', 'Test 1 — do worse hands call? No.', 'Test 2 — will you be outdrawn? Rarely: only an ace or a deuce hurts.', 'If you bet, only aces call; your kings become a bluff that can\'t work.'], { result: 'Check. Checking keeps all his weaker hands in his range and may induce a bluff — range manipulation.' })}
    ${X.ex('a clear bet', ['You hold ' + h('8d8h') + ' on ' + h('9c7c3s') + ' in position.', 'Test 1 — worse hands call: draws (clubs, 6-5, T-8), 7-x, smaller pairs. Yes.', 'Test 2 — outdrawn: many turns (any club, any 6/T/J/Q/K/A) hurt you. Yes.'], { result: 'Both tests say bet.' })}
    ${X.ex('a torn decision', ['You hold ' + h('9s9h') + ' on ' + h('Ac8c8s') + '.', 'Test 1 — worse hands call: few. Most hands that call have an ace or an eight.', 'Test 2 — outdrawn: any club, ace or overcard hurts, so somewhat yes.'], { result: 'The tests disagree, and either choice is close. Don\'t agonise; spend your effort on clearer spots.' })}
    ${X.turn('You hold ' + h('AsKs') + ' on ' + h('Ac7c6d') + ' and bet the flop; you were called. Turn ' + h('8s') + ', checked to you. Bet or check?', '<ol><li>Worse hands that call: any ace with a weaker kicker, 7-x, 6-x, draws. Yes.</li><li>Outdrawn: the board is very connected — many rivers hurt. Yes.</li><li><b>Bet for value</b>, and deal with a check-raise if it comes.</li></ol>')}
    ${X.key('Protection, restated', 'If a hand is worth protecting, it is worth value betting. If worse hands won\'t call, you usually don\'t need to "protect" it.')}
    ${X.sum(['Bet when worse hands call or you\'ll often be outdrawn.', 'Check when neither is true — keep his weaker hands in.', 'When the tests disagree, the choice matters little.'])}`,
    quiz: [{ q: 'You raised K-K; the flop is A-2-2. Your opponent never folds an ace or calls with worse. Best?', opts: ['Bet for value', 'Check behind', 'Bet for protection', 'Overbet'], a: 1, why: 'Neither test is met: worse hands don\'t call and you\'re rarely outdrawn.' }, { q: 'A♠K♠ on A♣7♣6♦8♠ after betting the flop and getting called. Turn checked to you:', opts: ['Check behind to avoid a check-raise', 'Bet for value', 'Check to trap', 'Bluff'], a: 1, why: 'Worse hands call and you\'re often outdrawn — both tests say bet.' }] });

  X.L({ id: 'eg-monotone', course: 'easygame', title: 'Monotone boards and equity', mins: 9, sum: 'On three-of-a-suit flops, raises mean strength and one pair needs to fold more than you\'d think.',
    html: `${X.book('Chapter Eleven: Monotone Boards and Equity')}
    ${X.goals(['Why value bets are thinner on monotone flops', 'Why a raise on a monotone flop usually means a strong hand', 'Why "he has a draw more often than a flush" isn\'t enough to stack off'])}
    ${X.terms([['Monotone flop', 'Three cards of the same suit, such as K♥9♥8♥.'], ['Made flush', 'Five cards of one suit already.'], ['One-card flush draw', 'Holding one card of the board\'s suit, needing one more.']])}
    <h3>1. Thinner value, stronger raises</h3>
    <p>On a monotone flop many calling hands hold a pair plus one card of the suit, so they have extra outs against you: your value bets are thinner. And raises are usually strong: few preflop calling hands want to raise with exactly one card of the suit, while the preflop raiser often has plenty of equity — so bluff-raises are rare.</p>
    <h3>2. The way-behind / slightly-ahead trap</h3>
    <p>Holding one pair, you face an all-in. "He has a draw more often than a made flush" sounds like a call. Do the maths:</p>
    ${X.ex('sets and draws in one range', ['You hold ' + h('AsJc') + ' on ' + h('Jh8h3c') + ' (top pair, top kicker). The pot is 10bb and your opponent shoves for 25bb — two and a half times the pot.', 'Price: you need 25 ÷ (10 + 25 + 25) = <b>42%</b> equity to call.', 'Against a set (8-8 or 3-3) you have about <b>2%</b>.', 'Against a heart draw you have about <b>55%</b> (many of those draws also have straight outs or overcards).', 'If 60% of his combos are draws and 40% sets: 0.6 × 55 + 0.4 × 2 ≈ <b>34%</b>.', '34% is well below 42% — fold, even though he is drawing most of the time.'], { result: 'Being "slightly ahead" of draws doesn\'t make up for being far behind sets. Draws have to be much more common.' })}
    ${X.w('gbucks', 'Slide the mix of sets and draws', ['Move the slider to change how much of his range is draws.', 'The tiles show your equity against each part and against the whole range; the note compares it with the price.'])}
    ${X.sum(['Monotone flops: value bets get thinner and raises get stronger.', 'One pair vs a set-or-draw range needs a big majority of draws to call.', 'Good boards for disciplined folds — poor boards for bluffs, because weak players don\'t fold here.'])}`,
    quiz: [{ q: 'A decent player raises your bet on K♥9♥8♥. Usually…', opts: ['A bluff', 'A very strong hand', 'A weak draw', 'Top pair'], a: 1, why: 'Few hands raise for value or as a bluff there; raises are strong.' }, { q: 'One pair vs a range of 60% draws and 40% sets on a monotone board. Why is calling a shove often wrong?', opts: ['Draws are favourites', 'Your equity against sets is so low that the average falls below the price', 'Shoves are always strong', 'Ties are likely'], a: 1, why: 'About 0.6 × 55% + 0.4 × 2% ≈ 34% — below the 42% this shove needs, as worked through above.' }] });

  X.L({ id: 'eg-gbucks', course: 'easygame', title: 'A brief understanding of G-bucks', mins: 8, sum: 'Judge decisions by equity against the whole range, not the hand that was turned over.',
    html: `${X.book('Chapter Twelve: A Brief Understanding of G-Bucks')}
    ${X.goals(['The difference between "Sklansky bucks" and "G-bucks"', 'How to judge a call you lost', 'How Felt Lab\'s hand review shows both numbers'])}
    ${X.terms([['Sklansky bucks', 'Your equity against the hand your opponent actually had, times the pot. Judges the result against one hand.'], ['G-bucks', 'Your equity against your opponent\'s whole range (Phil Galfond\'s idea). Judges the decision.']])}
    <h3>1. Two ways to judge the same call</h3>
    ${X.ex('a lost all-in', ['You call an all-in with ' + h('AsJc') + ' on ' + h('Jh8h3c') + '; you needed 42%. He shows ' + h('8c8d') + '. You have 2% — it looks like a disaster.', '<b>Sklansky view:</b> 2% equity against his actual hand. A terrible call.', '<b>G-bucks view:</b> before he showed, his range was 90% heart draws and 10% sets. Your equity against that range: 0.9 × 55% + 0.1 × 2% ≈ <b>50%</b>.', 'With 50% against the range when 42% was needed, the call was good. This time he happened to have the top of his range.'], { result: 'Judge the decision by the range you faced, not the cards he turned over.' })}
    <p>Seidman notes that Galfond\'s original idea compares our <i>range</i> against his hand; for practical play, start with our hand against his range.</p>
    ${X.key('In Felt Lab', 'After each hand in Play, the review shows both numbers for every decision: "equity vs estimated range" (G-bucks) and "vs their actual cards" (Sklansky). Grade yourself on the first.')}
    ${X.sum(['Sklansky bucks: equity vs the actual hand.', 'G-bucks: equity vs the whole range — the right way to judge a decision.'])}`,
    quiz: [{ q: 'In the hand review, which number should you judge a call by?', opts: ['Equity vs their actual cards', 'Equity vs their estimated range', 'The result', 'The pot size'], a: 1, why: 'The range is what you could know when you decided.' }] });

  X.L({ id: 'eg-fullring', course: 'easygame', title: 'Full ring vs six-max and positional protection', mins: 7, sum: 'The button is still the button. What changes is how strong your range looks — and that protects certain hands.',
    html: `${X.book('Chapter Thirteen: Full Ring vs. 6-max and Positional Protection')}
    ${X.goals(['What really differs between nine-handed and six-handed games', 'Which hands go up or down in value at full ring', 'What "positional protection" means'])}
    ${X.terms([['Full ring', 'A nine- or ten-handed table.'], ['Perceived range', 'The range your opponents think you have from your position and actions.'], ['Positional protection', 'An early-position raise looks strong, so opponents rarely 3-bet it light. That protects hands that don\'t like facing 3-bets.']])}
    <h3>1. Same seats, different perception</h3>
    <p>If the first three players fold in a nine-handed game, you are effectively playing six-handed. The real change is perception: full ring ranges look tighter. Your c-bets and second barrels get more respect, so you can play somewhat looser than "tight full ring" advice suggests.</p>
    ${X.ex('which hand under the gun?', ['K♠Q♠ or 4♣4♦ in the first seat at full ring?', 'Opponents expect a strong range, so they continue with hands that beat strong ranges — two pair or better. Small sets get "coolered" by bigger sets and straights more often.', 'K-Q suited makes the best flushes and straights, and can keep betting when the board favours a strong range.'], { result: 'The book prefers K-Q suited here.' })}
    <h3>2. Positional protection</h3>
    <p>Hands like A-T suited, J-9 suited and 7-6 suited hate facing a light 3-bet. From early position nobody 3-bets them light, so they become profitable opens. Players behind you also call more widely, because squeezes are less likely.</p>
    ${X.sum(['Full ring = tighter perceived ranges: more respect for your aggression.', 'Positional protection makes some speculative hands playable early.'])}`,
    quiz: [{ q: 'Positional protection means…', opts: ['Acting last after the flop', 'A strong-looking early raise is rarely 3-bet light', 'You can\'t be squeezed', 'The blinds always fold'], a: 1, why: 'Perceived strength protects your opens from light aggression.' }] });

  X.L({ id: 'eg-3bet', course: 'easygame', title: 'An introduction to 3-bet pots', mins: 9, sum: 'At small stakes, 3-bet ranges are tighter than you think. Don\'t flat out of position; in position, defend with high cards and pairs.',
    html: `${X.book('Chapter Fourteen: An Introduction to 3-Bet Pots')}
    ${X.goals(['Why small-stakes 3-bet ranges are strong', 'The rule for facing a 3-bet out of position', 'Which hands to defend in position'])}
    ${X.terms([['Facing a 3-bet', 'You opened and someone re-raised you.'], ['4-bet', 'Re-raising the 3-bet.'], ['Stack-to-pot ratio (SPR)', 'Stack ÷ pot on the flop. 3-bet pots have a low SPR, which reduces implied odds.']])}
    <h3>1. Four points for 100bb, small stakes</h3>
    <ol><li>3-bet ranges are tighter than you want to believe.</li><li>Your equity with hands like T-T is worse than it feels, and you\'ll give up on many ace and king flops.</li><li><b>Don\'t call 3-bets out of position in a heads-up pot.</b> (If someone has already cold-called, small pairs may get the price to set-mine.)</li><li>If their range is wide enough that A-K or J-J could call out of position, it\'s wide enough to 4-bet those hands for value. If it\'s too tight to call, fold.</li></ol>
    ${X.ex('facing a 3-bet out of position', ['You open ' + h('TsTc') + ' under the gun. The button 3-bets. A small-stakes 3-bet range is roughly Q-Q+, A-K, sometimes J-J and A-Q suited.', 'T-T has only about 35% against that range all-in — and does worse still out of position with a low SPR and overcard flops.', 'Calling leads to a big pot, out of position, often facing overcards.'], { result: '4-bet or fold. Against this tight range, fold.' })}
    <h3>2. In position</h3>
    <p>You can call wider: high cards and pairs. How low depends on how light they 3-bet — 8-8 plays well against someone who 3-bets 7-6 suited, worse against someone who 3-bets only K-J and up. Low suited cards suffer: worse hot-and-cold equity and fewer implied odds at a low SPR.</p>
    ${X.w('tool:charts', 'Facing a 3-bet: baseline charts', ['Choose "Opener in position" and "Opener out of position" under "Facing a 3-bet". Red = 4-bet; green = call.'])}
    ${X.sum(['3-bet ranges at small stakes are strong.', 'Out of position heads-up: 4-bet or fold.', 'In position: defend with high cards and pairs.'])}`,
    quiz: [{ q: 'Easy Game\'s rule for facing a 3-bet out of position, heads-up, 100bb, small stakes:', opts: ['Call with pairs', 'Call with suited aces', '4-bet or fold — don\'t flat', 'Always 5-bet'], a: 2, why: 'Tight ranges plus being out of position waste your equity.' }, { q: 'In position facing a 3-bet, which hands defend best?', opts: ['Low suited connectors', 'High cards and pairs', 'Any suited hand', 'Weak offsuit aces'], a: 1, why: 'They hold equity better in a low-SPR pot.' }] });

  X.L({ id: 'eg-deadmoney', course: 'easygame', title: 'Dead money vs live money', mins: 8, sum: 'Money in the pot is only "dead" if your opponent might give it up. Against players who don\'t fold, it\'s all live.',
    html: `${X.book('the addendum "Dead Money versus Live Money"')}
    ${X.goals(['The difference between dead and live money', 'How player type decides how dead a pot is', 'How to price a re-bluff'])}
    ${X.terms([['Dead money', 'Money your opponent is likely to give up by folding.'], ['Live money', 'Money your opponent will fight for — they won\'t fold it.']])}
    <h3>1. The idea</h3>
    <p>It is tempting to treat everything in the middle as "dead money" to steal. But it is only dead to the extent that your opponent will fold. A pot that a passive player has raised is almost all live.</p>
    ${X.f('Dead money ≈ pot × chance they fold')}
    ${X.ex('should you re-bluff a check-raise?', ['You bet 100 into 150. Your opponent check-raises to 250. The pot is now 500.', 'You consider re-raising all-in to 750 as a bluff. That risks 650 more (your 750 minus the 100 already in).', 'Break-even fold rate = risk ÷ (risk + pot) = 650 ÷ (650 + 500) = <b>57%</b>.', 'Against a <b>passive</b> player who check-raises only with strong hands: he folds maybe 0–10%. Almost all the 500 is live → disaster.', 'Against a <b>loose-aggressive</b> regular who check-raises draws and air: he may fold 50–60%. A real chance.'], { result: 'The same pot is "dead" against one player and "live" against another.' })}
    ${X.w('deadmoney', 'How dead is this pot?', ['Slide the fold rate and your shove size. The tiles split the pot into dead and live money and show the bluff\'s expected value.'])}
    ${X.sum(['Dead money = pot × fold chance.', 'Passive raisers make pots live; loose-aggressive raisers can leave them dead.'])}`,
    quiz: [{ q: 'A passive player check-raises your flop c-bet. How much of the pot is dead money?', opts: ['All of it', 'About half', 'Almost none', 'Depends on your cards'], a: 2, why: 'Passive raises are strong; he won\'t fold, so the money is live.' }, { q: 'You\'d risk 650 to win a 500 pot. How often must he fold to break even?', opts: ['About 43%', 'About 57%', '65%', '50%'], a: 1, why: '650 ÷ (650 + 500) = 57%.' }] });

  X.L({ id: 'eg-distributions', course: 'easygame', title: 'Equity distributions (preflop)', mins: 7, sum: 'Hand strength isn\'t linear: A-A and K-K tower over everything, and T-T is closer to 8-8 than you think.',
    html: `${X.book('the addendum "Equity Distributions"')}
    ${X.goals(['Why hand values are bunched, not evenly spaced', 'Why medium pairs are overrated against strong ranges'])}
    ${X.terms([['Equity distribution', 'How equity is spread across all 169 starting hands when sorted from best to worst.'], ['Against a 3-bet range', 'Compared with the hands someone re-raises with: mostly big pairs and big aces.']])}
    <h3>1. The shape</h3>
    <p>Players talk as if hands climb in even steps: "A-J is a call but A-T is a fold". In reality the winnings by hand are wildly skewed: aces far above everything, kings well above the rest, then a group of queens, jacks, A-K and A-Q — and almost everything else bunched together.</p>
    <p>Two reasons: equity is naturally uneven (no hand dominates the field the way aces do), and opponents fold their weakest 60–80% of hands, so the hands you actually play against are strong — compressing the gaps between medium hands.</p>
    ${X.w('equitygraph', 'Every hand\'s equity against a 3-bet range', ['The curve sorts all 169 hands by equity against the chosen range. The bars below compare specific hands.', 'Switch between "vs 3-bet range", "vs button open" and "vs random hand" to see how the shape changes.'])}
    ${X.ex('T-T vs 8-8 facing a 3-bet', ['Against a range of T-T+, A-Q+ and a few bluffs, T-T and 8-8 both win mainly against the A-x hands.', 'T-T is better only against 9-9 and hands with a 9 — rare in a 3-bet range.', 'Both are far below Q-Q+.'], { result: 'Don\'t treat T-T as a monster against a 3-bet just because it\'s "a big pair".' })}
    ${X.sum(['Equity is bunched: a few hands tower over the rest.', 'Against strong ranges, medium pairs are much closer to each other than they look.'])}`,
    quiz: [{ q: 'Against a typical 3-bet range, T-T and 8-8 are…', opts: ['Very different', 'Close in equity, and both far below Q-Q+', 'Both big favourites', '8-8 is better'], a: 1, why: 'They differ mainly against 9-x; both trail the top of the range.' }] });

  X.L({ id: 'eg-hu', course: 'easygame', title: 'Heads-up play for beginners', mins: 13, sum: 'Matt Colletta\'s framework: open every button, polarise your continuation bets in position, and defend a tight range out of position.',
    html: `${X.book('Chapter Fifteen: HU Play for Beginners (by Matt Colletta)')}
    ${X.goals(['The button strategy: open 100% and polarise c-bets', 'The big-blind strategy: a starting defend range, when to check-call and when to check-raise', 'How to play after you 3-bet'])}
    ${X.terms([['Heads-up', 'A table with only two players.'], ['Polarised c-bet', 'Continuation-betting your strongest hands and your weakest ones, while checking the medium hands.'], ['Middle of the range', 'Hands with some showdown value but little to gain from betting: second pair, weak top pair, ace-high.'], ['Pot control', 'Keeping the pot small with a medium hand.']])}
    <h3>1. Why heads-up</h3><p>You choose your opponent, you\'re in nearly every hand, and it\'s where the biggest games are played. Start with one table and think about hand values against ranges, not in absolute terms.</p>
    <h3>2. On the button (in position)</h3>
    <ul><li><b>Open 100%</b> of hands to 3x. It profits against a tight opponent and forces them to play out of position.</li><li><b>Polarise your c-bets</b>: bet your air and your top pair or better plus good draws; <b>check the middle</b> (second pair, weak pairs, ace-high).</li></ul>
    ${X.ex('which hands to c-bet?', ['You open the button; the big blind calls. Flop ' + h('Kd7c3s') + '; they check.', h('9h8h') + ' (nothing): <b>bet</b> — air at the bottom of your range, betting is its only way to win.', h('AsKc') + ' (top pair, top kicker): <b>bet</b> — value at the top.', h('7d6d') + ' (middle pair): <b>check</b> — some showdown value, and a bet only gets called by better and folds worse.', h('Ah5c') + ' (ace-high): <b>check</b> — showdown value, hates a check-raise.'])}
    <p>Exceptions: on very dry boards, weak top pair can check to stay disguised and bet later; on draw-heavy boards, widen value bets with strong non-top-pair hands such as A-T on J-T-6.</p>
    ${X.w('polarcbet', 'Your 100% button range on a random flop', ['Each new flop sorts every combo in your range into air (bet), middle (check) and value plus draws (bet).', 'The tiles show the overall betting frequency and the share of bets that are for value.'])}
    <h3>3. In the big blind (out of position)</h3>
    ${X.w('rangeview', 'A starting defend range against a button raise', null, 'T9, JT, J9, Q9+, K9+, K8s, A8-AJ, A2s+, 65s, 76s, 87s, 98s, 22-88')}
    <p>Value 3-bets: 9-9 and better, A-Q, A-K, K-Q. Adjust to your opponent.</p>
    ${X.t(['Action', 'Hands'], [['Check-call', 'Weak and medium top pairs, middle pairs, some bottom pairs against players who rarely barrel, strong ace- and king-high draws, sometimes sets on very dry boards'], ['Check-raise', 'Very strong hands you\'ll stack off with, draws with fold equity, some bottom pairs with a good kicker as semi-bluffs, occasional air against players who c-bet too much — always with a plan for the turn']])}
    ${X.ex('slow-playing a set on a dry board', ['You defend ' + h('2s2d') + '. Flop ' + h('Th5c2h') + '. You check; they bet.', 'Few hands can call a check-raise on this dry flop.', 'Many turns (J, Q, K, A) give them top pair or a reason to bluff.'], { result: 'Check-call, then consider check-raising a scare-card turn.' })}
    <h3>4. After you 3-bet</h3>
    <ul><li>3-bet to about 10x out of position; plan sizes so a third barrel still has fold equity.</li><li>Barrel top pair and overpairs; c-bet air on dry boards and fire overcard turns.</li><li>Usually check-fold A-K on boards like 5-6-7 that hit their calling range.</li></ul>
    ${X.w('tool:pushfold', 'Short-stacked heads-up: push or fold', ['When stacks get short (about 15bb or less), heads-up play becomes all-in or fold. The left grid is the small blind\'s shoving range; the right is the big blind\'s calling range. This is covered in the Advanced course.'])}
    ${X.sum(['Button: open everything; bet top and bottom, check the middle.', 'Big blind: a tight-ish defend range; check-call medium hands, check-raise strong hands and good draws.', '3-bet pots: barrel strength, give up on boards that hit their range.'])}`,
    quiz: [{ q: 'Heads-up, you open J-T on the button. Flop K-T-5, checked to you. Framework says…', opts: ['Bet: you have a pair', 'Check: it\'s the middle of your range', 'Shove', 'Bet small for information'], a: 1, why: 'Second pair is a middle hand: check for pot control.' }, { q: 'A-Q on 7-8-T, heads-up in position. Framework says…', opts: ['Bet as a bluff', 'Check: ace-high has showdown value and hates a check-raise', 'Bet for value', 'Overbet'], a: 1, why: 'Ace-high sits in the middle of the range, like A♥5♣ in the worked example.' }, { q: 'Which hand is NOT in the starting value 3-bet range out of position?', opts: ['A-K', 'K-Q', 'Q-J', '9-9'], a: 2, why: 'Q-J is a call: his range dominates it too often.' }] });

  X.L({ id: 'eg-conclusion', course: 'easygame', title: 'The basics: conclusion', mins: 4, sum: 'Get value and don\'t pay off. People bluff you less often than you think.',
    html: `${X.book('The Basics: Conclusion')}
    ${X.goals(['The two habits that beat small stakes', 'Where to go next'])}
    <p>Part one of the book adds up to a solid "A-B-C" game: choose hands that play well after the flop, know why you bet, size for value, read players by type, and manage the pot.</p>
    ${X.key('The two keys', '<ol><li><b>Get value</b> — bet your good hands, bigger than feels comfortable.</li><li><b>Don\'t pay off</b> — especially passive players who suddenly raise.</li></ol>People are bluffing you less than you think.')}
    <p>Next steps in Felt Lab: the <a href="#course-advanced">Advanced theory</a> course covers the game-theory ideas behind balance, bluff ratios and exploitation. Practise everything from this course with the <a href="#drill-easygame">Easy Game concepts drill</a>.</p>`,
    quiz: [{ q: 'The conclusion\'s key belief about opponents:', opts: ['Everyone bluffs too much', 'People bluff you less often than you think', 'Always call the river', 'Position doesn\'t matter'], a: 1, why: 'So fold to passive aggression and value bet relentlessly.' }] });
})();

;
/* ===== Course: Advanced theory ===== */
(function () {
  const UI = window.UI, X = UI.LX, h = X.h;
  UI.COURSES.push({ id: 'advanced', title: 'Advanced theory', blurb: 'Game theory foundations and how to exploit opponents: defence frequencies, bluff ratios, sizing, range and nut advantage, blockers, push/fold and ICM — each formula derived step by step.', lessons: ['preflop-ranges', 'gto-vs-exploit', 'mdf', 'polar-merged', 'bluff-ratios', 'geometric', 'board-texture', 'blockers', 'realization', 'multiway', 'toy-akq', 'pushfold', 'icm', 'hud-stats'] });

  X.L({ id: 'preflop-ranges', course: 'advanced', title: 'Building preflop ranges', mins: 9, sum: 'Why ranges widen toward the button, why the small blind 3-bets or folds, and why the big blind defends so widely.',
    html: `${X.goals(['Why opening ranges widen toward the button', 'Why the small blind prefers to 3-bet or fold', 'Why the big blind can defend so many hands', 'How to adapt the baselines'])}
    ${X.terms([['Opening range', 'The hands you raise when everyone before you has folded.'], ['Defending range', 'The hands you continue with (call or 3-bet) against a raise.'], ['Baseline', 'A sensible default range before adjusting to specific opponents.']])}
    <h3>1. Opening ranges widen as you approach the button</h3>
    <p>Two things change as you move toward the button: fewer players are left to act behind you (so fewer can wake up with a strong hand), and you are more likely to have position after the flop. Both make more hands profitable.</p>
    ${X.t(['Seat', 'Players left behind', 'Baseline open'], [['UTG', '5', '≈17%'], ['HJ', '4', '≈22%'], ['CO', '3', '≈30%'], ['BTN', '2 (blinds)', '45–50%'], ['SB', '1 (big blind)', '≈40%']], [1, 2])}
    <h3>2. Small blind: 3-bet or fold</h3>
    <p>If the small blind just calls a raise, the big blind can squeeze (3-bet) with a strong range, and even when it doesn\'t, the small blind plays the whole hand out of position. A raise-or-fold strategy avoids both problems.</p>
    <h3>3. Big blind: defend widely</h3>
    ${X.ex('the price the big blind gets', ['The button opens to 2.5bb. The small blind folds.', 'The big blind has already posted 1bb, so calling costs 1.5bb more.', 'Final pot if called: 2.5 + 2.5 + 0.5 (the small blind\'s dead chips) = 5.5bb.', 'Required equity = 1.5 ÷ 5.5 = <b>27%</b>.'], { result: 'Many weak-looking hands have 27%+ against a wide button range — so the big blind defends a lot (though being out of position means it should defend fewer than the raw price suggests; see the equity realisation lesson).' })}
    ${X.w('tool:charts', 'All baseline charts', ['Red = raise (or 3-bet), green = call, empty = fold. Choose any situation on the left.'])}
    ${X.note('Adapt to the table', 'Widen against weak players (isolation); tighten when aggressive players sit behind you. The Easy Game course covers both.')}
    ${X.sum(['Opens widen toward the button: fewer players behind and more position.', 'Small blind: 3-bet or fold. Big blind: good price, defend widely.'])}`,
    quiz: [{ q: 'Why does the big blind defend so widely against a button raise?', opts: ['It has position', 'It gets a great price, having already posted 1bb', 'The button always bluffs', 'Rake'], a: 1, why: 'Calling 1.5bb to win a 5.5bb pot needs only about 27%.' }, { q: 'Why does the small blind prefer 3-bet-or-fold?', opts: ['It has position', 'Calling invites a squeeze and plays out of position', 'It has the best price', 'The rules require it'], a: 1, why: 'Calling leaves it squeezable and out of position for the whole hand.' }] });

  X.L({ id: 'gto-vs-exploit', course: 'advanced', title: 'Game theory optimal vs exploitative play', mins: 9, sum: 'Equilibrium is a defence that can\'t be beaten; exploitation is how you make the most money against real opponents.',
    html: `${X.goals(['What "game theory optimal" (GTO) means — and what it doesn\'t', 'What exploitative play is', 'A practical way to combine them'])}
    ${X.terms([['Nash equilibrium', 'A pair of strategies where neither player can gain by changing their own strategy alone.'], ['Game theory optimal (GTO)', 'Your half of an equilibrium. It can\'t be exploited, but it doesn\'t punish mistakes as hard as possible.'], ['Exploitative play', 'Deviating from equilibrium to profit from an opponent\'s specific mistakes.'], ['Counter-exploit', 'The opponent adjusting to punish your deviation.']])}
    <h3>1. Equilibrium is a defence</h3>
    <p>If you play an equilibrium strategy, the best your opponent can do is break even against it (apart from structural edges such as position). That makes it a safe baseline. But against a player who, say, never bluffs, equilibrium still calls some bets with bluff-catchers — leaving money on the table.</p>
    <h3>2. Exploitation is the profit engine</h3>
    ${X.ex('exploiting a player who folds too much', ['You bet the pot as a bluff. A pot-sized bluff breaks even when they fold half the time (bet ÷ (pot + bet) = 1 ÷ 2).', 'Equilibrium says they should continue with half their range.', 'This opponent actually folds 70%.', 'Your bluff\'s EV, measured in pots: 0.7 × 1 − 0.3 × 1 = <b>+0.4 pots</b> every time.'], { result: 'Against this player, bluff more than equilibrium would — every extra bluff earns.' })}
    <p>Each exploit exposes you to a counter-exploit, but only if the opponent notices and adapts — many never do.</p>
    ${X.key('The working model', '<ol><li>Start from a sound baseline.</li><li>Identify the opponent\'s biggest leak.</li><li>Deviate in the direction that punishes it, only as far as you trust the read.</li></ol>Easy Game\'s player-type plans are exactly this.')}
    ${X.w('tool:toygames', 'See equilibrium in a game small enough to solve', ['Start with the "Polarised river game". Tap "Set both to equilibrium", then move one slider at a time and read the message underneath.', 'The "AKQ game" tab has its own lesson.'])}
    ${X.sum(['GTO = unexploitable baseline.', 'Exploitation = deviating to punish leaks.', 'Baseline first, then exploit the biggest leak.'])}`,
    quiz: [{ q: 'Against a calling station, the most profitable adjustment from equilibrium is…', opts: ['Bluff more', 'Value bet thinner and bluff less', 'Play exact GTO', 'Check more'], a: 1, why: 'He calls too much: get value from worse hands, stop bluffing.' }, { q: 'The main benefit of an equilibrium strategy is…', opts: ['Maximum profit against everyone', 'It cannot be exploited', 'It bluffs a lot', 'It is simple'], a: 1, why: 'It is a defensive baseline.' }] });

  X.L({ id: 'mdf', course: 'advanced', title: 'Minimum defence frequency and alpha', mins: 10, sum: 'How often you must continue so bluffs don\'t print money, and how often a bluff needs to work — derived step by step.',
    html: `${X.goals(['Where minimum defence frequency (MDF) comes from', 'Alpha: the break-even fold rate for a bluff', 'Why MDF is a guide for your range, not a rule for one hand'])}
    ${X.terms([['Minimum defence frequency (MDF)', 'The share of your range you must continue with so that an opponent can\'t profit by betting any two cards.'], ['Alpha (α)', 'How often a pure bluff must work to break even.'], ['Defend', 'Call or raise rather than fold.']])}
    <h3>1. Deriving MDF</h3>
    ${X.ex('where the formula comes from', ['Your opponent bets B into a pot P with a pure bluff — a hand that never wins if called.', 'You defend with a share d of your range. When you fold (share 1 − d), they win P. When you defend (share d), they lose B.', 'Their EV = (1 − d) × P − d × B.', 'They can\'t profit from any-two-card bluffs when this is 0: (1 − d) × P = d × B.', 'Solve for d: <b>d = P ÷ (P + B)</b>.'])}
    ${X.f('MDF = pot ÷ (pot + bet)&nbsp;&nbsp;&nbsp;&nbsp;Alpha = bet ÷ (pot + bet)', [['pot', 'before the bet'], ['bet', 'their bet size']], 'MDF + alpha = 100%: alpha is how often you\'d have to fold for a bluff to break even.')}
    ${X.ex('a half-pot bet', ['Pot 10, bet 5.', 'MDF = 10 ÷ 15 = <b>66.7%</b>: defend at least two-thirds of your range.', 'Alpha = 5 ÷ 15 = <b>33.3%</b>: a half-pot bluff needs a third of the time to work.'])}
    ${X.w('mdf', 'Defence frequency by bet size', ['Slide the bet size. The steps show MDF, alpha and the equity a caller needs; the bar shows the share of your range to defend.'])}
    ${X.w('sizeladder', 'The landmark sizes')}
    ${X.warn('MDF is about your whole range', 'It assumes the bettor could be bluffing with nothing. If your opponent rarely bluffs (Easy Game: people bluff less than you think), folding more than MDF is correct. Use MDF to spot when <i>you</i> are folding far too much, not to justify hero calls against passive players.')}
    ${X.turn('Your opponent bets twice the pot. What are MDF and alpha?', '<ol><li>Pot 1, bet 2.</li><li>MDF = 1 ÷ 3 = <b>33%</b>.</li><li>Alpha = 2 ÷ 3 = <b>67%</b>.</li></ol>')}
    ${X.sum(['MDF = P ÷ (P + B); alpha = B ÷ (P + B).', 'Half pot: defend 67%; pot: 50%; 2× pot: 33%.', 'Fold more than MDF against players who rarely bluff.'])}`,
    quiz: [{ q: 'MDF against a half-pot bet?', opts: ['50%', '66.7%', '75%', '33%'], a: 1, why: '10 ÷ (10 + 5) = 66.7%.' }, { q: 'Against a known non-bluffer, MDF suggests…', opts: ['Still defend 67% against a half-pot bet', 'Folding more is correct — MDF assumes bluffs exist', 'Raising more', 'Nothing changes'], a: 1, why: 'MDF protects you against any-two-card bluffs; if there are none, fold more.' }, { q: 'Alpha for a pot-sized bluff?', opts: ['33%', '50%', '67%', '100%'], a: 1, why: '1 ÷ (1 + 1) = 50%.' }] });

  X.L({ id: 'polar-merged', course: 'advanced', title: 'Polarised and merged ranges', mins: 10, sum: 'Big bets suit nuts-or-air ranges; small bets suit wide, medium-strength ranges.',
    html: `${X.goals(['The difference between polarised, merged and capped ranges', 'Which bet sizes suit each', 'How the polarised river game shows it'])}
    ${X.terms([['Polarised range', 'Strong hands and bluffs, with few medium hands.'], ['Merged (linear) range', 'The strongest hands down to some cut-off, with few or no bluffs.'], ['Capped range', 'A range missing its strongest hands, usually because it only called earlier.'], ['Bluff-catcher', 'A hand that beats only bluffs and loses to every value bet.']])}
    <h3>1. Which size for which range</h3>
    ${X.t(['Range', 'Best sizes', 'Why'], [['Polarised', 'Large (¾ pot and up, even overbets)', 'Value hands want maximum money in; bluffs want maximum fold equity'], ['Merged', 'Small (⅓ to ½ pot)', 'You want calls from slightly worse hands and to deny equity cheaply'], ['Facing a capped range', 'Big polarised bets gain power', 'They can\'t have the nuts, so they can\'t punish your bluffs with raises']])}
    ${X.ex('why a polarised range bets big', ['River. Your range is half the nuts and half air. Your opponent holds a bluff-catcher.', 'With a small bet, the nuts win little extra and your bluffs fold out very little.', 'With a pot-sized bet, the nuts win a full pot when called, and each bluff needs only 50% folds to break even.'], { result: 'Polarised ranges extract most with big bets.' })}
    ${X.w('polar', 'The polarised river game', ['Bet size and value share set up the situation. The two strategy sliders are the bettor\'s bluffing rate and the caller\'s calling rate.', 'Tap "Set both to equilibrium", then move one slider: the message explains how the other player should punish the change.', 'EV here is measured in shares of the pot (the pot is 1).'])}
    ${X.sum(['Polarised → big bets. Merged → small bets.', 'Capped opponents are vulnerable to big polarised bets.'])}`,
    quiz: [{ q: 'Which bet size suits a polarised river range?', opts: ['Tiny', 'Large', 'Exactly ⅓ pot', 'Check'], a: 1, why: 'Value wants size; bluffs want fold equity.' }, { q: 'A range missing its strongest hands because it only called earlier is…', opts: ['Polarised', 'Merged', 'Capped', 'Linear'], a: 2, why: 'Capped: the top is missing.' }] });

  X.L({ id: 'bluff-ratios', course: 'advanced', title: 'Balanced bluff-to-value ratios', mins: 10, sum: 'On the river, your share of bluffs should equal the caller\'s required equity. Earlier streets carry more bluffs.',
    html: `${X.goals(['Why a balanced river range has a specific share of bluffs', 'The formula, derived from the caller\'s point of view', 'Why flop and turn ranges carry more bluffs'])}
    ${X.terms([['Balanced', 'Mixing bluffs and value so the caller is indifferent between calling and folding a bluff-catcher.'], ['Value-to-bluff ratio', 'How many value combos you bet for each bluff combo.']])}
    ${X.ex('deriving the river bluff share', ['You bet B into pot P. The caller holds a bluff-catcher. A share x of your bets are bluffs.', 'If they call and you\'re bluffing (share x), they win P + B (the pot plus your bet).', 'If they call and you have value (share 1 − x), they lose their call B.', 'They are indifferent when x × (P + B) = (1 − x) × B.', 'Solve: <b>x = B ÷ (P + 2B)</b> — exactly the caller\'s required equity from the pot odds lesson.'])}
    ${X.f('River bluff share = bet ÷ (pot + 2 × bet)')}
    ${X.t(['River bet', 'Bluffs in range', 'Value : bluff'], [['⅓ pot', '20%', '4 : 1'], ['½ pot', '25%', '3 : 1'], ['¾ pot', '30%', '2.3 : 1'], ['Pot', '33%', '2 : 1'], ['2× pot', '40%', '1.5 : 1']], [1, 2])}
    ${X.ex('building a pot-sized river range', ['You have 20 value combos and bet the pot.', 'Bluffs should be 33% of the betting range, so value is 67%: total = 20 ÷ 0.67 = 30 combos.', 'So add <b>10 bluff combos</b> (a 2 : 1 ratio).'])}
    <h3>Earlier streets</h3><p>On the flop and turn, your "bluffs" are usually draws that can still become value. So earlier streets carry more of them: a common rule of thumb is about 2 bluffs per value combo on the flop and about 1 : 1 on the turn, narrowing to the river ratio.</p>
    ${X.w('tool:sizing', 'Ratios and frequencies for any size', ['The right-hand chart plots MDF, alpha, the balanced river bluff share and the caller\'s required equity for every bet size. The table lists the landmark sizes.'])}
    ${X.sum(['River bluff share = B ÷ (P + 2B) = the caller\'s required equity.', 'Pot-size bet: 2 value : 1 bluff.', 'More bluffs (draws) on earlier streets.'])}`,
    quiz: [{ q: 'A pot-sized river bet with a balanced range contains what share of bluffs?', opts: ['50%', '33%', '25%', '20%'], a: 1, why: '1 ÷ (1 + 2) = 33%.' }, { q: 'You have 30 value combos and bet half the pot. How many bluffs balance it?', opts: ['5', '10', '15', '30'], a: 1, why: 'Bluffs = 25%, value 75% → total 40 → 10 bluffs (3 : 1).' }] });

  X.L({ id: 'geometric', course: 'advanced', title: 'Geometric sizing and stack-to-pot ratio', mins: 9, sum: 'Bet the same fraction each street and the stacks go in exactly by the river.',
    html: `${X.goals(['What stack-to-pot ratio (SPR) tells you', 'The geometric sizing formula and how to use it', 'Why 3-bet pots use smaller bets'])}
    ${X.terms([['Stack-to-pot ratio (SPR)', 'Effective stack ÷ pot on the flop.'], ['Geometric sizing', 'Betting the same fraction of the pot each remaining street so the last bet is exactly all-in.']])}
    <h3>1. SPR</h3>
    ${X.t(['SPR', 'What it means'], [['Under 3', 'Top pair or better is usually happy to get all-in'], ['3–8', 'Medium; plan carefully'], ['Over 8', 'Deep: one pair loses value; position and very strong hands matter more']])}
    <h3>2. Geometric sizing</h3>
    ${X.f('fraction = ( ((P + 2S) ÷ P)<sup>1/n</sup> − 1 ) ÷ 2', [['P', 'pot now'], ['S', 'effective stack behind'], ['n', 'streets left (3 on the flop)']], 'Why: each street, a called bet of f × pot multiplies the pot by (1 + 2f). After n streets the pot must equal P + 2S.')}
    ${X.ex('a 3-bet pot', ['Pot 20bb, 80bb behind, on the flop (3 streets).', '(P + 2S) ÷ P = (20 + 160) ÷ 20 = 9.', 'Cube root of 9 ≈ 2.08.', 'fraction = (2.08 − 1) ÷ 2 = <b>0.54 → bet 54% of the pot each street</b>.', 'Check: flop bet 10.8 → pot 41.6; turn bet 22.5 → pot 86.5; river bet 46.7 → all 80bb are in.'])}
    ${X.ex('a single-raised pot', ['Pot 6bb, 97bb behind, 3 streets.', '(6 + 194) ÷ 6 = 33.3; cube root ≈ 3.22.', 'fraction = (3.22 − 1) ÷ 2 ≈ <b>1.11 → about 111% of the pot</b> each street.'], { result: 'Deep, single-raised pots need big bets to get stacks in; 3-bet pots only need about half-pot bets. That is why bets are smaller in 3-bet pots.' })}
    ${X.w('tool:sizing', 'Plan the streets', ['Enter the pot and stack; the left card gives the geometric size and the pot and stack after each street.', 'Try your own percentages below to see what is left behind.'])}
    ${X.turn('Pot 20bb, 80bb behind, only two streets left. Geometric size?', '<ol><li>(20 + 160) ÷ 20 = 9.</li><li>Square root (n = 2) = 3.</li><li>(3 − 1) ÷ 2 = <b>1 → a pot-sized bet</b> on each street.</li></ol>')}
    ${X.sum(['SPR = stack ÷ pot; low SPR simplifies commitment.', 'Geometric fraction = (((P + 2S) ÷ P) to the power 1/n − 1) ÷ 2.'])}`,
    quiz: [{ q: 'Pot 20bb, 80bb behind, two streets left. Geometric bet size?', opts: ['About 50% pot', 'About 75% pot', 'About 100% pot', 'About 33% pot'], a: 2, why: '180 ÷ 20 = 9; √9 = 3; (3 − 1) ÷ 2 = 1 → pot-sized.' }, { q: 'Why are bets smaller in 3-bet pots?', opts: ['Players are scared', 'The SPR is lower, so smaller geometric bets get stacks in', 'Rules', 'Rake'], a: 1, why: 'Pot 20, 80 behind needs only about 54% per street.' }] });

  X.L({ id: 'board-texture', course: 'advanced', title: 'Range advantage, nut advantage and board texture', mins: 10, sum: 'Who does this flop favour — on average and at the top? That decides how often and how big to bet.',
    html: `${X.goals(['The difference between range advantage and nut advantage', 'Which flop textures favour the preflop raiser and which favour the caller', 'How each advantage shapes your continuation-bet strategy'])}
    ${X.terms([['Range advantage', 'Your range has more average equity than theirs on this board.'], ['Nut advantage', 'Your range holds more of the very strongest hands.'], ['Texture', 'How connected and suited a board is: dry, wet, monotone, paired.']])}
    <h3>1. Who does the flop favour?</h3>
    ${X.t(['Flop type', 'Example', 'Usually favours'], [['High, dry', 'A♥7♣2♦', 'Preflop raiser (more A-x, big pairs)'], ['Broadway', 'K♦Q♥T♣', 'Preflop raiser'], ['Low, connected', '7♥6♠5♦', 'Big-blind caller (more suited connectors, small pairs)'], ['Paired / monotone', '8♣8♦3♠ / J♥8♥3♥', 'Equities closer together']])}
    ${X.ex('reading a flop', ['Button opens; big blind calls. Flop ' + h('Ah7c2d') + '.', 'The button has every A-x it opened, plus A-A and 7-7; the big blind 3-bets many of its best aces, so they are missing from its calling range.', 'The button has both a range advantage and a nut advantage — use the figure below to see the size of it.'], { result: 'Bet often and small: the button\'s whole range benefits.' })}
    ${X.w('texture', 'Range advantage on six classic flops', ['Tap a flop type or a random flop. The tiles show the button range\'s overall equity against the big blind\'s range, and each range\'s share of two pair or better.'])}
    ${X.key('Rule of thumb', 'Big range advantage → bet a large share of your range, small. Nut advantage without range advantage → bet a polarised range, big. Neither → check more.')}
    ${X.sum(['Range advantage = higher average equity; nut advantage = more top hands.', 'High dry boards favour the raiser; low connected boards favour the caller.'])}`,
    quiz: [{ q: 'Button opens, big blind calls. Which flop most favours the big blind?', opts: ['A♣K♦3♥', '7♥6♠5♦', 'K♠K♦2♣', 'A♠7♣2♦'], a: 1, why: 'Low connected boards hit the big blind\'s wide, connected calling range.' }, { q: 'With a big range advantage, a good default is…', opts: ['Bet big and rarely', 'Bet often and small', 'Always check', 'Overbet'], a: 1, why: 'Your whole range benefits, so bet frequently with a small size.' }] });

  X.L({ id: 'blockers', course: 'advanced', title: 'Blockers and card removal', mins: 9, sum: 'The cards in your hand change what your opponent can hold — use that to pick bluffs and bluff-catchers.',
    html: `${X.goals(['How your cards remove combos from your opponent\'s range', 'What makes a good bluff and a good bluff-catcher', 'When blockers matter and when they don\'t'])}
    ${X.terms([['Blocker', 'A card you hold that reduces the combos of a hand your opponent could have.'], ['Unblock', 'Holding cards that leave the opponent\'s bluffs (or calling hands) unaffected.']])}
    ${X.ex('blocking the nut flush', ['River board ' + h('Kh9h4c2h7s') + ': three hearts. Hearts you can\'t see: 13 − 3 = 10.', 'Two-heart combos with no blockers = 10 × 9 ÷ 2 = <b>45</b>. Nine of them contain the A♥ (the nut flush).', 'If you hold the A♥: hearts left = 9, so 9 × 8 ÷ 2 = <b>36</b> flush combos — and <b>none</b> is the nut flush.'], { result: 'Holding the A♥ makes the nut flush impossible for your opponent and cuts their flushes by a fifth.' })}
    ${X.w('blockers', 'How your cards change their flush combos', ['Pick a hand. The tiles show flush combos with no blockers, combos still possible given your cards, and how many of those are ace-high (nut) flushes.'])}
    <h3>Using blockers</h3><ul><li><b>Good bluffs</b> block the hands that would call (here, the A♥) and don\'t block the hands you want to fold.</li><li><b>Good bluff-catchers</b> don\'t block the opponent\'s bluffs. If all their missed draws are spades and you hold two spades, you remove their bluffs and make your call worse.</li><li>Blockers are a tie-breaker between similar hands, not a reason for a play by themselves.</li></ul>
    ${X.turn('Board K♥9♥4♣2♥7♠. You hold Q♥J♣. How many two-heart flush combos can your opponent have?', '<ol><li>Hearts unseen: 13 − 3 (board) − 1 (your Q♥) = 9.</li><li>Combos = 9 × 8 ÷ 2 = <b>36</b>.</li></ol>')}
    ${X.sum(['Visible cards remove combos: count before deciding.', 'Bluff with hands that block their calls; catch bluffs with hands that don\'t block their bluffs.'])}`,
    quiz: [{ q: 'Three hearts on the river. Your best bluff candidate is…', opts: ['A hand with the A♥', 'A hand with two low hearts', 'A pair', 'Any hand'], a: 0, why: 'It blocks the nut flush, the hand most likely to call.' }, { q: 'Three hearts on board, you hold one heart. Two-heart combos left for your opponent?', opts: ['45', '36', '28', '55'], a: 1, why: '9 hearts unseen → 9 × 8 ÷ 2 = 36.' }] });

  X.L({ id: 'realization', course: 'advanced', title: 'Equity realisation and position', mins: 7, sum: 'Raw equity overstates hands that play badly out of position, and understates good hands in position.',
    html: `${X.goals(['What equity realisation (EQR) is', 'What makes a hand realise more or less of its equity', 'How it changes calling decisions'])}
    ${X.terms([['Raw equity', 'Equity if all cards were dealt with no more betting.'], ['Equity realisation (EQR)', 'The share of raw equity a hand actually turns into winnings once future betting is included. Above 100% means it wins more than its raw share.']])}
    <h3>1. The idea</h3>
    <p>Equity assumes you always reach showdown. In practice you sometimes fold your equity to bets, and sometimes win more than your share by betting well. A hand with 30% raw equity that realises 80% of it effectively has 24%.</p>
    ${X.ex('why a price can mislead (illustrative numbers)', ['Big blind against a button open: you need 27% to call (preflop ranges lesson).', 'Say an offsuit, unconnected hand like ' + h('Kc6d') + ' has around 30% raw equity against the button\'s range. On price alone, call.', 'But out of position it often has to fold to bets on the flop or turn. If it realises only about 70% of its equity, its effective equity is about 0.70 × 30% = 21%.'], { result: 'Below the 27% needed — a fold, despite the price. A suited connector with the same raw equity realises more and becomes a call.' })}
    ${X.t(['Factor', 'Effect on realisation'], [['Position', 'In position realises more'], ['Playability', 'Suited and connected hands realise more than disconnected offsuit hands'], ['Stack depth', 'Deeper stacks amplify position and skill'], ['Range strength', 'Capped, weak ranges get bet off their equity']])}
    ${X.sum(['Effective equity ≈ raw equity × realisation.', 'Position and playability raise realisation.'])}`,
    quiz: [{ q: 'Which hand realises its equity best from the big blind against a button raise?', opts: ['K♣6♦', '8♠7♠', 'Q♦3♣', 'J♥4♣'], a: 1, why: 'Suited, connected hands keep equity on more flops and turns.' }, { q: 'Raw equity 30%, realisation 70%. Effective equity?', opts: ['21%', '30%', '43%', '70%'], a: 0, why: '0.70 × 30% = 21%.' }] });

  X.L({ id: 'multiway', course: 'advanced', title: 'Multiway pots', mins: 7, sum: 'More players: higher value thresholds, fewer bluffs, and more value for hands that make strong hands.',
    html: `${X.goals(['How equity changes as opponents are added', 'Why bluffs lose value fast in multiway pots'])}
    ${X.terms([['Multiway pot', 'A pot with three or more players.'], ['Fair share', 'With n players in the pot, 1 ÷ n of it.']])}

  function gsStatusHTML() {
    if (!GS.cfg) return 'Not set up on this device.';
    const t = GS.last ? new Date(GS.last).toLocaleString([], { hour: 'numeric', minute: '2-digit', day: 'numeric', month: 'short' }) : null;
    return { syncing: `${UI.spinner} Syncing…`, on: `<span class="pill g">On</span> Last synced ${t}.`, offline: `<span class="pill w">Offline</span> Changes are saved here and will sync when you reconnect.`, error: `<span class="pill r">Problem</span> ${esc(GS.err || '')}`, off: '<span class="pill">Connected</span> Waiting to sync…' }[GS.status] || '';
  }
  const pushSoon = UI.debounce(() => GS.sync(), 15000);
  UI.onSave(() => { if (GS.cfg && !GS.busy) { GS.dirty = true; pushSoon(); } });
  window.addEventListener('online', () => GS.cfg && GS.sync());
  document.addEventListener('visibilitychange', () => { if (!GS.cfg) return; if (document.visibilityState === 'hidden' && GS.dirty) GS.sync(); else if (document.visibilityState === 'visible' && (!GS.last || Date.now() - GS.last > 60000)) GS.sync(); });

  async function initCloud() {
    if (!window.claude || typeof window.claude.use !== 'function') return;
    try {
      const timeout = new Promise(r => setTimeout(() => r(null), 10000));
      const [db, user, dl] = await Promise.all([Promise.race([window.claude.use('db'), timeout]), Promise.race([window.claude.use('user'), timeout]), Promise.race([window.claude.use('downloads'), timeout])]);
      Sync.downloads = dl || null;
      if (!db || !user) { Sync.status = 'unavailable'; return; }
      const uid = await user.id(); if (!uid) { Sync.status = 'signedout'; return; }
      Sync.db = db; Sync.uid = uid; Sync.status = 'on';
      const ref = db.doc('data/users/' + uid + '/progress');
      const snap = await ref.get();
      if (snap.exists) {
        const remote = snap.data().state; const local = UI.S();
        if (remote && remote.updated > local.updated) { UI.replaceState(UI.mergeStates(local, remote)); UI.toast('Progress synced from your account'); UI.render(); }
      }
      Sync.last = Date.now();
      let pushing = false, again = false;
      const push = UI.debounce(async () => { if (pushing) { again = true; return; } pushing = true; try { await ref.set({ state: compact(UI.S()), at: Date.now() }); Sync.last = Date.now(); Sync.status = 'on'; } catch (e) { Sync.status = 'error'; Sync.err = e && e.code; } pushing = false; if (again) { again = false; push(); } }, 8000);
      UI.onSave(() => push());
      push();
    } catch (e) { Sync.status = 'error'; }
  }
  UI.exportJSON = () => JSON.stringify(Object.assign({ app: 'feltlab', exported: Date.now() }, UI.S()));
  async function saveFile(name, text) {
    if (Sync.downloads) { try { await Sync.downloads.save({ filename: name, data: text }); return true; } catch (e) { } }
    try { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: 'application/json' })); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000); return true; } catch (e) { return false; }
  }
  const IS_HOSTED = !!(window.claude && typeof window.claude.use === 'function');

  UI.route('settings', main => {
    const S = UI.S(); const st = S.settings;
    const syncTxt = { on: `On — your progress is saved to your Claude account${Sync.last ? ' (last sync ' + new Date(Sync.last).toLocaleTimeString() + ')' : ''}.`, off: IS_HOSTED ? 'Connecting…' : PWA.ok ? 'This is the installed app. Progress is stored on this device — use backup below to move it to another device or to the Claude link.' : 'This is the offline copy. Progress is stored on this device only — use backup below to move it.', unavailable: 'Not available in this view.', signedout: 'Sign in to Claude to sync.', error: 'Sync hit an error — your progress is still saved on this device.' }[Sync.status];
    main.innerHTML = `<div class="band"><div class="narrow"><a class="crumb" href="#more">${UI.icon('back', 18)} More</a><h1>Settings &amp; sync</h1>
      <div class="card"><h3>Appearance</h3><label class="f">Theme<div class="seg" data-th>${['system', 'light', 'dark'].map(t => `<button data-v="${t}" class="${st.theme === t ? 'on' : ''}">${t[0].toUpperCase() + t.slice(1)}</button>`).join('')}</div></label><label class="check"><input type="checkbox" data-four ${st.four ? 'checked' : ''}> Four-colour deck (blue diamonds, green clubs)</label><div class="row">${UI.cardsHTML(PK.parseCards('AsKhQdJc'), 'sm')}</div></div>
      ${IS_HOSTED ? `<div class="card mt"><h3>${UI.icon('cloud', 20)} Online sync</h3><p>${esc(syncTxt)}</p>${Sync.status === 'on' ? `<button class="btn sm" data-sync>Sync now</button>` : ''}
        <p class="small muted">When you open Felt Lab from its link while online, progress saves to a private record in your Claude account and merges automatically. The installed app and the downloaded file keep their own progress; bring it here with Export / Import.</p></div>` : `<div class="card mt"><h3>${UI.icon('cloud', 20)} Sync between your devices</h3><p data-gsstatus>${gsStatusHTML()}</p>
        ${GS.cfg ? `<div class="row"><button class="btn pri" data-gsnow>${UI.icon('refresh', 18)} Sync now</button><button class="btn" data-gskey>Copy sync key</button><button class="btn ghost" data-gsoff>Disconnect this device</button></div><p class="small muted">To add another device (phone, laptop): tap <b>Copy sync key</b>, send it to yourself by email or a notes app, then paste it into Settings on the other device. Treat the key like a password — anyone with it can read and change your progress.</p>`
        : `<p class="ink2">Keep one set of progress across your phone, tablet and laptop. Felt Lab saves it to a private file (a "secret gist") in your GitHub account and merges with it whenever a device opens or comes back online — using two devices offline loses nothing.</p>
        <ol style="padding-left:1.3em;margin:0 0 12px"><li><b>First device only:</b> <a href="https://github.com/settings/tokens/new?scopes=gist&amp;description=Felt%20Lab%20sync" target="_blank" rel="noopener">create a GitHub token</a>. Only the <b>gist</b> box should be ticked. Pick an expiry (or "No expiration"), tap <b>Generate token</b>, and copy it.</li><li>Paste it below and tap <b>Connect</b>.</li><li><b>Every other device:</b> paste the <b>sync key</b> from the first device instead of a token.</li></ol>
        <div class="row"><input type="password" placeholder="GitHub token or Felt Lab sync key" data-gsin style="flex:1;min-width:220px" autocomplete="off" spellcheck="false"><button class="btn pri" data-gscon>Connect</button></div><p class="small" data-gsmsg></p>`}</div>`}
      <div class="card mt"><h3>Backup &amp; move progress</h3><div class="row"><button class="btn" data-exp>${UI.icon('download', 18)} Export progress</button><button class="btn" data-copy>Copy as text</button><label class="btn">${UI.icon('upload', 18)} Import file<input type="file" accept=".json,application/json,text/plain" data-imp hidden></label><button class="btn" data-paste>Paste text</button></div><p class="small muted">Imports are merged with what is already here.</p></div>
      ${PWA.ok ? `<div class="card mt"><h3>${UI.icon('download', 20)} Install as an app</h3><p data-pwa>${PWA.installed ? 'Installed. Felt Lab opens from its home-screen icon and works offline.' : PWA.prompt ? 'Add Felt Lab to your home screen. It opens full-screen and works offline.' : 'In Chrome, tap ⋮ then <b>Install app</b> (or <b>Add to Home screen</b>).'}</p><div class="row">${PWA.prompt && !PWA.installed ? '<button class="btn pri" data-inst>Install Felt Lab</button>' : ''}<button class="btn" data-upd>${UI.icon('refresh', 18)} Check for updates</button><span class="small muted">Version ${esc(window.FELT_VERSION || 'dev')}</span></div><p class="small muted">${PWA.cached ? 'Offline copy stored on this device.' : 'Preparing offline copy…'} ${PWA.persisted ? 'Storage is protected from automatic clean-up.' : ''}</p></div>` : ''}
      ${IS_HOSTED ? `<div class="card mt"><h3>${UI.icon('download', 20)} Offline copy</h3><p>Download Felt Lab as a single file. Open it in Chrome on your tablet in flight mode — everything works without a connection.</p><button class="btn pri" data-off>Download offline file</button><p class="small muted" data-offn></p></div>` : (PWA.ok ? `<div class="card mt"><h3>Sharing</h3><p>Send friends this address: <b>${esc(location.origin + location.pathname)}</b>. They install it the same way, and their progress stays on their own devices — it never mixes with yours.</p></div>` : `<div class="card mt"><h3>Sharing</h3><p>This whole app is one file. Send it to anyone (messaging app, email, USB) — they open it in a browser. Their progress stays on their device.</p></div>`)}
      ${IS_HOSTED ? `<div class="card mt"><h3>Sharing with others</h3><ul><li><b>The link</b>: share the Felt Lab page from its menu in Claude. Each person keeps their own private progress.</li><li><b>The file</b>: send the offline file to any device — phone, tablet, laptop.</li></ul></div>` : ''}
      <div class="card mt"><h3>Reset</h3><p class="small muted">Clears all progress on this device${IS_HOSTED ? ' (your cloud copy is overwritten at the next sync)' : GS.cfg ? ' and on your other synced devices' : ''}.</p><button class="btn red" data-reset>Reset everything</button></div>
      <p class="small muted mt">Felt Lab · equity engine verified against exhaustive 5-card enumeration · ${PK.DATA.N.toLocaleString()} boards per preflop matchup. Easy Game content summarised in our own words with chapter references; the book is © 2009 Andrew Seidman (heads-up chapter © Matt Colletta).</p></div></div>`;
    $$('[data-th] button', main).forEach(b => b.onclick = () => { st.theme = b.dataset.v; UI.save(); UI.applySettings(); UI.render(); });
    $('[data-four]', main).onchange = e => { st.four = e.target.checked; UI.save(); UI.applySettings(); };
    const sy = $('[data-sync]', main); if (sy) sy.onclick = async () => { try { await Sync.db.doc('data/users/' + Sync.uid + '/progress').set({ state: compact(UI.S()), at: Date.now() }); Sync.last = Date.now(); UI.toast('Synced'); UI.render(); } catch (e) { UI.toast('Sync failed'); } };
    $('[data-exp]', main).onclick = async () => { const ok = await saveFile(`felt-lab-progress-${new Date().toISOString().slice(0, 10)}.json`, UI.exportJSON()); if (!ok) UI.toast('Download blocked — use Copy as text'); };
    $('[data-copy]', main).onclick = async () => { try { await navigator.clipboard.writeText(UI.exportJSON()); UI.toast('Copied to clipboard'); } catch (e) { UI.modal(`<h3>Copy this text</h3><textarea style="min-height:200px">${esc(UI.exportJSON())}</textarea><div class="row" style="justify-content:flex-end"><button class="btn pri" data-close>Done</button></div>`); } };
    const doImport = txt => { try { const obj = JSON.parse(txt); if (!obj || !obj.drills || !obj.play) throw 0; UI.replaceState(UI.mergeStates(UI.S(), obj)); UI.save(); UI.toast('Progress imported and merged'); UI.render(); } catch (e) { UI.toast('That doesn\'t look like a Felt Lab export'); } };
    $('[data-imp]', main).onchange = e => { const f = e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => doImport(r.result); r.readAsText(f); };
    $('[data-paste]', main).onclick = () => { const m = UI.modal(`<h3>Paste exported text</h3><textarea data-t style="min-height:200px"></textarea><div class="row" style="justify-content:flex-end"><button class="btn" data-close>Cancel</button><button class="btn pri" data-ok>Import</button></div>`); $('[data-ok]', m.el).onclick = () => { doImport($('[data-t]', m.el).value); m.close(); }; };
    const off = $('[data-off]', main); if (off) off.onclick = async () => {
      const n = $('[data-offn]', main); n.innerHTML = UI.spinner;
      try { let html = null; for (const u of ['felt-lab-offline.html', 'index.html']) { try { const r = await fetch(u); if (r.ok) { html = await r.text(); if (html.includes('PK_RAW')) break; } } catch (e) { } } if (!html) html = '<!DOCTYPE html>' + document.documentElement.outerHTML;
        const ok = await saveFile('felt-lab.html', html); n.textContent = ok ? 'Saved. On Android it lands in Downloads — open it with Chrome.' : 'Your browser blocked the download.'; } catch (e) { n.textContent = 'Download failed.'; }
    };
    const ub = $('[data-upd]', main); if (ub) ub.onclick = () => PWA.check ? PWA.check(true) : UI.toast('Update checks start once the app has finished loading');
    const ib = $('[data-inst]', main); if (ib) ib.onclick = async () => { try { PWA.prompt.prompt(); const r = await PWA.prompt.userChoice; if (r && r.outcome === 'accepted') { PWA.installed = true; PWA.prompt = null; UI.toast('Installed'); } } catch (e) { } UI.render(); };
    const gcon = $('[data-gscon]', main); if (gcon) gcon.onclick = async () => { const msg = $('[data-gsmsg]', main); msg.innerHTML = UI.spinner + ' Connecting…'; gcon.disabled = true; try { await GS.connect($('[data-gsin]', main).value); UI.render(); UI.toast('Sync is on for this device'); } catch (e) { msg.textContent = e.status ? (SYNC_ERR[e.status] || 'GitHub error ' + e.status) : e.message.startsWith('Failed') || e.name === 'TypeError' ? 'Could not reach GitHub. Check you are online.' : e.message; gcon.disabled = false; } };
    const gnow = $('[data-gsnow]', main); if (gnow) gnow.onclick = () => GS.sync(true);
    const gkey = $('[data-gskey]', main); if (gkey) gkey.onclick = async () => { const k = GS.key(); try { await navigator.clipboard.writeText(k); UI.toast('Sync key copied — paste it on your other device'); } catch (e) { UI.modal(`<h3>Your sync key</h3><p class="small muted">Copy this and paste it into Settings on your other device. Keep it private.</p><textarea readonly style="min-height:120px;font-family:monospace;font-size:13px">${esc(k)}</textarea><div class="row" style="justify-content:flex-end"><button class="btn pri" data-close>Done</button></div>`); } };
    const goff = $('[data-gsoff]', main); if (goff) goff.onclick = async () => { if (await UI.confirm('Stop syncing on this device? Your progress stays here and on GitHub; other devices keep syncing.', 'Disconnect')) { GS.disconnect(); UI.render(); } };
    $('[data-reset]', main).onclick = async () => { if (await UI.confirm(GS.cfg ? 'Erase all lessons, drills, hands and settings — on this device <b>and on every synced device</b>?' : 'Erase all lessons, drills, hands and settings on this device?', 'Erase')) { UI.resetState(); if (GS.cfg) GS.sync(); UI.render(); } };
  });

  // ---------- installable app (served over https, top-level only) ----------
  const PWA = UI.PWA = { ok: false, prompt: null, installed: false, cached: false, persisted: false };
  try {
    const top = window.top === window;
    if (top && (location.protocol === 'https:' || location.hostname === 'localhost') && 'serviceWorker' in navigator && !IS_HOSTED) {
      PWA.ok = true;
      PWA.installed = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
      window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); PWA.prompt = e; });
      window.addEventListener('appinstalled', () => { PWA.installed = true; PWA.prompt = null; });
      // Update detection: checks on launch, whenever the app returns to the foreground or reconnects, and on demand.
      const hadController = !!navigator.serviceWorker.controller; let banner = null, lastCheck = 0;
      PWA.showUpdate = () => {
        if (banner) return;
        banner = UI.h('<div class="toast" role="status" style="display:flex;gap:12px;align-items:center;bottom:96px">A new version of Felt Lab is ready <button class="btn sm pri">Reload</button></div>');
        banner.querySelector('button').onclick = async () => { if (GS.cfg && GS.dirty) { try { await GS.sync(); } catch (e) { } } location.reload(); };
        document.body.appendChild(banner);
      };
      const watch = (nw, isUpdate) => { if (!nw) return; nw.addEventListener('statechange', () => { if ((nw.state === 'installed' || nw.state === 'activated') && (hadController || isUpdate)) PWA.showUpdate(); }); };
      navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadController) PWA.showUpdate(); });
      navigator.serviceWorker.register('sw.js').then(reg => {
        PWA.reg = reg;
        navigator.serviceWorker.ready.then(() => { PWA.cached = true; });
        if (reg.waiting && hadController) PWA.showUpdate();
        watch(reg.installing);
        reg.addEventListener('updatefound', () => watch(reg.installing, !!reg.active));
        PWA.check = async (manual) => {
          lastCheck = Date.now(); const hadActive = !!reg.active;
          try { await reg.update(); } catch (e) { if (manual) UI.toast('Could not check — are you online?'); return; }
          const nw = reg.installing || reg.waiting;
          if (nw) { if (manual) UI.toast('Downloading the new version…'); watch(nw, hadActive); if ((nw.state === 'installed' || nw.state === 'activated') && hadActive) PWA.showUpdate(); }
          else if (manual && !banner) UI.toast('You have the latest version');
        };
        document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && Date.now() - lastCheck > 10 * 60000) PWA.check(); });
        window.addEventListener('online', () => PWA.check());
        setInterval(() => { if (document.visibilityState === 'visible') PWA.check(); }, 60 * 60000);
      }).catch(() => { });
      if (navigator.storage && navigator.storage.persist) navigator.storage.persisted().then(p => p || navigator.storage.persist()).then(p => { PWA.persisted = !!p; }).catch(() => { });
    }
  } catch (e) { }

  // ---------- boot ----------
  UI._hostTheme = document.documentElement.getAttribute('data-theme') || null;
  UI.applySettings();
  try { const mo = new MutationObserver(() => { const t = document.documentElement.getAttribute('data-theme'); if (UI.S().settings.theme === 'system' && t) UI._hostTheme = t; }); mo.observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] }); } catch (e) { }
  UI.render();
  setTimeout(initCloud, 0);
  if (GS.cfg && !IS_HOSTED) setTimeout(() => GS.sync(), 1200);
})();
</script>
</body></html>
